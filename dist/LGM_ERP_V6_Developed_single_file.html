<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LGM ERP V6 Developed</title>
<style>
/* ===== Leads Global ERP V6 — Developed =====
   Section 1 is the ORIGINAL V6 visual language (colours, spacing, components) carried over unchanged.
   Section 2 adds only what working forms/tables need (modal, form errors, toast, toolbar, workspace banner). */

/* ---------- 1. V6 base (preserved) ---------- */
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172b43;background:#f2f6fa}
*{box-sizing:border-box}body{margin:0}
.shell{display:flex;min-height:100vh}
aside{width:258px;background:#102b48;color:white;padding:24px 14px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:28px;padding:0 9px}
.logo{background:#fff;color:#15507c;border-radius:12px;font-size:25px;padding:11px}
.brand strong{font-size:15px}.brand small{display:block;color:#a9c3d8;margin-top:5px}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 13px;background:transparent;color:#c9d9e7;border:0;border-radius:9px;text-align:left;cursor:pointer;font-size:14px;margin:3px 0}
nav button.active,nav button:hover{background:#23527a;color:white}
main{flex:1;min-width:0}
header{height:76px;background:#fff;border-bottom:1px solid #e0e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.content{padding:27px;max-width:1400px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:1.3px;color:#63809b;text-transform:uppercase;font-weight:700}
.title{font-size:27px;margin:7px 0 6px}.muted{color:#73869a;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:23px 0}
.card,.panel{background:white;border:1px solid #e0e8f0;border-radius:13px;box-shadow:0 3px 12px #18334b06}
.card{padding:20px}.card .num{font-size:29px;font-weight:800;margin:13px 0 5px}
.panel{padding:22px;margin-top:18px}.panel h3{margin:0 0 17px;font-size:17px}
.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#eaf1fa;color:#315f87;font-size:11px;font-weight:700}
.green{background:#e6f7ef;color:#158154}.orange{background:#fff2de;color:#a76505}.grey{background:#edf0f3;color:#657687}.red{background:#feeaea;color:#b34141}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:#6c8397;font-size:11px;letter-spacing:.5px;text-transform:uppercase;background:#f8fafc}
td,th{padding:13px 10px;border-bottom:1px solid #edf1f5}tr:last-child td{border:0}
.btn{background:#1267a5;color:white;border:0;padding:11px 16px;border-radius:8px;font-weight:650;cursor:pointer;font:inherit;font-weight:650}
.btn.secondary{background:#e9f1f8;color:#245c86}.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1px solid #dbe5ee;background:white;padding:9px 15px;border-radius:8px;cursor:pointer;color:#4a6781;font:inherit}
.tab.selected{background:#145b91;color:white}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}
.step{background:#eef5fb;border-radius:9px;padding:13px;font-size:12px}.step b{display:block;color:#17659c;margin-bottom:8px}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
.bar{background:#e8f0f6;height:10px;border-radius:20px;overflow:hidden;margin:7px 0 17px}.bar>div{height:100%;background:#2984b8;border-radius:20px}
.input{border:1px solid #d8e2ec;border-radius:8px;padding:11px;width:100%;font:inherit;background:#fff}
label{font-size:12px;color:#536d83;font-weight:700;display:block;margin-bottom:6px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.notice{background:#fff7e8;color:#865d18;border:1px solid #f4e0b7;padding:13px;border-radius:9px;font-size:12px;margin-top:16px}
.hidden{display:none}.divider{border-top:1px solid #e8edf2;margin:20px 0}
.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:#eaf3fb;border-radius:7px;padding:10px;font-size:12px}
.flow i{font-style:normal;align-self:center;color:#8aa1b4}
.metric{font-size:22px;font-weight:750}.foot{color:#8da0b1;font-size:11px;margin-top:20px}
.login{display:flex;align-items:center;gap:10px}select{cursor:pointer}
#nav .v6-group{width:100%;display:flex;align-items:center;justify-content:space-between;background:#23527a;color:white;border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:700;text-align:left;margin:6px 0}
#nav .v6-sub{margin-left:14px;width:calc(100% - 14px);font-size:12px;padding:10px 11px}
#nav .v6-section{color:#7fa6c3;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:14px 10px 5px}
.v6-tools{background:#fff;border:1px solid #dce7f0;border-radius:13px;padding:17px;margin:0 0 20px;box-shadow:0 3px 12px #18334b06}
.v6-tools .v6-filter{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}
.v6-tools select{min-width:130px;flex:1;max-width:220px;padding:10px;border:1px solid #cbd9e6;border-radius:8px;background:white;color:#18334b}
.v6-tools button{border:0;border-radius:8px;padding:11px 14px;background:#1765a2;color:white;font-weight:650;cursor:pointer;font:inherit;font-weight:650}
.v6-tools button.secondary{background:#e7f1f9;color:#16547f}
.v6-tools small{color:#6c8093;display:block;margin-top:9px}
.v6-reportlinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.v6-reportlinks button{background:#f1f6fb;color:#205778;font-weight:500;padding:8px 11px}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){aside{width:210px;padding:12px 7px}.content{padding:14px}header{padding:12px;height:auto;flex-wrap:wrap;gap:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- 2. Additions needed by working forms, tables and data separation ---------- */
.btn.small,.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:#fdeaea;color:#a63030}
.btn.ghost{background:transparent;color:#245c86;border:1px solid #cfe0ee}
.table-actions{display:flex;gap:6px;flex-wrap:wrap;min-width:230px}
.table-actions .btn{white-space:nowrap}
td .stagebar{max-width:110px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.toolbar .input{width:auto;min-width:150px;flex:1;max-width:260px;padding:9px 10px}

.empty{padding:26px;text-align:center;color:#8da0b1;font-size:13px}
.count{color:#73869a;font-size:12px;margin-left:auto}
.mode-pill{display:inline-block;padding:5px 10px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:.6px;cursor:pointer;border:0}
.mode-demo{background:#fff2de;color:#a76505}.mode-live{background:#e6f7ef;color:#158154}
.banner{padding:9px 28px;font-size:12px;font-weight:600}
.banner.demo{background:#fff7e8;color:#865d18;border-bottom:1px solid #f4e0b7}
.banner.live{background:#fdeaea;color:#8f2a2a;border-bottom:1px solid #f0c4c4}
.field.err .input{border-color:#d46a6a;background:#fff8f8}.field .errmsg{color:#b34141;font-size:11px;margin-top:4px}
.field .help{color:#8da0b1;font-size:11px;margin-top:4px;font-weight:400}.field.full{grid-column:1/-1}
.req{color:#c04a4a}
.overlay{position:fixed;inset:0;background:#0d233a99;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px #0d233a55}
.modal.narrow{max-width:460px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e8edf2}
.modal-h h3{margin:0;font-size:17px}.modal-x{background:none;border:0;font-size:22px;cursor:pointer;color:#73869a}
.modal-b{padding:22px}.modal-f{padding:14px 22px;border-top:1px solid #e8edf2;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#102b48;color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px #0d233a44;max-width:380px}
.toast.err{background:#a63030}.toast.ok{background:#158154}
.stagebar{display:flex;gap:3px;flex-wrap:wrap;margin:6px 0 0}
.stagebar i{width:12px;height:6px;border-radius:3px;background:#dbe5ee;display:inline-block}.stagebar i.on{background:#2984b8}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}.kv b{color:#536d83}
.list-plain{margin:0;padding-left:18px;font-size:13px;line-height:1.7}
.tag{display:inline-block;background:#eef5fb;color:#3b6a8f;border-radius:5px;padding:2px 7px;font-size:11px;margin:1px 3px 1px 0}
.src{font-size:10px;color:#8da0b1;display:block}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.scroll-x{overflow:auto}
tr.dim td{opacity:.55}
.checklist{list-style:none;margin:0;padding:0}.checklist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:13px;align-items:center}
.checklist .ck{width:20px;height:20px;border-radius:50%;background:#e8f0f6;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0}
.checklist .ck.done{background:#158154}
@media(max-width:760px){.modal-h,.modal-b,.modal-f{padding-left:14px;padding-right:14px}.banner{padding:8px 14px}.toolbar .input,.toolbar .grow{max-width:none;min-width:100%}.kv{grid-template-columns:1fr}}

body{background:#f2f6fa;color:#172b43}

<script>/* js/config/config.js */
/* CONFIGURATION — every list, stage name, mapping and default in one place.
   Vocabulary comes from V6. Anything V6 does not define is tagged ASSUMPTION and listed in docs/06 + OQ-* in docs/01. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});

  // V6 candidate lifecycle (v6 `statuses`, in order).
  const STAGES = ['CV Submitted', 'Client Review', 'Interview', 'Selected', 'Offer Accepted', 'Pre-Medical',
    'Visa Applied', 'QVC', 'RTP', 'Visa Printed', 'Deployment Ready', 'Arrived', 'Joined', 'Warranty'];

  LGM.Config = {
    app: { company: 'Leads Global Manpower', tagline: 'Recruitment Operations Platform · Qatar', version: 'V6 Developed', currency: 'QAR' },

    roles: [
      { id: 'md', label: 'Managing Director' },
      { id: 'nitija', label: 'Admin Manager (Nitija)' },
      { id: 'staff', label: 'Operations Staff' },
    ],
    // V6 only restricts Finance for `staff`. Other rows are ASSUMPTION (OQ-15) — demo roles, NOT security.
    permissions: {
      'finance.view': ['md', 'nitija'],
      'finance.import': ['md', 'nitija'],
      'finance.export': ['md', 'nitija'],
      'stage.undo': ['md', 'nitija'],            // ASSUMPTION: correction of a wrong stage
      'workspace.switch': ['md', 'nitija'],      // ASSUMPTION
      'data.restore': ['md', 'nitija'],          // ASSUMPTION
      'data.reset': ['md', 'nitija'],            // ASSUMPTION
      'audit.view': ['md', 'nitija', 'staff'],
    },

    countries: ['Bangladesh', 'Nepal', 'India', 'Philippines', 'Other'],
    // V6 ids: BD-1001, NP-1003. Other prefixes are ASSUMPTION (OQ-22).
    countryPrefix: { Bangladesh: 'BD', Nepal: 'NP', India: 'IN', Philippines: 'PH', Other: 'XX' },

    stages: STAGES,
    // V6 flow notes: "Pre-Medical if Required", "QVC if Applicable".
    optionalStages: ['Pre-Medical', 'QVC'],
    // ASSUMPTION (OQ-1): V6 has a "Rejected Candidates" report but no Rejected status.
    rejectedStage: 'Rejected',
    rejectableFrom: ['CV Submitted', 'Client Review', 'Interview'],

    // Named stage sets. Taken from V6 report regexes where they exist.
    stageSets: {
      'QVC Pending': ['Visa Applied', 'QVC'],                 // V6 /qvc|visa applied/
      'RTP Pending': ['RTP'],                                 // V6 /rtp/
      'Visa Printed': ['Visa Printed'],
      'Flight Pending': ['Visa Printed', 'Deployment Ready'], // V6 v6ReportRows (OQ-4)
      'Arrived': ['Arrived'],
      'Joined': ['Joined'],
      'Interview': ['Interview'],
      'Selected': ['Selected'],                               // V6 /selected/
      'Rejected': ['Rejected'],
      'Deployed': ['Arrived', 'Joined', 'Warranty'],          // ASSUMPTION (OQ-5): Warranty = already deployed
    },
    // Report-filter list shown in the toolbar (V6 list minus "QVC Completed", which V6 never defined — OQ-1).
    stageFilters: ['QVC Pending', 'RTP Pending', 'Visa Printed', 'Flight Pending', 'Arrived', 'Joined', 'Interview', 'Selected', 'Rejected'],

    // Dashboard pipeline — values in V6 are hard-coded; groups below are ASSUMPTION (OQ-2).
    // Mutually exclusive so a candidate is counted once. "Visa Pipeline" card == Visa Processing bar,
    // "Ready to Fly" card == Ready to Deploy bar (V6 shows identical numbers: 324/324, 186/186).
    pipelineGroups: [
      { label: 'CV Screening', stages: ['CV Submitted', 'Client Review'] },
      { label: 'Interviews & Selection', stages: ['Interview', 'Selected', 'Offer Accepted'] },
      { label: 'Visa Processing', stages: ['Pre-Medical', 'Visa Applied', 'QVC', 'RTP'] },
      { label: 'Ready to Deploy', stages: ['Visa Printed', 'Deployment Ready'] },
    ],
    // Master Recruitment Report columns (V6): Applied, QVC, RTP, Printed, Deployed.
    masterColumns: [
      { key: 'applied', label: 'Applied', stages: ['Visa Applied'] },
      { key: 'qvc', label: 'QVC', stages: ['QVC'] },
      { key: 'rtp', label: 'RTP', stages: ['RTP'] },
      { key: 'printed', label: 'Printed', stages: ['Visa Printed'] },
      { key: 'deployed', label: 'Deployed', stages: ['Arrived', 'Joined', 'Warranty'] },
    ],
    // V6 Visas page: "Action" column samples.
    visaActions: { 'Visa Applied': 'Follow up', 'QVC': 'Track appointment', 'Visa Printed': 'Plan ticket' },
    visaStages: ['Offer Accepted', 'Pre-Medical', 'Visa Applied', 'QVC', 'RTP', 'Visa Printed'],

    // V6 order data uses these values; the order flow diagram has the rest. 'Closed' added (OQ-3).
    orderStatuses: ['New Order', 'Country Allocation', 'Agency Sourcing', 'CV Review', 'Interview', 'Selection', 'Offer', 'Visa Processing', 'Deployment', 'Closed'],
    orderClosed: ['Closed'],

    clientStages: ['Active', 'Prospect'],
    visitOutcomes: ['Profile Presented', 'Follow-up', 'Order Received'],
    salesPipeline: ['Company Identified', 'Profile Briefing', 'Client Interested', 'Requirement Discussion', 'Demand Received', 'Order Created'],
    demandStatuses: ['Received', 'Under Review', 'Approved'],
    interviewMethods: ['Overseas Drive', 'Zoom', 'CV Selection'],
    interviewStatuses: ['Scheduled', 'Pending', 'Selected'],
    // V6 "Agency Tasks" flow; first three match the statuses shown in V6's table.
    agencyStatuses: ['Sourcing', 'CV Review', 'Interview', 'Selected List Sent', 'Passports Uploaded', 'Pre-Medical', 'Visa & Ticket Follow-up'],

    ticketBy: ['Client', 'Agency'],
    // V6 ticket statuses 'Request Booking' / 'Arrival Notice' + checklist steps between them.
    ticketSteps: ['Pending', 'Request Booking', 'Flight Details Shared', 'Arrival Notice'],

    warrantyDivisions: ['Labour', 'Domestic'],
    // V6 workflow: Complaint → Check Agreement & Dates → Record Evidence → Decision → Coordinate Agency → Close
    warrantyStatuses: ['Pending', 'Under Review', 'Evidence Recorded', 'Decision Made', 'Agency Coordinated', 'Closed'],
    warrantyMonths: { Labour: 3, Domestic: null },  // V6: labour "illustrative 3-month"; domestic must be verified (OQ-8)
    warrantyAlertDays: 30,                          // ASSUMPTION (OQ-21)

    // Domestic: V6 page workflow (8 steps) used as case status (OQ-10).
    domesticStatuses: ['Customer Enquiry', 'Worker Profiles', 'Client Selection', 'Approved Contract', 'Regulated Payment', 'Visa & Travel', 'Arrival / Handover', 'Guarantee / Complaints'],
    domesticDashboardFlow: ['Customer Enquiry', 'Worker Selection', 'Contract & Legal Payment', 'Visa / QVC', 'Arrival & Handover', 'Guarantee & Refunds'],

    credentialPortals: ['MOL', 'MOI', 'MOL / MOI', 'Other'],

    // Finance (V6)
    financeDivisions: [['labour', 'Blue-Collar Recruitment'], ['domestic', 'Domestic Workers']],
    financeAccounts: ['Cash', 'QIIB', 'Other bank'],
    financeDefaultAccount: { labour: 'Cash', domestic: 'QIIB' },
    financeCategories: ['Agency advance', 'Agency payment', 'Client visa charge', 'QVC charge', 'Visa investment', 'Partner commission',
      'Domestic customer payment', 'Agency expense', 'Refund', 'Office expense', 'Other'],
    costing: { Bangladesh: { client: 2500, revenue: 4000, investment: 300 }, _default: { client: 860, revenue: 1500, investment: 0 } },
    corporateFeeRates: [[1, "One month's basic (100%)"], [0.5, "Half month's basic (50%)"]],

    cvSources: ['Direct upload', 'Email attachment', 'WeTransfer download', 'Overseas agency'],
    cvStatuses: ['Needs review', 'Reviewed', 'Candidate created', 'Ignored'],

    // Import (V6 v5Fields / v5Aliases) — same field lists, same aliases.
    importMaxRows: 20000,

    activityCap: 500,
    storageKeyPrefix: 'lgm_v6dev_',
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/util.js */
/* UTILITIES — pure helpers, no DOM, no storage. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});

  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const pad = n => String(n).padStart(2, '0');

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // Normalised comparison key (same idea as V6 v5Norm).
  function norm(x) { return String(x == null ? '' : x).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }

  function validYMD(y, m, d) {
    if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return false;
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
  }
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;

  // Excel serial (1900 system) -> ISO date. 25569 = 1970-01-01.
  function serialToISO(serial) {
    const ms = Math.round((Number(serial) - 25569) * 86400000);
    const dt = new Date(ms);
    return iso(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  }

  /** Parse a date from user/Excel input. Returns 'YYYY-MM-DD' or null. Day-first for numeric d/m/y (ASSUMPTION, OQ-19). */
  function parseDate(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    const s = String(v).trim();
    if (!s) return null;
    if (/^\d+(\.\d+)?$/.test(s)) {            // Excel serial (only a plausible range, so "2026" is not read as a date)
      const n = Number(s);
      return n >= 25569 && n <= 73050 ? serialToISO(n) : null;
    }
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ].*)?$/);
    if (m) return validYMD(+m[1], +m[2], +m[3]) ? iso(+m[1], +m[2], +m[3]) : null;
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
    if (m) {
      let y = +m[3]; if (m[3].length === 2) y += 2000;
      return validYMD(y, +m[2], +m[1]) ? iso(y, +m[2], +m[1]) : null;
    }
    m = s.match(/^(\d{1,2})[ \-]([A-Za-z]{3,9})[ \-,]*(\d{4})$/);
    if (m && MONTHS[m[2].slice(0, 3).toLowerCase()]) {
      const mo = MONTHS[m[2].slice(0, 3).toLowerCase()];
      return validYMD(+m[3], mo, +m[1]) ? iso(+m[3], mo, +m[1]) : null;
    }
    return null;
  }
  const isISODate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && parseDate(s) === s;

  function todayISO() { const d = new Date(); return iso(d.getFullYear(), d.getMonth() + 1, d.getDate()); }

  function addMonths(isoDate, n) {
    const [y, m, d] = isoDate.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + n, 1));
    const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, Math.min(d, last));

/* CSV — parse and serialise. Fixes V6 defects D-7 (unquoted fields, formula injection) and handles ; and tab delimiters. */
(function (g) {
  'use strict';

  function detectDelimiter(text) {
    const first = text.split(/\r\n|\n|\r/).find(l => l.trim()) || '';

    let q = false;
    for (const c of first) { if (c === '"') q = !q; else if (!q && c in counts) counts[c]++; }
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || ',';
  }

  /** RFC-4180 style parser. Returns array of rows (arrays of strings). Blank rows are dropped. */
  function parse(text, delimiter) {
    text = String(text == null ? '' : text).replace(/^﻿/, '');
    const d = delimiter || detectDelimiter(text);
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
        else if (c === '"') q = false;
        else field += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field);
        if (row.some(x => x.trim())) rows.push(row);
        row = []; field = '';
      } else field += c;
    }
    row.push(field);
    if (row.some(x => x.trim())) rows.push(row);
    return rows;
  }

  function guard(v) {
    if (typeof v !== 'string') return v;
    if (/^[=+@\t\r]/.test(v)) return "'" + v;
    if (/^-/.test(v) && !/^-\s*[\d.,]+$/.test(v)) return "'" + v;
    return v;
  }

  function stringify(rows) { return rows.map(r => r.map(cell).join(',')).join('\r\n'); }

<script>/* js/io/xlsx.js */
/* XLSX READER — pure JS (ZIP central directory + DecompressionStream), no DOM, no network.
   Improvements over V6: date cells are converted to ISO dates (V6 returned Excel serial numbers), sheet selection,
   booleans/inline strings/formula strings, entity decoding, and it is testable outside a browser. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const u8str = b => new TextDecoder('utf-8').decode(b);

  async function inflateRaw(u8) {
    if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot decompress XLSX files; save the sheet as CSV and import that instead.');
    const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  function openZip(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let pos = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) if (dv.getUint32(i, true) === 0x06054b50) { pos = i; break; }
    if (pos < 0) throw new Error('Not a valid XLSX file (ZIP directory not found).');
    const count = dv.getUint16(pos + 10, true); let off = dv.getUint32(pos + 16, true);
    const entries = {};
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(off, true) !== 0x02014b50) throw new Error('Invalid ZIP directory.');
      const method = dv.getUint16(off + 10, true), packed = dv.getUint32(off + 20, true);
      const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true), local = dv.getUint32(off + 42, true);
      entries[u8str(bytes.subarray(off + 46, off + 46 + nl))] = { method, packed, local };
      off += 46 + nl + el + cl;
    }
    async function read(name) {
      const e = entries[name]; if (!e) return '';
      if (dv.getUint32(e.local, true) !== 0x04034b50) throw new Error('Invalid ZIP member.');
      const start = e.local + 30 + dv.getUint16(e.local + 26, true) + dv.getUint16(e.local + 28, true);
      const part = bytes.subarray(start, start + e.packed);
      if (e.method === 0) return u8str(part);
      if (e.method === 8) return u8str(await inflateRaw(part));

    get(key) {

    set(key, val) {

          if (f.type === 'int' && !Number.isInteger(n)) { errors[f.key] = `${f.label} must be a whole number.`; break; }
          if (f.min != null && n < f.min) { errors[f.key] = `${f.label} must be at least ${f.min}.`; break; }
          clean[f.key] = n; break;
        }
        case 'date': {

        }

    }
    return { errors, clean };

<script>/* js/domain/lifecycle.js */
/* BUSINESS LOGIC — candidate lifecycle. Pure functions. Linear order from V6; optional-stage skipping from V6 notes
   ("Pre-Medical if Required", "QVC if Applicable"); Rejected is an ASSUMPTION (OQ-1). */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util;
  const S = C.stages;

  const isStage = s => S.includes(s) || s === C.rejectedStage;
  const canonical = v => { const t = U.norm(v); return [...S, C.rejectedStage].find(s => U.norm(s) === t) || null; };
  const index = s => S.indexOf(s);

  /** Legal next moves from a stage: [{to, kind:'next'|'skip'|'reject', label}] */
  function moves(stage) {
    const out = []; const i = index(stage);
    if (i < 0 || i === S.length - 1) return out;
    out.push({ to: S[i + 1], kind: 'next', label: 'Next stage → ' + S[i + 1] });
    let j = i + 1;
    while (j < S.length - 1 && C.optionalStages.includes(S[j])) { j++; out.push({ to: S[j], kind: 'skip', label: `Skip ${S[j - 1]} → ${S[j]}` }); }
    if (C.rejectableFrom.includes(stage)) out.push({ to: C.rejectedStage, kind: 'reject', label: 'Reject candidate' });
    return out;
  }
  const canMove = (from, to) => moves(from).some(m => m.to === to);

  /** Patch to apply when moving a candidate. Returns {patch} or {error}. */
  function moveTo(candidate, to, by, at) {
    if (!canMove(candidate.status, to)) return { error: `Not allowed: ${candidate.status} → ${to}.` };
    const history = (candidate.history || []).concat([{ stage: to, at: at || new Date().toISOString(), by: by || '' }]);
    return { patch: { status: to, history } };
  }
  /** Undo the last stage change using history. */
  function undo(candidate, by) {
    const h = candidate.history || [];
    if (h.length < 2) return { error: 'No earlier stage to return to.' };
    const history = h.slice(0, -1);
    return { patch: { status: history[history.length - 1].stage, history } };
  }

  const inSet = (stage, setName) => (C.stageSets[setName] || []).includes(stage);
  const groupOf = stage => (C.pipelineGroups.find(g => g.stages.includes(stage)) || {}).label || null;

  LGM.Lifecycle = { isStage, canonical, index, moves, canMove, moveTo, undo, inSet, groupOf };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/domain/rules.js */
/* BUSINESS LOGIC — integrity rules: duplicates (V6 keys), uniqueness, referential checks, cascades, client rename. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util;
  const n = U.norm;

  // ---- duplicate keys (identical to V6 v5Import) ----
  const candidateKey = c => (c.passport ? `pp:${n(c.passport)}` : `name:${n(c.name)}:${n(c.client)}`);
  const orderKey = o => `${n(o.id || o.order_id)}:${n(o.client)}:${n(o.country)}:${n(o.trade)}`;
  const financeKey = f => `${f.date}:${n(f.ref)}:${n(f.party)}:${f.amount}:${f.direction}`;

  function findCandidateDuplicate(state, c, ignoreId) {
    const k = candidateKey(c);
    return state.candidates.find(x => x.id !== ignoreId && candidateKey(x) === k) || null;
  }

  const CLIENT_FIELD = { visits: 'client', demands: 'client', orders: 'client', candidates: 'client', interviews: 'client', warranties: 'client', finance: 'client', credentials: 'client', cvInbox: 'client' };

  /** Entity-level validation beyond field types. Returns { errors:{field|_:msg}, warnings:[msg] } */
  function check(state, entity, rec, opts = {}) {
    const errors = {}, warnings = [];
    switch (entity) {
      case 'clients': {
        const dup = state.clients.find(x => x.id !== opts.ignoreId && n(x.name) === n(rec.name));
        if (dup) errors.name = 'A client with this name already exists.';
        break;
      }
      case 'candidates': {
        const dup = findCandidateDuplicate(state, rec, opts.ignoreId);
        if (dup) errors[rec.passport ? 'passport' : 'name'] = `Duplicate of ${dup.id} (${rec.passport ? 'same passport' : 'same name and client'}).`;
        if (rec.order_id && !state.orders.some(o => o.id === rec.order_id)) warnings.push(`Order ${rec.order_id} not found.`);
        if (rec.order_id) {
          const o = state.orders.find(x => x.id === rec.order_id);
          if (o && n(o.client) !== n(rec.client)) warnings.push(`Order ${o.id} belongs to ${o.client}, not ${rec.client}.`);
        }
        break;
      }
      case 'allocations': {
        const o = state.orders.find(x => x.id === rec.order_id);
        if (!o) errors.order_id = 'Order not found.';
        else {
          const others = U.sum(state.allocations.filter(a => a.order_id === o.id && a.id !== opts.ignoreId), a => a.allocated);
          if (others + Number(rec.allocated) > o.qty) warnings.push(`Allocated total ${others + Number(rec.allocated)} exceeds order quantity ${o.qty}.`);
        }
        break;
      }
      case 'tickets': {
        if (!state.candidates.some(c => c.id === rec.candidate_id)) errors.candidate_id = 'Candidate not found.';
        else if (state.tickets.some(t => t.candidate_id === rec.candidate_id && t.id !== opts.ignoreId)) errors.candidate_id = 'This candidate already has a travel record.';
        break;
      }
      case 'warranties': {
        if (rec.warranty_start && rec.warranty_expiry && rec.warranty_expiry < rec.warranty_start) errors.warranty_expiry = 'Expiry cannot be before start.';
        break;
      }
      case 'credentials': {
        if (/pass(word|code)?\s*[:=]|otp\s*[:=]|pin\s*[:=]|secret\s*[:=]/i.test(`${rec.record} ${rec.portal}`)) errors.record = 'Do not store passwords or secrets here — describe the record only.';
        break;
      }
      default:
    }
    return { errors, warnings };
  }

  /** Apply defaults/derivations before saving. */
  function derive(entity, rec) {
    if (rec.country) { const hit = C.countries.find(x => n(x) === n(rec.country)); if (hit) rec.country = hit; }
    if (entity === 'warranties' && rec.warranty_start && !rec.warranty_expiry) {
      const months = C.warrantyMonths[rec.division];
      if (months) rec.warranty_expiry = U.addMonths(rec.warranty_start, months);
    }
    if (entity === 'credentials') rec.access = 'Authorized only';
    return rec;
  }

  /** Reason why a record cannot be deleted, or null. */
  function canDelete(state, entity, rec) {
    if (entity === 'clients') {
      const refs = [['orders', 'order(s)'], ['candidates', 'candidate(s)'], ['visits', 'visit(s)'], ['demands', 'demand letter(s)']]
        .map(([e, l]) => [state[e].filter(x => n(x.client) === n(rec.name)).length, l]).filter(x => x[0]);
      if (refs.length) return 'Client is used by ' + refs.map(x => `${x[0]} ${x[1]}`).join(', ') + '. Remove or reassign those first.';
    }
    if (entity === 'orders') {
      const cands = state.candidates.filter(c => c.order_id === rec.id).length;
      const allocs = state.allocations.filter(a => a.order_id === rec.id).length;
      const dem = state.demands.filter(d => d.order_id === rec.id).length;
      if (cands || allocs || dem) return `Order is linked to ${cands} candidate(s), ${allocs} allocation(s), ${dem} demand letter(s). Remove or unlink them first.`;
    }
    return null;
  }

  /** Side effects of deleting (mutates state). */
  function cascadeDelete(state, entity, rec) {
    if (entity === 'candidates') {
      state.tickets = state.tickets.filter(t => t.candidate_id !== rec.id);
      state.warranties.forEach(w => { if (w.candidate_id === rec.id) w.candidate_id = ''; });
    }
  }

  /** Renaming a client rewrites the name wherever it is stored as text (V6 links by name). */
  function renameClient(state, from, to) {
    let changed = 0;
    for (const [e, f] of Object.entries(CLIENT_FIELD)) (state[e] || []).forEach(r => { if (n(r[f]) === n(from)) { r[f] = to; changed++; } });
    return changed;
  }

  LGM.Rules = { candidateKey, orderKey, financeKey, findCandidateDuplicate, check, derive, canDelete, cascadeDelete, renameClient, CLIENT_FIELD };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/store.js */
/* STORE — single source of truth. All writes go through here so validation, rules, audit log, persistence and
   change notification always happen. Two workspaces (demo / live) are kept in separate storage keys so fictional
   sample data can never mix with working records. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util, S = LGM.Schema, R = LGM.Rules, L = LGM.Lifecycle, ST = LGM.Storage;

  const ENT = ['clients', 'visits', 'demands', 'orders', 'allocations', 'candidates', 'interviews', 'tickets', 'warranties', 'domestic', 'credentials', 'finance', 'cvInbox', 'imports', 'activity'];
  const dataKey = m => C.storageKeyPrefix + 'data_' + m;
  const PREFS_KEY = C.storageKeyPrefix + 'prefs';

  let state = null, mode = 'demo', saved = true; const listeners = [];

  function blank(workspace) {
    const s = { meta: { version: 1, workspace, counters: { order: 1001, candidate: 1001, demand: 1001, warranty: 101, domestic: 1 } } };
    ENT.forEach(e => (s[e] = []));
    return s;
  }
  function normalise(s, workspace) {
    const b = blank(workspace);
    if (!s || typeof s !== 'object') return b;
    ENT.forEach(e => { if (Array.isArray(s[e])) b[e] = s[e]; });
    if (s.meta && s.meta.counters) Object.assign(b.meta.counters, s.meta.counters);
    syncCounters(b); return b;
  }
  function syncCounters(s) {
    const maxNum = (arr, re) => arr.reduce((m, r) => { const x = re.exec(r.id || ''); return x ? Math.max(m, +x[1]) : m; }, 0);
    const c = s.meta.counters;
    c.order = Math.max(c.order, maxNum(s.orders, /(\d+)$/) + 1);
    c.candidate = Math.max(c.candidate, maxNum(s.candidates, /(\d+)$/) + 1);
    c.demand = Math.max(c.demand, maxNum(s.demands, /(\d+)$/) + 1);
    c.warranty = Math.max(c.warranty, maxNum(s.warranties, /(\d+)$/) + 1);
    c.domestic = Math.max(c.domestic, maxNum(s.domestic, /(\d+)$/) + 1);
  }

  function loadMode(m) {
    mode = m;
    const raw = ST.get(dataKey(m));
    if (raw) state = normalise(raw, m);
    else if (m === 'demo' && LGM.Seed) { state = normalise(LGM.Seed.build(), 'demo'); persist(); }
    else state = blank(m);
  }
  function persist() { saved = ST.set(dataKey(mode), state); return saved; }
  function notify() { listeners.slice().forEach(fn => { try { fn(); } catch (e) { if (g.console) console.error(e); } }); }
  function commit(ctx) { if (ctx && ctx.defer) return; persist(); notify(); }

  function nextId(kind, rec) {
    const c = state.meta.counters;
    const mk = {
      order: () => 'ORD-' + c.order++, demand: () => 'DL-' + c.demand++, warranty: () => 'WR-' + c.warranty++,
      domestic: () => 'DW-' + String(c.domestic++).padStart(3, '0'),
      candidate: () => (C.countryPrefix[rec.country] || 'XX') + '-' + c.candidate++,
    }[kind];
    if (!mk) return U.uid(kind || 'id');
    const pool = { order: 'orders', demand: 'demands', warranty: 'warranties', domestic: 'domestic', candidate: 'candidates' }[kind];
    for (;;) { const id = mk(); if (!state[pool].some(x => x.id === id)) return id; }
  }

  function log(text, client, entity, id, ctx) {
    state.activity.unshift({ at: new Date().toISOString(), by: (ctx && ctx.by) || '', entity: entity || '', id: id || '', client: client || '', text });
    if (state.activity.length > C.activityCap) state.activity.length = C.activityCap;
  }

  const fieldKeys = e => S.entities[e].fields.map(f => f.key);
  const pick = (rec, e) => Object.fromEntries(fieldKeys(e).map(k => [k, rec[k]]));

  /** Validate + rule-check without saving. */
  function preview(entity, input, opts = {}) {
    const v = S.validate(entity, input, { useDefaults: !opts.ignoreId, skipCreateOnly: !!opts.ignoreId });
    if (Object.keys(v.errors).length) return { ok: false, errors: v.errors, warnings: [] };
    const clean = R.derive(entity, v.clean);
    const chk = R.check(state, entity, clean, { ignoreId: opts.ignoreId });
    if (Object.keys(chk.errors).length) return { ok: false, errors: chk.errors, warnings: chk.warnings };
    return { ok: true, clean, warnings: chk.warnings, errors: {} };
  }

  function insert(entity, input, ctx = {}) {
    const p = preview(entity, input);
    if (!p.ok) return p;
    const def = S.entities[entity];
    const rec = Object.assign({}, p.clean, ctx.extra || {});
    rec.id = ctx.id || nextId(def.idKind, rec);
    rec.createdAt = new Date().toISOString();
    if (entity === 'candidates') rec.history = [{ stage: rec.status, at: rec.createdAt, by: ctx.by || '' }];
    state[entity].push(rec);
    if (!ctx.silent) log(`${def.label} ${def.title(rec)} added`, rec.client || '', entity, rec.id, ctx);
    commit(ctx);
    return { ok: true, record: rec, warnings: p.warnings, errors: {} };
  }

  function update(entity, id, patch, ctx = {}) {
    const rec = state[entity].find(x => x.id === id);
    if (!rec) return { ok: false, errors: { _: 'Record not found.' } };
    const p = preview(entity, Object.assign(pick(rec, entity), patch), { ignoreId: id });
    if (!p.ok) return p;
    const oldName = entity === 'clients' ? rec.name : null;
    Object.assign(rec, p.clean, { updatedAt: new Date().toISOString() });
    if (oldName && oldName !== rec.name) {
      const n = R.renameClient(state, oldName, rec.name);
      if (n) log(`Client renamed ${oldName} → ${rec.name} (${n} linked record(s) updated)`, rec.name, entity, id, ctx);
    }
    if (!ctx.silent) log(`${S.entities[entity].label} ${S.entities[entity].title(rec)} updated`, rec.client || (entity === 'clients' ? rec.name : ''), entity, id, ctx);
    commit(ctx);
    return { ok: true, record: rec, warnings: p.warnings, errors: {} };
  }

  function remove(entity, id, ctx = {}) {
    const rec = state[entity].find(x => x.id === id);
    if (!rec) return { ok: false, error: 'Record not found.' };
    const why = R.canDelete(state, entity, rec);
    if (why) return { ok: false, error: why };
    R.cascadeDelete(state, entity, rec);
    state[entity] = state[entity].filter(x => x.id !== id);
    if (!ctx.silent) log(`${S.entities[entity] ? S.entities[entity].label : entity} ${S.entities[entity] ? S.entities[entity].title(rec) : id} deleted`, rec.client || (entity === 'clients' ? rec.name : ''), entity, id, ctx);
    commit(ctx);
    return { ok: true };
  }

  function moveCandidate(id, to, ctx = {}) {
    const c = state.candidates.find(x => x.id === id);
    if (!c) return { ok: false, error: 'Candidate not found.' };
    const r = L.moveTo(c, to, ctx.by);
    if (r.error) return { ok: false, error: r.error };
    const from = c.status; Object.assign(c, r.patch, { updatedAt: new Date().toISOString() });
    log(`${c.id} ${c.name}: ${from} → ${to}`, c.client, 'candidates', id, ctx);
    commit(ctx); return { ok: true, record: c };
  }
  function undoCandidate(id, ctx = {}) {
    const c = state.candidates.find(x => x.id === id);
    if (!c) return { ok: false, error: 'Candidate not found.' };
    const r = L.undo(c, ctx.by);
    if (r.error) return { ok: false, error: r.error };
    const from = c.status; Object.assign(c, r.patch, { updatedAt: new Date().toISOString() });
    log(`${c.id} ${c.name}: stage corrected ${from} → ${c.status}`, c.client, 'candidates', id, ctx);
    commit(ctx); return { ok: true, record: c };
  }

  // ---- backup / restore / workspaces ----
  function exportBackup() {
    return { app: 'LGM-ERP-V6-Developed', schema: 1, workspace: mode, exportedAt: new Date().toISOString(), data: U.clone(state) };
  }
  function importBackup(obj) {
    if (!obj || obj.app !== 'LGM-ERP-V6-Developed' || !obj.data || typeof obj.data !== 'object') return { ok: false, error: 'This is not a backup file created by this application.' };
    const bad = ENT.filter(e => obj.data[e] != null && !Array.isArray(obj.data[e]));
    if (bad.length) return { ok: false, error: 'Backup is corrupt (invalid sections: ' + bad.join(', ') + ').' };
    state = normalise(obj.data, mode);
    log('Backup restored (' + (obj.workspace || '?') + ' workspace backup of ' + String(obj.exportedAt || '').slice(0, 10) + ')', '', 'system', '', {});
    commit({}); return { ok: true };
  }
  function switchMode(m) { if (m !== 'demo' && m !== 'live') return; persist(); loadMode(m); setPref('mode', m); notify(); }
  function resetDemo() {
    if (mode !== 'demo') return false;
    state = normalise(LGM.Seed.build(), 'demo'); log('Demo data reset to the original fictional sample', '', 'system', '', {}); commit({}); return true;
  }
  function clearWorkspace() { state = blank(mode); log('Workspace cleared', '', 'system', '', {}); commit({}); }

  function getPref(k, d) { const p = ST.get(PREFS_KEY) || {}; return k in p ? p[k] : d; }
  function setPref(k, v) { const p = ST.get(PREFS_KEY) || {}; p[k] = v; ST.set(PREFS_KEY, p); }

  function init(forceMode) { loadMode(forceMode || getPref('mode', 'demo')); }

  LGM.Store = {
    init, blank, ENT, preview, insert, update, remove, moveCandidate, undoCandidate, log,
    flush() { persist(); notify(); },
    onChange(fn) { listeners.push(fn); },
    state: () => state, mode: () => mode, isSaved: () => saved,
    list: e => state[e], get: (e, id) => state[e].find(x => x.id === id) || null,
    exportBackup, importBackup, switchMode, resetDemo, clearWorkspace, getPref, setPref, syncCounters: () => syncCounters(state),
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/domain/metrics.js */
/* BUSINESS LOGIC — every counter shown on a dashboard/card/report is computed here from records.
   Pure functions of `state` (no DOM, no storage) so they can be unit-tested. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util, Lc = LGM.Lifecycle;
  const n = U.norm;

  const inStages = (s, stages) => s.candidates.filter(c => stages.includes(c.status));
  const inSet = (s, name) => s.candidates.filter(c => Lc.inSet(c.status, name));
  const ticketOf = (s, id) => s.tickets.find(t => t.candidate_id === id) || null;
  const stepRank = step => Math.max(0, C.ticketSteps.indexOf(step));
  const isOpenOrder = o => !C.orderClosed.includes(o.status);

  /** Labour dashboard: cards + mutually-exclusive pipeline bars. */
  function labour(s) {
    const groups = C.pipelineGroups.map(gr => ({ label: gr.label, count: inStages(s, gr.stages).length }));
    const grp = l => (groups.find(x => x.label === l) || {}).count || 0;
    return {
      openOrders: s.orders.filter(isOpenOrder).length,
      cvsReceived: s.candidates.length,
      visaPipeline: grp('Visa Processing'),
      readyToFly: grp('Ready to Deploy'),
      groups,
    };
  }
  function domestic(s) {
    const idx = c => C.domesticStatuses.indexOf(c.status);
    return {
      enquiries: s.domestic.length,
      profilesShared: s.domestic.filter(c => idx(c) >= 1).length,
      visaCases: s.domestic.filter(c => c.status === 'Visa & Travel').length,
      handovers: s.domestic.filter(c => ['Arrival / Handover', 'Guarantee / Complaints'].includes(c.status)).length,
    };
  }
  function crm(s) {
    return {
      clients: s.clients.length,
      visits: s.visits.length,
      followUps: s.visits.filter(v => v.outcome === 'Follow-up').length,
      ordersWon: s.orders.filter(isOpenOrder).length,
    };
  }
  function visaCards(s) {
    const c = st => inStages(s, [st]).length;
    return { applied: c('Visa Applied'), qvc: c('QVC'), rtp: c('RTP'), printed: c('Visa Printed') };
  }
  function deployCards(s) {
    const fp = inSet(s, 'Flight Pending');
    return {
      readyToFly: fp.length,
      ticketsPending: fp.filter(c => { const t = ticketOf(s, c.id); return !t || stepRank(t.step) < 2; }).length,
      arrivalNotices: s.tickets.filter(t => t.step === 'Arrival Notice' && s.candidates.some(c => c.id === t.candidate_id)).length,
      arrivalsVerified: inSet(s, 'Deployed').length,
    };
  }

  /** Six-step deployment checklist for one candidate — derived from stage + travel record (no duplicated state). */
  function deploymentChecklist(s, c) {
    const t = ticketOf(s, c.id); const i = Lc.index(c.status);
    return [
      { label: 'Confirm visa printed', who: 'Operations', done: i >= Lc.index('Visa Printed') },
      { label: 'Request ticket / inform agent', who: 'Operations', done: !!t && stepRank(t.step) >= 1 },
      { label: 'Send client arrival notice', who: 'Operations', done: !!t && stepRank(t.step) >= 3 },
      { label: 'Collect pickup driver name & phone', who: 'Client', done: !!t && !!t.driver_name && !!t.driver_phone },
      { label: 'Verify arrival and client joining', who: 'Operations', done: i >= Lc.index('Arrived') },
      { label: 'Start applicable warranty', who: 'Operations', done: c.status === 'Warranty' || s.warranties.some(w => w.candidate_id === c.id) },
    ];
  }

  /** Master Recruitment Report — V6 formula: Remaining = Demand − (Applied+QVC+RTP+Printed+Deployed). Each candidate in one stage only. */
  function masterReport(s, { country = 'All', query = '' } = {}) {
    const map = new Map();
    const row = (client, ctry) => {
      const k = n(client) + '|' + n(ctry);
      if (!map.has(k)) map.set(k, Object.assign({ company: client, country: ctry, demand: 0 }, Object.fromEntries(C.masterColumns.map(m => [m.key, 0]))));
      return map.get(k);
    };
    s.orders.forEach(o => { row(o.client, o.country).demand += Number(o.qty) || 0; });
    s.candidates.forEach(c => {
      const col = C.masterColumns.find(m => m.stages.includes(c.status));
      const r = row(c.client, c.country); if (col) r[col.key]++;
    });
    const q = n(query);
    let rows = [...map.values()].filter(r => (country === 'All' || r.country === country) && (!q || n(r.company).includes(q)));
    rows.sort((a, b) => a.company.localeCompare(b.company) || a.country.localeCompare(b.country));
    const add = r => { r.remaining = r.demand - C.masterColumns.reduce((a, m) => a + r[m.key], 0); return r; };
    rows.forEach(add);
    const total = add(Object.assign({ company: 'TOTAL', country: '', demand: U.sum(rows, r => r.demand) }, Object.fromEntries(C.masterColumns.map(m => [m.key, U.sum(rows, r => r[m.key])]))));
    return { rows, total };
  }

  function orderProgress(s) {
    return s.orders.map(o => {
      const linked = s.candidates.filter(c => c.order_id === o.id);
      return { id: o.id, client: o.client, country: o.country, trade: o.trade, qty: o.qty, status: o.status, cvs: linked.length,
        selected: linked.filter(c => Lc.index(c.status) >= Lc.index('Selected')).length,
        deployed: linked.filter(c => Lc.inSet(c.status, 'Deployed')).length,
        remaining: Math.max(0, o.qty - linked.filter(c => Lc.inSet(c.status, 'Deployed')).length) };
    });
  }
  function allocationStats(s, a) {
    return { cvs: s.candidates.filter(c => n(c.agency) === n(a.agency) && c.order_id === a.order_id).length };
  }

  /** Planned V6 reports (formulas are ASSUMPTIONS, OQ-21). */
  function countryWise(s) {
    return C.countries.map(country => {
      const cands = s.candidates.filter(c => c.country === country), ords = s.orders.filter(o => o.country === country);
      return { country, orders: ords.length, ordered_qty: U.sum(ords, o => o.qty), cvs: cands.length,
        selected: cands.filter(c => Lc.index(c.status) >= Lc.index('Selected')).length, deployed: cands.filter(c => Lc.inSet(c.status, 'Deployed')).length };
    }).filter(r => r.orders || r.cvs);
  }
  function agentPerformance(s) {
    const names = U.uniqSorted([...s.candidates.map(c => c.agency), ...s.allocations.map(a => a.agency)]);
    return names.map(agency => {
      const cands = s.candidates.filter(c => n(c.agency) === n(agency));
      const sel = cands.filter(c => Lc.index(c.status) >= Lc.index('Selected')).length;
      const arr = cands.filter(c => Lc.inSet(c.status, 'Deployed')).length;
      return { agency, allocated: U.sum(s.allocations.filter(a => n(a.agency) === n(agency)), a => a.allocated), cvs: cands.length, selected: sel,
        selection_ratio: U.pctText(sel, cands.length), arrived: arr };
    });
  }
  function warrantyExpiry(s, today) {
    return s.warranties.filter(w => w.warranty_expiry).map(w => ({ case: w.id, division: w.division, client: w.client, candidate: w.candidate_id || '', issue: w.issue, status: w.status,
      warranty_start: w.warranty_start || '', warranty_expiry: w.warranty_expiry, days_left: U.diffDays(today, w.warranty_expiry) })).sort((a, b) => a.days_left - b.days_left);
  }
  function demandSales(s) {
    const clients = U.uniqSorted([...s.clients.map(c => c.name), ...s.visits.map(v => v.client), ...s.demands.map(d => d.client)]);
    return clients.map(client => {
      const v = s.visits.filter(x => n(x.client) === n(client)), d = s.demands.filter(x => n(x.client) === n(client));
      return { client, visits: v.length, follow_ups: v.filter(x => x.outcome === 'Follow-up').length, orders_received: v.filter(x => x.outcome === 'Order Received').length,
        demand_letters: d.length, open_demand: d.filter(x => x.status !== 'Approved').length, orders: s.orders.filter(o => n(o.client) === n(client)).length };
    });
  }

  /** Finance totals for a division ('labour' | 'domestic' | 'all') — V6: net = incoming − outgoing, "not accounting profit". */
  function financeTotals(s, division) {
    const tx = s.finance.filter(t => division === 'all' || t.division === division);
    const incoming = U.sum(tx.filter(t => t.direction === 'Incoming'), t => t.amount), outgoing = U.sum(tx.filter(t => t.direction === 'Outgoing'), t => t.amount);
    return { count: tx.length, incoming, outgoing, net: incoming - outgoing };
  }
  /** V6 costing: revenue = qty × rev; cost = qty × (client charges + [investment if extra] + partner + other). Negative inputs are treated as 0. */
  function costing(i) {
    const n = v => Math.max(0, Number(v) || 0), qty = n(i.qty);
    const perCand = n(i.client) + (i.investmentTreatment === 'extra' ? n(i.investment) : 0) + n(i.partner) + n(i.other);
    const revenue = qty * n(i.revenue), cost = qty * perCand; return { revenue, cost, profit: revenue - cost };
  }

  LGM.Metrics = { financeTotals, costing, costingDefaults, labour, domestic, crm, visaCards, deployCards, deploymentChecklist, masterReport, orderProgress, allocationStats, countryWise, agentPerformance, warrantyExpiry, demandSales, ticketOf, stepRank, isOpenOrder, inSet, inStages };
})(typeof window !== 'undefined' ? window : globalThis);

/* BUSINESS LOGIC — reminders / notifications. V6 shows three static reminders; here each is a rule evaluated on live data.

(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});

  function compute(s, today = U.todayISO()) {
    const fp = M.inSet(s, 'Flight Pending');
    const tk = c => M.ticketOf(s, c.id);
    const label = c => `${c.id} ${c.name} (${c.client})`;
    const out = [];
    const add = (id, action, assigned, items, link) => { if (items.length) out.push({ id, action, assigned, count: items.length, items: items.slice(0, 8), link }); };

    add('ticket-responsibility', 'Confirm who books the ticket (client or agency)', 'Operations',
      fp.filter(c => { const t = tk(c); return !t || !t.ticket_by; }).map(label), { page: 'tickets' });
    add('ticket-request', 'Request flight ticket from client', 'Operations',
      fp.filter(c => { const t = tk(c); return t && t.ticket_by === 'Client' && M.stepRank(t.step) < 1; }).map(label), { page: 'tickets' });
    add('ticket-date', 'Ticket date / flight details missing', 'Operations',
      fp.filter(c => { const t = tk(c); return t && M.stepRank(t.step) >= 1 && !c.flight_date; }).map(label), { page: 'tickets' });
    add('driver', 'Collect arrival driver name & phone', 'Operations',
      fp.filter(c => { const t = tk(c); return !t || !t.driver_name || !t.driver_phone; }).map(label), { page: 'tickets' });
    add('qvc', 'Follow up QVC result', 'Visa Team', M.inStages(s, ['QVC']).map(label), { page: 'visas' });
    add('followup', 'Sales follow-up pending', 'Sales', s.visits.filter(v => v.outcome === 'Follow-up').map(v => `${v.client}${v.next_action ? ' — ' + v.next_action : ''}`), { page: 'visits' });

      s.warranties.filter(w => w.warranty_expiry && w.status !== 'Closed' && U.diffDays(today, w.warranty_expiry) <= C.warrantyAlertDays).map(w => `${w.id} ${w.client} — ${w.warranty_expiry}`), { page: 'warranty' });
    add('warranty-open', 'Open warranty complaints', 'Operations', s.warranties.filter(w => w.status !== 'Closed').map(w => `${w.id} ${w.client} — ${w.issue}`), { page: 'warranty' });
    add('cv-review', 'CV intake files awaiting review', 'Operations', s.cvInbox.filter(x => x.status === 'Needs review' || /review/i.test(x.status || '')).map(x => x.filename), { page: 'cv-inbox' });
    add('no-order-link', 'Candidates not linked to an order', 'Operations', s.candidates.filter(c => !c.order_id).map(label), { page: 'candidates' });
    return out;
  }

  LGM.Alerts = { compute };

/* IMPORT PIPELINE — read file → map columns → validate every row → plan (valid / duplicate / invalid) → commit.
   Same targets, field lists and aliases as V6. Differences (all fixes for defects D-1, D-2, D-8):
   • imported rows are written to the SAME stores the pages read (not a hidden side store)
   • each row is validated with the same schema/rules as manual entry; rejected rows are reported with reasons
   • duplicates are checked against ALL existing records, not just earlier imports
   • Excel dates become ISO dates; day-first d/m/y text dates are accepted (ASSUMPTION, OQ-19) */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util, R = LGM.Rules, Lc = LGM.Lifecycle;
  const n = U.norm;

  const FIELDS = {
    candidates: ['candidate_name', 'passport', 'client', 'country', 'agency', 'trade', 'status', 'visa_number', 'qvc_date', 'flight_date', 'order_id'],
    orders: ['client', 'country', 'agency', 'trade', 'quantity', 'status', 'order_id'],

  };

    candidates: ['candidate_name', 'client', 'country', 'trade'],
    orders: ['client', 'country', 'trade', 'quantity'],
    finance: ['date', 'direction', 'party', 'category', 'amount'],
  };
  // V6 v5Aliases (unchanged) + a few obvious header spellings.
  const ALIASES = {
    candidate_name: ['name', 'candidate', 'candidate name', 'full name', 'worker name'],
    passport: ['passport', 'passport number', 'passport no', 'pp no'],
    client: ['client', 'company', 'company name', 'employer', 'qatar company'],
    country: ['country', 'nationality', 'source country'],
    agency: ['agency', 'agent', 'recruitment agency', 'overseas agency'],
    trade: ['trade', 'profession', 'category', 'job title', 'position'],
    status: ['status', 'visa status', 'stage', 'current status'],
    visa_number: ['visa number', 'visa no', 'vp number'],
    qvc_date: ['qvc date', 'appointment date'],
    flight_date: ['flight date', 'travel date', 'ticket date'],
    order_id: ['order id', 'order no', 'demand number'],
    quantity: ['quantity', 'qty', 'required', 'total'],
    date: ['date', 'transaction date', 'payment date'],
    division: ['division', 'business', 'business division'],
    direction: ['direction', 'type', 'incoming outgoing', 'receipt payment'],
    account: ['account', 'payment method', 'bank cash'],
    party: ['party', 'agency name', 'paid to', 'received from', 'customer'],
    order: ['order', 'order ref'],
    amount: ['amount', 'qar', 'total amount'],
