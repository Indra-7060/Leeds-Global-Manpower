  /** Read a File-like ({name, text(), arrayBuffer()}) → {columns, rows, sheetNames, sheetIndex, truncated}. */
  async function readFile(file, sheetIndex = 0) {
    const name = (file.name || '').toLowerCase();
    let table, sheetNames = [], idx = 0;
    if (/\.(csv|tsv|txt)$/.test(name)) table = LGM.Csv.parse(await file.text());
    else if (name.endsWith('.xlsx')) { const r = await LGM.Xlsx.read(await file.arrayBuffer(), sheetIndex); table = r.rows; sheetNames = r.sheetNames; idx = r.sheetIndex; }
    else throw new Error('Upload .xlsx, .csv or .tsv. Old .xls files must be saved as .xlsx first.');
    if (table.length < 2) throw new Error('No data rows found (a header row and at least one data row are required).');
    const columns = table[0].map((x, i) => String(x).trim() || 'Column ' + (i + 1));
    let rows = table.slice(1).filter(r => r.some(x => String(x).trim()));
    const truncated = rows.length > C.importMaxRows; if (truncated) rows = rows.slice(0, C.importMaxRows);
    return { columns, rows, sheetNames, sheetIndex: idx, truncated, fileName: file.name };
  }

  function guessMapping(target, columns) {
    const used = new Set(), map = {};
    for (const f of FIELDS[target]) {
      const opts = [label(f), ...(ALIASES[f] || [])].map(n);
      const i = columns.findIndex((c, ci) => !used.has(ci) && opts.includes(n(c)));
      map[f] = i < 0 ? '' : String(i); if (i >= 0) used.add(i);
    }
    return map;
  }
  const mapRows = (target, rows, mapping) => rows.map(row => Object.fromEntries(FIELDS[target].map(f => [f, mapping[f] === '' || mapping[f] == null ? '' : String(row[Number(mapping[f])] == null ? '' : row[Number(mapping[f])]).trim()])));

  const OUT = /(^|\b)(out|outgoing|expense|payment|paid|debit|dr)\b/i, INN = /^(in|incoming|receipt|received|credit|cr)\b/i;

  /** Convert one mapped row to {input, ctx, key, errors[], warnings[]} for the target. */
  function normaliseRow(target, r, state, role) {
    const errors = [], warnings = [], input = {}, ctx = {};
    const need = REQUIRED[target].filter(f => !r[f]);
    if (need.length) errors.push('Missing required: ' + need.map(label).join(', '));
    if (target === 'candidates') {
      Object.assign(input, { name: r.candidate_name, passport: r.passport, client: r.client, order_id: r.order_id, country: r.country, agency: r.agency, trade: r.trade, visa_number: r.visa_number, qvc_date: r.qvc_date, flight_date: r.flight_date });
      if (r.status) { const st = Lc.canonical(r.status); if (st) input.status = st; else errors.push(`Unknown status "${r.status}"`); }
      return { input, ctx, errors, warnings, entity: 'candidates', key: R.candidateKey({ passport: r.passport, name: r.candidate_name, client: r.client }) };
    }
    if (target === 'orders') {
      Object.assign(input, { client: r.client, country: r.country, agency: r.agency, trade: r.trade, qty: r.quantity });
      if (r.status) { const st = C.orderStatuses.find(x => n(x) === n(r.status)); if (st) input.status = st; else errors.push(`Unknown order stage "${r.status}"`); }
      if (r.order_id) {
        if (state.orders.some(o => n(o.id) === n(r.order_id) && R.orderKey(o) !== R.orderKey({ id: r.order_id, client: r.client, country: r.country, trade: r.trade }))) errors.push(`Order id ${r.order_id} is already used by a different order`);
        else ctx.id = r.order_id.trim();
      }
      return { input, ctx, errors, warnings, entity: 'orders', key: R.orderKey({ id: r.order_id, client: r.client, country: r.country, trade: r.trade }) };
    }
    // finance
    const division = /domestic/i.test(r.division) ? 'domestic' : 'labour';
    let direction = '';
    if (r.direction) { if (OUT.test(r.direction)) direction = 'Outgoing'; else if (INN.test(r.direction)) direction = 'Incoming'; else errors.push(`Direction "${r.direction}" is not Incoming/Outgoing`); }
    const account = r.account ? C.financeAccounts.find(a => n(a) === n(r.account)) || null : C.financeDefaultAccount[division];
    if (r.account && !account) errors.push(`Account "${r.account}" is not one of ${C.financeAccounts.join(', ')}`);
    let category = C.financeCategories.find(c => n(c) === n(r.category)) || '', note = r.note;
    if (r.category && !category) { category = 'Other'; note = (note ? note + ' | ' : '') + 'Original category: ' + r.category; warnings.push(`Category "${r.category}" mapped to Other`); }
    const amount = U.num(r.amount);
    Object.assign(input, { date: r.date, division, direction, account: account || '', party: r.party, client: r.client, country: r.country, order: r.order, category, amount: Number.isFinite(amount) ? amount : r.amount, ref: r.ref, note });
    return { input, ctx, errors, warnings, entity: 'finance', key: R.financeKey({ date: U.parseDate(r.date) || r.date, ref: r.ref, party: r.party, amount: Number.isFinite(amount) ? amount : r.amount, direction }) };
  }

  /** Dry run. Returns { target, total, valid[], duplicates[], invalid[] } — nothing is written. */
  function analyse(target, mapped, state, role, store) {
    if (target === 'finance' && !LGM.Permissions.can(role, 'finance.import')) throw new Error('Finance import is restricted to Managing Director and Admin Manager.');
    const out = { target, total: mapped.length, valid: [], duplicates: [], invalid: [] };
    const batch = new Set();
    const existing = target === 'orders' ? new Set([...state.orders.map(o => R.orderKey(o)), ...state.orders.map(o => o._key).filter(Boolean)])
      : target === 'finance' ? new Set(state.finance.map(f => R.financeKey(f))) : null;
    mapped.forEach((r, i) => {
      const row = i + 1; const x = normaliseRow(target, r, state, role);
      if (x.errors.length) return out.invalid.push({ row, errors: x.errors, raw: r });
      if (batch.has(x.key) || (existing && existing.has(x.key))) return out.duplicates.push({ row, reason: batch.has(x.key) ? 'Duplicate of an earlier row in this file' : 'Already exists', raw: r });
      const p = store.preview(x.entity, x.input);
      if (!p.ok) {
        const msgs = Object.values(p.errors);
        if (target === 'candidates' && Object.values(p.errors).some(m => /^Duplicate of/.test(m))) return out.duplicates.push({ row, reason: msgs.join('; '), raw: r });
        return out.invalid.push({ row, errors: msgs, raw: r });
      }
      batch.add(x.key);
      out.valid.push({ row, entity: x.entity, input: x.input, ctx: x.ctx, key: x.key, warnings: x.warnings.concat(p.warnings), raw: r });
    });
    return out;
  }

  /** Write the valid rows. Returns { added, duplicates, invalid, errors[] }. */
  function commit(analysis, meta, store, role) {
    let added = 0; const late = [];
    analysis.valid.forEach(v => {
      const res = store.insert(v.entity, v.input, { silent: true, defer: true, by: role, id: v.ctx.id, extra: { _src: { file: meta.fileName, row: v.row, at: new Date().toISOString() }, _key: v.key } });
      if (res.ok) added++; else late.push({ row: v.row, errors: Object.values(res.errors), raw: v.raw });
    });
    const invalid = analysis.invalid.length + late.length;
    store.state().imports.push({ id: U.uid('imp'), file: meta.fileName, target: analysis.target, added, duplicates: analysis.duplicates.length, invalid, at: new Date().toISOString(), by: role });
    store.log(`Import ${meta.fileName}: ${added} added, ${analysis.duplicates.length} duplicate(s) skipped, ${invalid} rejected (${analysis.target})`, '', 'import', '', { by: role });
    store.flush();
    return { added, duplicates: analysis.duplicates.length, invalid, late };
  }

  /** Rejected/duplicate rows as a CSV-able table so staff can fix and re-import. */
  function problemRows(analysis, columns, mapped) {
    const head = ['data_row', 'problem', ...FIELDS[analysis.target].map(label)];
    const lines = [...analysis.invalid.map(x => [x.row, 'REJECTED: ' + x.errors.join('; '), x.raw]), ...analysis.duplicates.map(x => [x.row, 'DUPLICATE: ' + x.reason, x.raw])]
      .sort((a, b) => a[0] - b[0]).map(([row, why, raw]) => [row, why, ...FIELDS[analysis.target].map(f => raw[f])]);
    return [head, ...lines];
  }

  LGM.Importer = { FIELDS, REQUIRED, ALIASES, readFile, guessMapping, mapRows, analyse, commit, problemRows, label };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/io/exporter.js */
/* EXPORT — CSV that opens cleanly in Excel (UTF-8 BOM, quoted, formula-injection safe). File names carry the workspace
   (DEMO/LIVE) so exported demo data can never be mistaken for business data. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});

  /** columns: [{key,label}] or [key,...]; rows: objects. Pure — returns CSV text. */
  function toCsv(columns, rows) {
    const cols = columns.map(c => (typeof c === 'string' ? { key: c, label: c } : c));
    return LGM.Csv.stringify([cols.map(c => c.label), ...rows.map(r => cols.map(c => r[c.key]))]);
  }
  const fileName = base => `LGM_${LGM.Store.mode().toUpperCase()}_${String(base).replace(/[^a-z0-9]+/gi, '_').replace(/^_|_$/g, '')}_${LGM.Util.todayISO()}.csv`;

  let last = null;
  function download(name, text, mime) {
    last = { name, text, mime: mime || 'text/csv;charset=utf-8' };
    if (typeof document === 'undefined' || g.__LGM_NO_DOWNLOAD) return; // __LGM_NO_DOWNLOAD: test hook
    const url = URL.createObjectURL(new Blob(['﻿', text], { type: last.mime }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }
  /** Export rows. Returns false when there is nothing to export. */
  function exportRows(base, columns, rows) {
    if (!rows.length) return false;
    download(fileName(base), toCsv(columns, rows)); return true;
  }

  LGM.Exporter = { toCsv, fileName, download, exportRows, last: () => last };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/io/cv.js */
/* CV INTAKE — records file metadata and extracts e-mail/phone from TXT, EML, CSV and DOCX (as V6 did).
   Files themselves are NOT stored (no secure storage offline). PDF/archives are listed for manual handling. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const ALLOWED = ['txt', 'csv', 'eml', 'docx', 'pdf', 'zip', 'rar', '7z'];
  const unesc = s => s.replace(/&(lt|gt|amp|quot|apos);/g, (m, e) => ({ lt: '<', gt: '>', amp: '&', quot: '"', apos: "'" }[e]));

  async function process(file, meta) {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!ALLOWED.includes(ext)) throw new Error(`Unsupported file type ".${ext}". Allowed: ${ALLOWED.join(', ')}.`);
    const item = { filename: file.name, size: file.size || 0, type: ext, received: new Date().toISOString(), source: meta.source || 'Direct upload', client: meta.client || '', agency: meta.agency || '', country: meta.country || '',
      status: 'Needs review', note: '', extracted_email: '', extracted_phone: '', preview: '' };
    try {
      let text = '';
      if (['txt', 'csv', 'eml'].includes(ext)) text = (await file.text()).slice(0, 150000);
      else if (ext === 'docx') { const xml = await LGM.Xlsx.readEntry(await file.arrayBuffer(), 'word/document.xml'); text = [...xml.matchAll(/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g)].map(m => unesc(m[1])).join(' '); }
      else if (ext === 'pdf') item.note = 'PDF received — text extraction needs a backend service';
      else item.note = 'Archive received — extract the files, then upload them';
      if (text) {
        const e = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i), p = text.match(/(?:\+?\d[\d ()-]{7,}\d)/);
        item.extracted_email = e ? e[0] : ''; item.extracted_phone = p ? p[0] : ''; item.preview = text.replace(/\s+/g, ' ').slice(0, 500); item.note = 'Text extracted — review required';
      }
    } catch (err) { item.note = 'Read failed: ' + String(err.message).slice(0, 80); }
    return item;
  }
  LGM.CvIntake = { process, ALLOWED };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/reports/reports.js */
/* REPORTS — one registry of report definitions (replaces V6's regex-on-status lookups, defects D-9/D-10).
   Every report is built from the live records and returns { columns, rows }. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const C = LGM.Config, U = LGM.Util, M = LGM.Metrics, Lc = LGM.Lifecycle;
  const n = U.norm;

  const col = (...pairs) => pairs.map(([key, label]) => ({ key, label }));
  const CAND = col(['id', 'Candidate ID'], ['name', 'Candidate'], ['passport', 'Passport'], ['client', 'Client'], ['order_id', 'Order'], ['country', 'Country'], ['agency', 'Agency'], ['trade', 'Trade'], ['status', 'Stage'], ['visa_number', 'Visa No.'], ['qvc_date', 'QVC date'], ['flight_date', 'Flight date']);
  const ORD = col(['id', 'Order'], ['client', 'Client'], ['country', 'Country'], ['trade', 'Trade'], ['qty', 'Qty'], ['status', 'Stage'], ['agency', 'Agency']);

  const setReport = (label, setName) => ({ label, build: s => ({ columns: CAND, rows: s.candidates.filter(c => Lc.inSet(c.status, setName)) }), stage: setName });
  const travelRows = (s, pred) => s.tickets.map(t => ({ t, c: s.candidates.find(c => c.id === t.candidate_id) })).filter(x => x.c && pred(x.t, x.c))
    .map(({ t, c }) => ({ candidate_id: c.id, candidate: c.name, client: c.client, country: c.country, ticket_by: t.ticket_by, flight: t.flight, flight_date: c.flight_date, driver_name: t.driver_name, driver_phone: t.driver_phone, ticket_status: t.step, stage: c.status }));
  const TRAVEL = col(['candidate_id', 'Candidate ID'], ['candidate', 'Candidate'], ['client', 'Client'], ['country', 'Country'], ['ticket_by', 'Ticket by'], ['flight', 'Flight'], ['flight_date', 'Flight date'], ['driver_name', 'Driver'], ['driver_phone', 'Driver phone'], ['ticket_status', 'Ticket status'], ['stage', 'Candidate stage']);

  const defs = {
    'Candidate List': { build: s => ({ columns: CAND, rows: s.candidates }) },
    'QVC Pending': setReport('QVC Pending', 'QVC Pending'),
    'RTP Pending': setReport('RTP Pending', 'RTP Pending'),
    'Visa Printed': setReport('Visa Printed', 'Visa Printed'),
    'Flight Pending': setReport('Flight Pending', 'Flight Pending'),
    'Arrived': setReport('Arrived', 'Arrived'),
    'Joined': setReport('Joined', 'Joined'),
    'Selected Candidates': setReport('Selected Candidates', 'Selected'),
    'Rejected Candidates': setReport('Rejected Candidates', 'Rejected'),
    'Deployment Schedule': { build: s => ({ columns: CAND, rows: s.candidates.filter(c => ['Visa Printed', 'Deployment Ready', 'Arrived'].includes(c.status)) }) }, // V6 /deployment|printed|arrived/
    'Interview Schedule': { build: s => ({ columns: col(['client', 'Client'], ['method', 'Method'], ['country', 'Country'], ['date', 'Date'], ['candidates', 'Candidates'], ['status', 'Status']), rows: s.interviews.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')) }) },
    'Tickets Issued': { build: s => ({ columns: TRAVEL, rows: travelRows(s, t => M.stepRank(t.step) >= 2) }) },
    'Arrival Schedule': { build: s => ({ columns: TRAVEL, rows: travelRows(s, (t, c) => !!c.flight_date).sort((a, b) => a.flight_date.localeCompare(b.flight_date)) }) },
    'Order Progress': { build: s => ({ columns: col(['id', 'Order'], ['client', 'Client'], ['country', 'Country'], ['trade', 'Trade'], ['qty', 'Qty'], ['status', 'Stage'], ['cvs', 'CVs linked'], ['selected', 'Selected+'], ['deployed', 'Deployed'], ['remaining', 'Remaining']), rows: M.orderProgress(s) }) },
    'Open Orders': { build: s => ({ columns: ORD, rows: s.orders.filter(M.isOpenOrder) }) },
    'All Orders': { build: s => ({ columns: ORD, rows: s.orders }) },
    'Agency Candidates': { build: s => ({ columns: CAND, rows: s.candidates.filter(c => c.agency).sort((a, b) => a.agency.localeCompare(b.agency)) }) },
    'Agency Deployment': { build: s => ({ columns: col(['agency', 'Agency'], ['allocated', 'Allocated'], ['cvs', 'CVs'], ['selected', 'Selected+'], ['arrived', 'Deployed']), rows: M.agentPerformance(s) }) },
    'Warranty Cases': { build: s => ({ columns: col(['id', 'Case'], ['division', 'Division'], ['client', 'Client'], ['candidate_id', 'Candidate'], ['issue', 'Issue'], ['status', 'Status'], ['warranty_start', 'Start'], ['warranty_expiry', 'Expiry']), rows: s.warranties }) },
    'Domestic Worker Cases': { build: s => ({ columns: col(['id', 'Case'], ['customer', 'Customer'], ['origin', 'Worker origin'], ['status', 'Status'], ['next_action', 'Next action']), rows: s.domestic }) },
    'Demand Letters': { build: s => ({ columns: col(['id', 'Reference'], ['client', 'Client'], ['order_id', 'Order'], ['countries', 'Countries'], ['trades', 'Trades'], ['letter_date', 'Letter date'], ['signed', 'Signed'], ['status', 'Status']), rows: s.demands }) },
    // V6 "Planned" reports — formulas are ASSUMPTIONS (OQ-21)
    'Country-wise Recruitment': { build: s => ({ columns: col(['country', 'Country'], ['orders', 'Orders'], ['ordered_qty', 'Ordered qty'], ['cvs', 'CVs'], ['selected', 'Selected+'], ['deployed', 'Deployed']), rows: M.countryWise(s) }) },
    'Agent Performance': { build: s => ({ columns: col(['agency', 'Agency'], ['allocated', 'Allocated'], ['cvs', 'CVs'], ['selected', 'Selected+'], ['selection_ratio', 'Selection ratio'], ['arrived', 'Deployed']), rows: M.agentPerformance(s) }) },
    'Warranty Expiry': { build: (s, f) => ({ columns: col(['case', 'Case'], ['division', 'Division'], ['client', 'Client'], ['candidate', 'Candidate'], ['issue', 'Issue'], ['status', 'Status'], ['warranty_expiry', 'Expiry'], ['days_left', 'Days left']), rows: M.warrantyExpiry(s, f.today || U.todayISO()) }) },
    'Demand & Sales Visits': { build: s => ({ columns: col(['client', 'Client'], ['visits', 'Visits'], ['follow_ups', 'Follow-ups'], ['orders_received', 'Orders received'], ['demand_letters', 'Demand letters'], ['open_demand', 'Open demand'], ['orders', 'Orders']), rows: M.demandSales(s) }) },
    'Master Recruitment Report': { build: (s, f) => { const m = M.masterReport(s, { country: f.country || 'All', query: f.client && f.client !== 'All' ? f.client : '' }); return { columns: col(['company', 'Company'], ['country', 'Country'], ['demand', 'Order'], ['applied', 'Applied'], ['qvc', 'QVC'], ['rtp', 'RTP'], ['printed', 'Printed'], ['deployed', 'Deployed'], ['remaining', 'Remaining']), rows: [...m.rows, m.total], skipFilters: true }; } },
    'CV Intake': { build: s => ({ columns: col(['filename', 'File'], ['source', 'Source'], ['client', 'Client'], ['agency', 'Agency'], ['country', 'Country'], ['extracted_email', 'E-mail'], ['extracted_phone', 'Phone'], ['status', 'Status'], ['received', 'Received']), rows: s.cvInbox }) },
    'Private Finance': { permission: 'finance.export', build: s => ({ columns: col(['date', 'Date'], ['division', 'Division'], ['direction', 'Direction'], ['account', 'Account'], ['party', 'Party'], ['client', 'Client'], ['country', 'Country'], ['order', 'Order'], ['category', 'Category'], ['amount', 'Amount'], ['ref', 'Reference'], ['note', 'Note']), rows: s.finance }) },
  };

  // Quick-report chips per page (V6 v6QuickReports; entries that could never return data in V6 are removed — see doc 01 D-9).
  const quick = {
    interviews: ['Interview Schedule', 'Selected Candidates', 'Rejected Candidates'],
    visas: ['QVC Pending', 'RTP Pending', 'Visa Printed'],
    deployment: ['Flight Pending', 'Deployment Schedule', 'Arrived', 'Joined'],
    tickets: ['Flight Pending', 'Tickets Issued', 'Arrival Schedule'],
    orders: ['Order Progress', 'Open Orders'],
    candidates: ['Candidate List', 'QVC Pending'],
    agencies: ['Agency Candidates', 'Agency Deployment'],
    warranty: ['Warranty Cases', 'Warranty Expiry'],
    domestic: ['Domestic Worker Cases'],
    demands: ['Demand Letters', 'Demand & Sales Visits'],
    clients: ['Demand & Sales Visits', 'Candidate List'],
    visits: ['Demand & Sales Visits'],
    'visa-master': ['Master Recruitment Report'],
  };
  const defaultQuick = ['Candidate List', 'QVC Pending', 'Flight Pending'];

  function applyFilters(rows, f) {
    return rows.filter(r => (!f.client || f.client === 'All' || !('client' in r) || n(r.client) === n(f.client))
      && (!f.country || f.country === 'All' || !('country' in r) || n(r.country) === n(f.country)));
  }

  /** Run a report by name with toolbar filters {client,country,stage}. Returns {name, columns, rows} or {error}. */
  function run(name, state, filters = {}, role) {
    const d = defs[name]; if (!d) return { error: 'Unknown report: ' + name };
    if (d.permission && !LGM.Permissions.can(role, d.permission)) return { error: 'Financial reports are restricted to Managing Director and Admin Manager.' };
    const out = d.build(state, filters);
    let rows = out.skipFilters ? out.rows : applyFilters(out.rows, filters);
    if (!out.skipFilters && filters.stage && filters.stage !== 'All' && rows.length && 'status' in rows[0] && 'passport' in rows[0]) {
      rows = rows.filter(c => Lc.inSet(c.status, filters.stage));
    }
    return { name, columns: out.columns, rows };
  }

  /** Keyword report router (V6 v5RunReport, same precedence) + an explanation of how the request was read. */
  function keyword(query, state, role) {
    const q = String(query || '').trim(), l = q.toLowerCase();
    if (!q) return { error: 'Type a request, e.g. "QVC pending for <client> Nepal".' };
    const why = []; let name;
    if (/finance|payment|expense|cash|qiib|profit|agency balance|outstanding/.test(l)) { name = 'Private Finance'; why.push('finance terms found'); }
    else if (/order|demand/.test(l)) { name = 'All Orders'; why.push('"order/demand" found'); }
    else if (/qvc/.test(l)) name = 'QVC Pending';
    else if (/rtp/.test(l)) name = 'RTP Pending';
    else if (/flight|ticket|deploy|ready to fly/.test(l)) name = 'Flight Pending';
    else if (/printed/.test(l)) name = 'Visa Printed';
    else if (/arrived|arrival/.test(l)) name = 'Arrived';
    else if (/joined/.test(l)) name = 'Joined';
    else if (/rejected/.test(l)) name = 'Rejected Candidates';
    else if (/selected/.test(l)) name = 'Selected Candidates';
    else if (/warranty/.test(l)) name = 'Warranty Cases';
    else if (/domestic/.test(l)) name = 'Domestic Worker Cases';
    else { name = 'Candidate List'; why.push('no stage keyword — showing all candidates'); }
    const clients = U.uniqSorted([...state.clients.map(c => c.name), ...state.orders.map(o => o.client), ...state.candidates.map(c => c.client)]).sort((a, b) => b.length - a.length);
    const client = clients.find(c => l.includes(c.toLowerCase()));
    const countries = U.uniqSorted([...C.countries, ...state.candidates.map(c => c.country), ...state.orders.map(o => o.country)]).filter(x => x !== 'Other');
    const country = countries.find(c => l.includes(c.toLowerCase()));
    const filters = { client: client || 'All', country: country || 'All' };
    const res = run(name, state, filters, role);
    if (res.error) return res;
    res.interpretation = [`Report: ${name}`, client ? `Client: ${client}` : null, country ? `Country: ${country}` : null, ...why].filter(Boolean);
    return res;
  }

  LGM.Reports = { defs, quick: p => quick[p] || defaultQuick, run, keyword, applyFilters, CAND };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/components.js */
/* UI COMPONENTS — presentation only. Same visual vocabulary as V6 (headings, KPI cards, panels, badges, flows, notices, tabs).
   Safety rule: plain strings are ALWAYS escaped; only `UI.raw(...)` / component return values (Raw) are inserted as HTML. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const U = LGM.Util, esc = U.esc;

  class Raw { constructor(h) { this.h = h; } toString() { return this.h; } }
  const raw = h => new Raw(h);
  const cell = c => (c instanceof Raw ? c.h : esc(c));

  const UI = {
    esc, raw, Raw, actions: {},
    state: { page: 'dashboard', division: 'labour', role: 'md', financeDivision: 'labour', recruitOpen: true, filters: { client: 'All', country: 'All', stage: 'All' }, vm: { country: 'All', q: '' } },
  };

  // ---------- V6 components ----------
  UI.badge = s => {
    const t = String(s == null ? '' : s);
    const c = /rejected|expired/i.test(t) ? 'red' : /active|arrived|joined|printed|selected|accepted|approved|reviewed|created|issued|^yes$|^done$/i.test(t) ? 'green'
      : /pending|review|interview|processing|qvc|rtp|scheduled|follow|booking|sourcing|received|needs/i.test(t) ? 'orange' : 'grey';
    return raw(`<span class="pill ${c}">${esc(t)}</span>`);
  };
  UI.heading = (t, d, action = '') => `<div class="row between"><div><div class="eyebrow">LGM / ${esc(t)}</div><h1 class="title">${esc(t)}</h1><div class="muted">${esc(d)}</div></div><div class="row">${action}</div></div>`;
  UI.metric = (label, n, sub) => `<div class="card"><div class="muted">${esc(label)}</div><div class="num">${cell(n)}</div><div class="muted">${esc(sub)}</div></div>`;
  UI.cards = (arr, style = '') => `<div class="cards" ${style ? `style="${style}"` : ''}>${arr.join('')}</div>`;
  UI.panel = (title, body, actions = '') => `<section class="panel"><div class="row between"><h3>${esc(title)}</h3><div class="row">${actions}</div></div>${body}</section>`;
  UI.flow = arr => `<div class="flow">${arr.map((s, i) => `<span>${esc(s)}</span>${i < arr.length - 1 ? '<i>→</i>' : ''}`).join('')}</div>`;
  UI.notice = (text, cls = '') => `<div class="notice ${cls}">${esc(text)}</div>`;
  UI.muted = t => `<p class="muted">${esc(t)}</p>`;
  UI.table = (head, rows, opts = {}) => {
    if (!rows.length) return `<div class="empty">${esc(opts.empty || 'No records yet.')}</div>`;
    const th = h => (typeof h === 'object' ? `<th title="${esc(h.title)}">${esc(h.label)}</th>` : `<th>${esc(h)}</th>`);
    return `<div class="scroll-x"><table><thead><tr>${head.map(th).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  };
  UI.tabs = (items, active, act) => `<div class="tabs">${items.map(([id, label]) => `<button class="tab ${active === id ? 'selected' : ''}" data-act="${act}" data-arg="${esc(id)}" type="button">${esc(label)}</button>`).join('')}</div>`;
  UI.btn = (label, act, arg = '', cls = '', attrs = '') => raw(`<button class="btn ${cls}" data-act="${act}" data-arg="${esc(arg)}" ${attrs} type="button">${esc(label)}</button>`);
  UI.kv = obj => `<div class="kv">${Object.entries(obj).map(([k, v]) => `<b>${esc(k)}</b><span>${cell(v === '' || v == null ? '—' : v)}</span>`).join('')}</div>`;
  UI.bar = (label, count, pct) => `<div class="row between"><span>${esc(label)}</span><strong>${esc(count)}</strong></div><div class="bar"><div style="width:${Math.max(0, Math.min(100, pct))}%"></div></div>`;
  UI.stagebar = (stage) => { const S = LGM.Config.stages, i = S.indexOf(stage); return `<div class="stagebar" title="${esc(stage)}">${S.map((s, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>`; };

  // ---------- events ----------
  UI.on = (name, fn) => { UI.actions[name] = fn; };
  function wire() {
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
      const fn = UI.actions[el.dataset.act]; if (fn) fn(el.dataset.arg, el, e);
    });
    document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && UI.actions[el.dataset.change]) UI.actions[el.dataset.change](el.value, el, e); });
    document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && UI.actions[el.dataset.input]) UI.actions[el.dataset.input](el.value, el, e); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('#overlay-root .overlay')) UI.modal.close(); });
  }

  // ---------- modal / confirm / toast ----------
  let onClose = null;
  UI.modal = {
    open({ title, body, footer = '', narrow = false, onOpen, closed }) {
      onClose = closed || null;
      document.getElementById('overlay-root').innerHTML = `<div class="overlay" data-act="modalBackdrop"><div class="modal ${narrow ? 'narrow' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-h"><h3>${esc(title)}</h3><button class="modal-x" data-act="modalClose" aria-label="Close" type="button">×</button></div><div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div></div>`;
      const first = document.querySelector('#overlay-root input:not([type=hidden]):not([disabled]),#overlay-root select,#overlay-root textarea'); if (first) first.focus();
      if (onOpen) onOpen();
    },
    close() { document.getElementById('overlay-root').innerHTML = ''; const f = onClose; onClose = null; if (f) f(); },
    isOpen: () => !!document.querySelector('#overlay-root .overlay'),
  };
  UI.on('modalClose', () => UI.modal.close());
  UI.on('modalBackdrop', (a, el, e) => { if (e.target === el) UI.modal.close(); });

  /** Promise-based confirm (replaces window.confirm so it is styled, testable and never blocks). */
  UI.confirm = ({ title = 'Please confirm', message, ok = 'Confirm', danger = false, html = '' }) => new Promise(resolve => {
    let done = false; const finish = v => { if (done) return; done = true; resolve(v); };
    UI.modal.open({ title, narrow: true, body: `<p style="margin:0;font-size:14px;line-height:1.5">${esc(message)}</p>${html}`,
      footer: `<button class="btn secondary" data-act="confirmNo" type="button">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-act="confirmYes" type="button">${esc(ok)}</button>`, closed: () => finish(false) });
    UI.actions.confirmYes = () => { finish(true); UI.modal.close(); };
    UI.actions.confirmNo = () => { UI.modal.close(); };
  });
  UI.toast = (msg, kind = '') => {
    const root = document.getElementById('toasts'); const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; root.appendChild(t);
    setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3800);
  };

  // ---------- report preview (used by Reports, AI Reports, toolbar) ----------
  UI.previewReport = res => {
    UI.state.preview = res;
    const rows = res.rows.slice(0, 100);
    UI.modal.open({
      title: res.name, body: (res.interpretation ? `<p class="muted">${res.interpretation.map(esc).join(' · ')}</p>` : '') +
        `<p class="muted">${res.rows.length} record(s)${res.rows.length > 100 ? ' — showing first 100; export for all' : ''}</p>` +
        UI.table(res.columns.map(c => c.label), rows.map(r => res.columns.map(c => r[c.key] == null ? '' : r[c.key])), { empty: 'No matching records for these filters.' }),
      footer: `<button class="btn secondary" data-act="modalClose" type="button">Close</button><button class="btn" data-act="exportPreview" type="button" ${res.rows.length ? '' : 'disabled'}>⇩ Export CSV</button>`,
    });
  };
  UI.on('exportPreview', () => { const r = UI.state.preview; if (r && LGM.Exporter.exportRows(r.name, r.columns, r.rows)) UI.toast('Exported ' + r.rows.length + ' row(s) — ' + LGM.Exporter.last().name, 'ok'); });

  UI.wire = wire;
  LGM.UI = UI;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/crud.js */
/* GENERIC CRUD — schema-driven register tables (search, filters, add/edit/delete) and form builder.
   Pages declare columns; validation, rules, audit log and persistence come from Store/Schema/Rules. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const UI = LGM.UI, U = LGM.Util, esc = U.esc, S = LGM.Store, Sc = LGM.Schema;

  const Crud = { cfgs: {}, state: {} };
  const st = id => (Crud.state[id] = Crud.state[id] || { q: '', f: {} });
  const by = () => UI.state.role;

  // ---------------- form fields ----------------
  function suggestValues(f) {
    const s = S.state();
    if (f.suggestList) return f.suggestList.concat(U.uniqSorted([...s.candidates.map(c => c.country), ...s.orders.map(o => o.country)])).filter((v, i, a) => a.indexOf(v) === i);
    const { entity, key } = f.suggest; let vals = s[entity].map(r => r[key]);
    if (entity === 'allocations' && key === 'agency') vals = vals.concat(s.candidates.map(c => c.agency));
    return U.uniqSorted(vals);
  }
  function fieldHtml(entity, f, value, o = {}) {
    const name = esc(f.key), v = value == null ? '' : value, id = `f_${o.scope || 'm'}_${entity}_${f.key}`;
    const dis = f.readonly || (o.lockKeys && o.lockKeys.includes(f.key)) ? 'disabled' : '';
    let input;
    if (f.type === 'select') {
      const opts = (f.options || []).map(x => `<option value="${esc(x)}" ${String(v) === String(x) ? 'selected' : ''}>${esc(f.labels ? f.labels[x] : x)}</option>`).join('');
      input = `<select class="input" id="${id}" name="${name}" ${dis}>${f.required ? '' : '<option value="">—</option>'}${opts}</select>`;
    } else if (f.type === 'refselect') {
      const st0 = S.state(); const src = f.source;
      let items = st0[src.entity].filter(r => (!src.filter || src.filter(r)) && (!src.taken || String(r[src.value]) === String(v) || !st0[src.taken[0]].some(x => x[src.taken[1]] === r[src.value])));
      input = `<select class="input" id="${id}" name="${name}" ${dis}><option value="">${f.required ? '— select —' : '— none —'}</option>${items.map(r => `<option value="${esc(r[src.value])}" ${String(v) === String(r[src.value]) ? 'selected' : ''}>${esc(src.label(r))}</option>`).join('')}</select>`;
    } else if (f.type === 'textarea') {
      input = `<textarea class="input" id="${id}" name="${name}" rows="3" ${dis}>${esc(v)}</textarea>`;
    } else {
      const type = f.type === 'int' || f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
      const extra = f.type === 'int' ? `step="1" min="${f.min ?? ''}"` : f.type === 'number' ? `step="0.01" min="${f.min ?? ''}"` : '';
      const list = f.suggest || f.suggestList ? `list="dl_${id}"` : '';
      input = `<input class="input" id="${id}" name="${name}" type="${type}" value="${esc(v)}" ${extra} ${list} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${dis} autocomplete="off">`;
      if (list) input += `<datalist id="dl_${id}">${suggestValues(f).map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
    }
    return `<div class="field ${f.full ? 'full' : ''}" data-field="${name}"><label for="${id}">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>${input}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}<div class="errmsg"></div></div>`;
  }
  /** Fields grid for an entity. `values` pre-fills; `hide` omits keys; `virtual` adds non-schema fields. */
  function fieldsGrid(entity, values = {}, o = {}) {
    const defs = Sc.entities[entity].fields.filter(f => !(o.hide || []).includes(f.key) && !(o.editing && f.createOnly));
    return `<div class="formgrid">${defs.map(f => fieldHtml(entity, f, values[f.key], o)).join('')}${(o.virtual || []).map(vf => fieldHtml(entity, vf, values[vf.key], o)).join('')}</div>`;
  }
  function readForm(root, entity, o = {}) {
    const out = {};
    root.querySelectorAll('[name]').forEach(el => { out[el.name] = el.value; });
    return out;
  }
  function showErrors(root, errors) {
    root.querySelectorAll('.field').forEach(f => { f.classList.remove('err'); f.querySelector('.errmsg').textContent = ''; });
    let general = [];
    Object.entries(errors || {}).forEach(([k, m]) => { const f = root.querySelector(`.field[data-field="${k}"]`); if (f) { f.classList.add('err'); f.querySelector('.errmsg').textContent = m; } else general.push(m); });
    const box = root.querySelector('.formerr'); if (box) { box.textContent = general.join(' '); box.style.display = general.length ? 'block' : 'none'; }
    const firstErr = root.querySelector('.field.err .input'); if (firstErr) firstErr.focus();
  }

  /** Open add/edit modal. opts: {entity, id, defaults, hide, lockKeys, virtual:[{key,label,type,get(rec),after(values,rec)}], title, onSaved} */
  function formModal(opts) {
    const entity = opts.entity, def = Sc.entities[entity]; const rec = opts.id ? S.get(entity, opts.id) : null;
    const values = Object.assign({}, rec ? rec : Object.assign(Sc.defaults(entity), opts.defaults || {}));
    (opts.virtual || []).forEach(vf => { if (rec && vf.get) values[vf.key] = vf.get(rec); });
    UI.modal.open({
      title: opts.title || (rec ? `Edit ${def.label.toLowerCase()} — ${def.title(rec)}` : `Add ${def.label.toLowerCase()}`),
      body: `<form id="crud-form" novalidate><div class="formerr notice" style="display:none;background:#feeaea;color:#8f2a2a;border-color:#f0c4c4;margin:0 0 14px"></div>${fieldsGrid(entity, values, { hide: opts.hide, editing: !!rec, lockKeys: opts.lockKeys, virtual: opts.virtual, scope: 'm' })}</form>`,
      footer: `<button class="btn secondary" data-act="modalClose" type="button">Cancel</button><button class="btn" data-act="crudSubmit" type="button">${rec ? 'Save changes' : 'Save'}</button>`,
    });
    UI.actions.crudSubmit = () => {
      const root = document.getElementById('crud-form'); const vals = readForm(root, entity); const ctx = { by: by() };
      const own = Object.fromEntries(Object.entries(vals).filter(([k]) => !(opts.virtual || []).some(v => v.key === k)));
      // `fixed` = values for fields that are hidden from the form but must still be saved (e.g. a pre-selected client).
      const res = rec ? S.update(entity, rec.id, own, ctx) : S.insert(entity, Object.assign({}, opts.fixed || {}, own), ctx);
      if (!res.ok) return showErrors(root, res.errors);
      (opts.virtual || []).forEach(vf => vf.after && vf.after(vals, res.record));
      UI.modal.close();
      UI.toast(`${def.label} ${rec ? 'updated' : 'saved'}` + (res.warnings && res.warnings.length ? ' — note: ' + res.warnings.join(' ') : ''), res.warnings && res.warnings.length ? '' : 'ok');
      if (opts.onSaved) opts.onSaved(res.record);
    };
  }
  /** Inline form (used by Finance, as in V6). Returns {html, submit(rootEl)} */
  function inlineSubmit(entity, rootEl, ctxExtra = {}) {
    const vals = readForm(rootEl, entity); const res = S.insert(entity, vals, { by: by() });
    showErrors(rootEl, res.errors); return res;
  }

  // ---------------- register table ----------------
  function rowsFor(cfg) {
    const q = U.norm(st(cfg.id).q), f = st(cfg.id).f;
    let rows = (cfg.rows ? cfg.rows() : S.list(cfg.entity)).slice();
    (cfg.filters || []).forEach(fl => { const v = f[fl.key]; if (v && v !== 'All') rows = rows.filter(r => String(fl.get ? fl.get(r) : r[fl.key]) === v); });
    if (q) rows = rows.filter(r => U.norm((cfg.search || Object.keys(r).filter(k => typeof r[k] === 'string' || typeof r[k] === 'number')).map(k => (typeof k === 'function' ? k(r) : r[k])).join(' ')).includes(q));
    if (cfg.sort) rows.sort(cfg.sort);
    return rows;
  }
  function bodyHtml(cfg) {
    const rows = rowsFor(cfg), total = (cfg.rows ? cfg.rows() : S.list(cfg.entity)).length;
    const canEdit = cfg.canEdit !== false, canDel = cfg.canDelete !== false;
    const table = UI.table([...cfg.columns.map(c => c.label), ''], rows.map(r => [...cfg.columns.map(c => c.get(r)),
      UI.raw(`<div class="table-actions">${cfg.rowActions ? cfg.rowActions(r) : ''}${canEdit ? UI.btn('Edit', 'crudEdit', cfg.id, 'secondary small', `data-rec="${esc(r.id)}"`) : ''}${canDel ? UI.btn('Delete', 'crudDelete', cfg.id, 'danger small', `data-rec="${esc(r.id)}"`) : ''}</div>`)]),
      { empty: total ? 'No records match the search/filters.' : (cfg.emptyText || 'No records yet.') });
    return { html: table, count: `${rows.length} of ${total}` };
  }
  function toolbar(cfg, count) {
    const s = st(cfg.id), rows = cfg.rows ? cfg.rows() : S.list(cfg.entity);
    const filters = (cfg.filters || []).map(fl => {
      const vals = fl.values ? fl.values() : U.uniqSorted(rows.map(r => (fl.get ? fl.get(r) : r[fl.key])));
      return `<select class="input" data-change="crudFilter" data-crud="${cfg.id}" data-key="${fl.key}" aria-label="Filter by ${esc(fl.label)}"><option value="All">All ${esc(fl.label)}</option>${vals.map(v => `<option ${s.f[fl.key] === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
    }).join('');
    return `<div class="toolbar"><input class="input grow" type="search" placeholder="Search…" value="${esc(s.q)}" data-input="crudSearch" data-crud="${cfg.id}" aria-label="Search ${esc(cfg.title || cfg.entity)}">${filters}<span class="count" id="crud-${cfg.id}-count">${esc(count)}</span></div>`;
  }
  /** Returns HTML for a full register panel. */
  function table(cfg) {
    Crud.cfgs[cfg.id] = cfg; const b = bodyHtml(cfg);
    const add = cfg.canAdd === false ? '' : UI.btn(cfg.addLabel || '+ Add', 'crudAdd', cfg.id);
    return UI.panel(cfg.title, `${toolbar(cfg, b.count)}<div id="crud-${cfg.id}-body">${b.html}</div>`, add);
  }
  function refresh(id) {
    const cfg = Crud.cfgs[id]; if (!cfg) return; const b = bodyHtml(cfg);
    const body = document.getElementById(`crud-${id}-body`), cnt = document.getElementById(`crud-${id}-count`);
    if (body) body.innerHTML = b.html; if (cnt) cnt.textContent = b.count;
  }

  UI.on('crudSearch', (v, el) => { st(el.dataset.crud).q = v; refresh(el.dataset.crud); });
  UI.on('crudFilter', (v, el) => { st(el.dataset.crud).f[el.dataset.key] = v; refresh(el.dataset.crud); });
  UI.on('crudAdd', id => { const cfg = Crud.cfgs[id]; (cfg.onAdd || (() => formModal(Object.assign({ entity: cfg.entity }, cfg.form || {}))))(); });
  UI.on('crudEdit', (id, el) => { const cfg = Crud.cfgs[id]; formModal(Object.assign({ entity: cfg.entity, id: el.dataset.rec }, cfg.form || {})); });
  UI.on('crudDelete', async (id, el) => {
    const cfg = Crud.cfgs[id], def = Sc.entities[cfg.entity], rec = S.get(cfg.entity, el.dataset.rec); if (!rec) return;
    const ok = await UI.confirm({ title: `Delete ${def.label.toLowerCase()}?`, message: `${def.title(rec)} will be permanently removed from this ${S.mode()} workspace.`, ok: 'Delete', danger: true });
    if (!ok) return; const res = S.remove(cfg.entity, rec.id, { by: by() });
    UI.toast(res.ok ? `${def.label} deleted` : res.error, res.ok ? 'ok' : 'err');
  });

  Crud.table = table; Crud.formModal = formModal; Crud.refresh = refresh;
  Crud.fieldsGrid = fieldsGrid; Crud.inlineSubmit = inlineSubmit; Crud.showErrors = showErrors; Crud.readForm = readForm;
  LGM.Crud = Crud;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/pages/dashboard.js */
/* PAGE — Dashboard. Every number is computed from records (V6 had hard-coded values). */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {}); LGM.Pages = LGM.Pages || {};
  const UI = LGM.UI, C = LGM.Config, M = LGM.Metrics, S = LGM.Store, U = LGM.Util;

  function recent(s) {
    const rows = s.activity.filter(a => a.text).slice(0, 7).map(a => [a.client || '—', a.text, String(a.at).slice(0, 10)]);
    return UI.table(['Client', 'Update', 'Date'], rows, { empty: 'No activity yet — add or import records and the latest changes appear here.' });
  }
  function pending(s) {
    const rows = LGM.Alerts.compute(s).slice(0, 6).map(a => [a.action, a.assigned, a.count, UI.btn('Open', 'go', a.link.page, 'secondary small')]);
    return UI.table(['Pending action', 'Assigned to', 'Count', ''], rows, { empty: 'Nothing pending.' });
  }

  LGM.Pages.dashboard = {
    render() {
      const s = S.state(), div = UI.state.division;
      let h = UI.heading('Management Dashboard', 'Overview of both operating recruitment divisions') +
        UI.tabs([['labour', 'Overseas Labour · Active'], ['domestic', 'Domestic Workers · Active'], ['corporate', 'Local Corporate · Future']], div, 'setDivision');
      if (div === 'labour') {
        const m = M.labour(s), total = Math.max(1, U.sum(m.groups, x => x.count));
        h += UI.cards([UI.metric('Open Orders', m.openOrders, 'Across active clients'), UI.metric('CVs Received', m.cvsReceived.toLocaleString('en-US'), 'Candidate records'),
          UI.metric('Visa Pipeline', m.visaPipeline, 'Across visa stages'), UI.metric('Ready to Fly', m.readyToFly, 'Deployment queue')]);
        h += `<div class="split">${UI.panel('Live Recruitment Pipeline', m.groups.map(x => UI.bar(x.label, x.count, (x.count / total) * 100)).join('') + UI.muted('Each candidate is counted once, in their current stage group. Deployed and rejected candidates are not shown here.'))}${UI.panel('Recent Activity', recent(s))}</div>`;
        h += UI.panel('Pending Actions', pending(s), UI.btn('All reminders', 'go', 'reports', 'secondary small'));
      } else if (div === 'domestic') {
        const m = M.domestic(s);
        h += UI.cards([UI.metric('Enquiries', m.enquiries, 'Customer leads'), UI.metric('Profiles Shared', m.profilesShared, 'Worker CVs'), UI.metric('Visa Cases', m.visaCases, 'Processing'), UI.metric('Handovers', m.handovers, 'Arrived / handed over')]);
        h += UI.panel('Domestic Worker Journey', UI.flow(C.domesticDashboardFlow));
      } else {
        h += UI.panel('Future Division', `<p>Local Qatar corporate recruitment has <b>not yet started</b>. When activated, the client pays a negotiated placement fee, typically half or one month of the candidate’s basic salary, with the payment trigger determined by the client agreement.</p>${UI.btn('View future module', 'go', 'corporate', 'secondary')}`);
      }
      h += S.mode() === 'demo'
        ? UI.notice('DEMO WORKSPACE — all candidates, clients and transactions are fictional sample data. Counters are calculated from these records; switch workspace in Settings & Data.')
        : UI.notice('LIVE WORKSPACE — counters are calculated from the records entered or imported here. Data is held in this browser only (not secure, not shared). Take regular backups in Settings & Data.', 'live');
      return h;
    },
  };
  UI.on('setDivision', d => { UI.state.division = d; LGM.App.render(); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/pages/sales.js */
/* PAGES — Client CRM, Sales Visits & Follow-ups, Demand Letters. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {}); LGM.Pages = LGM.Pages || {};
  const UI = LGM.UI, Crud = LGM.Crud, M = LGM.Metrics, S = LGM.Store, U = LGM.Util, esc = U.esc;
  const sameClient = (a, b) => U.norm(a) === U.norm(b);

  LGM.Pages.clients = {
    render() {
      const s = S.state(), m = M.crm(s);
      return UI.heading('Client CRM', 'Market visits → company introduction → enquiry → client order', UI.btn('+ Record Visit', 'newVisit')) +

  });
  UI.on('stageUndo', async id => {
    const c = S.get('candidates', id); if (!c) return;
    const prev = c.history[c.history.length - 2].stage;
    if (!(await UI.confirm({ title: 'Return to previous stage?', message: `${c.name}: ${c.status} → ${prev}. The correction is recorded in the activity log.`, ok: 'Return to ' + prev }))) return;

          columns: [{ label: 'Candidate', get: r => `${r.id} · ${r.name}` }, { label: 'Client', get: r => r.client }, { label: 'Current Stage', get: r => UI.badge(r.status) }, { label: 'Visa No.', get: r => r.visa_number }, { label: 'QVC date', get: r => r.qvc_date },
