          columns: [{ label: 'Case', get: r => r.id }, { label: 'Customer', get: r => r.customer }, { label: 'Worker Origin', get: r => r.origin }, { label: 'Status', get: r => UI.badge(r.status) }, { label: 'Next Action', get: r => r.next_action }],
          rowActions: r => { const i = C.domesticStatuses.indexOf(r.status); return i < C.domesticStatuses.length - 1 ? UI.btn('Next →', 'domesticNext', r.id, 'small', `title="${U.esc(C.domesticStatuses[i + 1])}"`) : ''; },
        }) + UI.notice('Fees, payment timing, guarantees, refunds and replacements must be configured and validated against current Qatar law and the signed recruitment contract. This version tracks case progress only; it does not calculate fees or refunds (open question OQ-10).');
    },
  };
  UI.on('domesticNext', id => {
    const d = S.get('domestic', id); if (!d) return; const next = C.domesticStatuses[C.domesticStatuses.indexOf(d.status) + 1];
    const r = S.update('domestic', id, { status: next }, { by: UI.state.role }); UI.toast(r.ok ? `${d.id} → ${next}` : Object.values(r.errors).join(' '), r.ok ? 'ok' : 'err');
  });

  LGM.Pages.corporate = {
    render() {
      return UI.heading('Local Corporate Recruitment', 'Planned division — not yet operational') +
        UI.panel('Launch Status', `<span class="pill grey">Not Started</span><p>Future workflow: client vacancy → Qatar-local candidate sourcing → shortlist → interview → offer → joining → negotiated placement fee.</p>${UI.muted('No vacancy / placement records are kept until the division starts and its data model is defined (open question OQ-11).')}`) +
        UI.panel('Illustrative Client Fee Calculator', `<div class="formgrid"><div><label for="salary">Candidate basic monthly salary (QAR)</label><input id="salary" class="input" type="number" min="0" value="6000" data-input="calcFee"></div>
          <div><label for="rate">Negotiated fee</label><select id="rate" class="input" data-change="calcFee">${C.corporateFeeRates.map(([v, l]) => `<option value="${v}">${U.esc(l)}</option>`).join('')}</select></div></div>
          <div class="divider"></div><div class="muted">Sample client placement fee</div><div class="metric" id="feeResult">${U.money(6000)}</div>
          <p class="muted">Invoice milestone, payment terms and any warranty are negotiated separately with each client.</p>`);
    },
  };
  UI.on('calcFee', () => { const s = Math.max(0, Number(document.getElementById('salary').value) || 0), r = Number(document.getElementById('rate').value); document.getElementById('feeResult').textContent = U.money(s * r); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/pages/management.js */
/* PAGES — Master Recruitment Report, Reports & Alerts (reminders + audit), AI Reports & Exports (keyword reports). */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {}); LGM.Pages = LGM.Pages || {}; LGM.PageHelpers = LGM.PageHelpers || {};
  const UI = LGM.UI, C = LGM.Config, M = LGM.Metrics, S = LGM.Store, U = LGM.Util, R = LGM.Reports, esc = U.esc;

  /** Run a report and download it. Shared by the toolbar, Reports & Alerts, AI Reports and Master report. */
  function exportReport(name, filters = {}) {
    const res = R.run(name, S.state(), Object.assign({ today: U.todayISO() }, filters), UI.state.role);
    if (res.error) return UI.toast(res.error, 'err');
    if (!res.rows.length) return UI.toast('No matching records for "' + name + '". Change the filters, add records or import data.', 'err');
    LGM.Exporter.exportRows(name, res.columns, res.rows); UI.toast(`Exported ${res.rows.length} row(s) — ${LGM.Exporter.last().name}`, 'ok');
  }
  LGM.PageHelpers.exportReport = exportReport;
  UI.on('exportReport', name => exportReport(name, UI.state.filters));

  // ---------------- Master Recruitment Report ----------------
  function masterResults() {
    const vm = UI.state.vm, m = M.masterReport(S.state(), { country: vm.country, query: vm.q }), t = m.total;
    const rem = r => (r.remaining < 0 ? UI.raw(`<span class="pill red" title="More candidates than ordered quantity">${r.remaining}</span>`) : r.remaining);
    const row = r => [r.company, r.country, r.demand, r.applied, r.qvc, r.rtp, r.printed, r.deployed, rem(r)];
    return UI.cards([UI.metric('Total Demand', t.demand, 'Selected clients'), UI.metric('Visa Applied', t.applied, 'Current stage'), UI.metric('QVC', t.qvc, 'Current stage'), UI.metric('RTP', t.rtp, 'Current stage'),
      UI.metric('Visa Printed', t.printed, 'Current stage'), UI.metric('Deployed', t.deployed, 'Arrived / joined / warranty')], 'grid-template-columns:repeat(3,minmax(0,1fr))') +
      UI.panel('Company-wise Consolidated Status', UI.table(['Company', 'Country', 'Order', 'Applied', 'QVC', 'RTP', 'Printed', 'Deployed', 'Remaining'],
        m.rows.map(row).concat(m.rows.length ? [[UI.raw('<b>TOTAL</b>'), '', UI.raw(`<b>${t.demand}</b>`), UI.raw(`<b>${t.applied}</b>`), UI.raw(`<b>${t.qvc}</b>`), UI.raw(`<b>${t.rtp}</b>`), UI.raw(`<b>${t.printed}</b>`), UI.raw(`<b>${t.deployed}</b>`), UI.raw(`<b>${t.remaining}</b>`)]] : []),
        { empty: 'No orders or candidates match. Add orders/candidates or import them.' }));
  }
  LGM.Pages['visa-master'] = {
    render() {
      const vm = UI.state.vm, s = S.state(); const countries = U.uniqSorted([...s.orders.map(o => o.country), ...s.candidates.map(c => c.country)]);
      return UI.heading('Master Recruitment Report', 'All clients visa summary — company-wise status in one page, calculated from orders and candidate records') +
        `<div class="panel"><div class="row"><div><label for="vmCountry">Country</label><select id="vmCountry" class="input" style="width:auto" data-change="vmCountry"><option>All</option>${countries.map(c => `<option ${vm.country === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
        <div><label for="vmQuery">Client</label><input id="vmQuery" class="input" style="width:240px" type="search" placeholder="Search company" value="${esc(vm.q)}" data-input="vmQuery"></div>
        <div style="align-self:flex-end">${UI.btn('Export CSV for Excel', 'exportMaster', '', 'secondary')}</div></div></div>` +
        `<div id="vm-results">${masterResults()}</div>` +
        UI.notice('Calculated from live records. Demand = sum of order quantities for the client and country; each candidate is counted once, in their current stage; Remaining = Demand − (Applied + QVC + RTP + Printed + Deployed). Candidates earlier than Visa Applied therefore still count as Remaining. Click-through to candidate lists is available from the Candidates page filters.');
    },
  };
  UI.on('vmCountry', v => { UI.state.vm.country = v; LGM.App.render(); });
  UI.on('vmQuery', v => { UI.state.vm.q = v; document.getElementById('vm-results').innerHTML = masterResults(); });  // partial update: keeps focus (V6 defect D-12)
  UI.on('exportMaster', () => exportReport('Master Recruitment Report', { country: UI.state.vm.country, client: UI.state.vm.q || 'All' }));

  // ---------------- Reports & Alerts ----------------
  const PLANNED = [['Country-wise Recruitment', 'Orders, CVs, selection and deployment'], ['Agent Performance', 'CVs, selection ratio, arrivals (CV quality not defined — OQ-21)'],
    ['Warranty Expiry', 'Upcoming expiries and open complaints'], ['Demand & Sales Visits', 'Follow-up, conversion and open demand']];
  LGM.Pages.reports = {
    render() {
      const s = S.state(), alerts = LGM.Alerts.compute(s);
      const reportRows = [['All Clients Visa Summary', 'One-page company-wise visa position', UI.raw(UI.btn('Open', 'go', 'visa-master', 'secondary small') + ' ' + UI.btn('Export', 'exportMaster', '', 'ghost small'))],
        ...PLANNED.map(([n, p]) => [n, p, UI.raw(UI.btn('Preview', 'runReport', n, 'secondary small') + ' ' + UI.btn('Export', 'exportReportNamed', n, 'ghost small'))])];
      const rem = alerts.map(a => [UI.badge('Pending'), a.action, a.assigned, a.count, UI.raw(a.items.slice(0, 3).map(x => `<span class="tag">${esc(x)}</span>`).join('') + (a.count > 3 ? `<span class="muted">+${a.count - 3} more</span>` : '')), UI.btn('Open', 'go', a.link.page, 'secondary small')]);
      const audit = s.activity.slice(0, 100).map(a => [String(a.at).slice(0, 16).replace('T', ' '), LGM.Permissions.roleLabel(a.by) || '—', a.client || '—', a.text]);
      return UI.heading('Reports, Reminders & Audit', 'Management-wide reports and pending operational actions') +
        UI.panel('Management Reports', UI.table(['Report', 'Purpose', 'Open'], reportRows)) +
        UI.panel('Reminders', UI.table(['Priority', 'Action', 'Assigned To', 'Count', 'Items', ''], rem, { empty: 'No pending reminders. Everything is up to date.' }) +
          UI.muted('Reminders are calculated from live records each time this page opens. They are in-app only: e-mail / WhatsApp / scheduled delivery needs a backend (OQ-17).')) +
        UI.panel('Audit Log (latest 100 changes)', UI.table(['When', 'Role', 'Client', 'Activity'], audit, { empty: 'No activity recorded yet.' }), UI.btn('Export audit log', 'exportAudit', '', 'secondary small')) +
        UI.notice('Financial reports remain private (Managing Director and Admin Manager). The audit log is held in this browser and can be cleared by clearing site data — a tamper-proof server-side audit trail is a production requirement.');
    },
  };
  UI.on('runReport', name => { const r = R.run(name, S.state(), { today: U.todayISO() }, UI.state.role); if (r.error) UI.toast(r.error, 'err'); else UI.previewReport(r); });
  UI.on('exportReportNamed', name => exportReport(name));
  UI.on('exportAudit', () => {
    const rows = S.state().activity.map(a => ({ at: a.at, role: a.by, client: a.client, entity: a.entity, id: a.id, text: a.text }));
    if (LGM.Exporter.exportRows('Audit_Log', ['at', 'role', 'client', 'entity', 'id', 'text'], rows)) UI.toast('Audit log exported', 'ok'); else UI.toast('Audit log is empty', 'err');
  });

  // ---------------- AI Reports & Exports (keyword filter — not AI) ----------------
  LGM.Pages['ai-reports'] = {
    render() {
      const s = S.state(), staff = UI.state.role === 'staff', imp = e => s[e].filter(x => x._src).length;
      const presets = ['QVC pending', 'Flight pending', 'Visa printed', 'All candidates', 'All manpower orders', ...(staff ? [] : ['All finance transactions'])];
      return UI.heading('AI Reports & Excel Exports', 'Ask for pending QVC, flights, client status, agency accounts and more') +
        UI.notice('This is a keyword-based report filter, NOT a connected AI model. It reads the records in this workspace and tells you how it understood your request. CSV opens in Excel; native .xlsx and natural-language reporting need the production system.') +
        UI.panel('Ask for a report', `<label for="aiQuery">Report request</label><input class="input" id="aiQuery" placeholder="e.g. Show QVC pending for ${esc((s.clients[0] || {}).name || 'a client')} Nepal"><p><button class="btn" data-act="aiRun" type="button">Generate report</button></p>
          <div class="row" style="gap:8px">${presets.map(x => UI.btn(x, 'aiPreset', x, 'secondary')).join('')}</div>`) +
        UI.panel('One-click Exports', `<div class="row" style="gap:10px">${[['All Clients Visa Summary', 'Master Recruitment Report'], ['QVC Pending', 'QVC Pending'], ['Flight Pending', 'Flight Pending'], ['Manpower Orders', 'All Orders'], ['CV Intake', 'CV Intake'], ...(staff ? [] : [['Private Finance', 'Private Finance']])]
          .map(([l, n]) => UI.btn(l, 'exportReportNamed', n, 'secondary')).join('')}</div>`) +
        UI.panel('Record Counts', UI.cards([UI.metric('Candidates', s.candidates.length, `${imp('candidates')} imported from files`), UI.metric('Orders', s.orders.length, `${imp('orders')} imported from files`),
          ...(staff ? [] : [UI.metric('Finance entries', s.finance.length, `${imp('finance')} imported from files`)]), UI.metric('CV intake files', s.cvInbox.length, 'Metadata only')]));
    },
  };
  const runAi = q => { const r = R.keyword(q, S.state(), UI.state.role); if (r.error) UI.toast(r.error, 'err'); else UI.previewReport(r); };
  UI.on('aiRun', () => runAi(document.getElementById('aiQuery').value));
  UI.on('aiPreset', q => { document.getElementById('aiQuery').value = q; runAi(q); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/pages/data.js */
/* PAGES — Excel Import Center, CV Intake Center, Settings & Data (workspaces, backup/restore, data quality). */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {}); LGM.Pages = LGM.Pages || {};
  const UI = LGM.UI, Crud = LGM.Crud, C = LGM.Config, S = LGM.Store, U = LGM.Util, I = LGM.Importer, P = LGM.Permissions, esc = U.esc;
  const rerender = () => LGM.App.render();

  // =============================== Excel Import Center ===============================
  const imp = () => UI.state.imp || (UI.state.imp = { target: 'candidates', fileName: '', columns: [], rows: [], sheetNames: [], sheetIndex: 0, mapping: {}, analysis: null, message: '', fileObj: null });
  const targetLabel = { candidates: 'Candidates / Visa Status', orders: 'Manpower Orders', finance: 'Private Finance' };

  function mappingSelect(f) {
    const i = imp();
    return `<select class="input" data-change="impMap" data-field="${f}" aria-label="Column for ${esc(I.label(f))}"><option value="">-- Not mapped --</option>${i.columns.map((c, k) => `<option value="${k}" ${i.mapping[f] === String(k) ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>`;
  }
  function analysisPanel(i) {
    const a = i.analysis; if (!a) return '';
    const probs = [...a.invalid.map(x => [x.row, UI.badge('Rejected'), x.errors.join('; ')]), ...a.duplicates.map(x => [x.row, UI.badge('Duplicate'), x.reason])].sort((p, q) => p[0] - q[0]);
    const warn = a.valid.filter(v => v.warnings.length);
    return UI.panel('Step 5 — Validation result (nothing has been imported yet)',
      UI.cards([UI.metric('Ready to import', a.valid.length, 'Passed all checks'), UI.metric('Duplicates', a.duplicates.length, 'Will be skipped'), UI.metric('Rejected', a.invalid.length, 'Need fixing'), UI.metric('Rows read', a.total, i.fileName)], 'grid-template-columns:repeat(4,minmax(0,1fr));margin:0 0 14px') +
      (probs.length ? UI.table(['Data row', 'Result', 'Reason'], probs.slice(0, 50)) + (probs.length > 50 ? UI.muted(`Showing first 50 of ${probs.length}. Download the full list below.`) : '') : UI.muted('No problems found.')) +
      (warn.length ? UI.muted(`${warn.length} valid row(s) carry warnings (e.g. order not found, unknown category) — they will still import.`) : '') +
      `<div class="row" style="margin-top:14px">${UI.btn(`Import ${a.valid.length} valid row(s)`, 'impCommit', '', '', a.valid.length ? '' : 'disabled')}${probs.length ? UI.btn('Download rejected / duplicate rows (CSV)', 'impProblems', '', 'secondary') : ''}</div>`);
  }

  LGM.Pages['import-center'] = {
    render() {
      const i = imp(), role = UI.state.role, canFin = P.can(role, 'finance.import'); const req = I.REQUIRED[i.target] || [];
      const missing = req.filter(f => i.mapping[f] === '' || i.mapping[f] == null);
      let h = UI.heading('Excel Import Center', 'Upload your existing projects, candidate lists and finance sheets; map columns, validate, then import') +
        UI.notice(`Supports CSV, TSV and standard XLSX (one worksheet at a time) in a modern browser. Rows are validated against the same rules as manual entry; duplicates are skipped; rejected rows are listed with the reason. Imported records go into the ${S.mode().toUpperCase()} workspace and appear immediately on the normal pages. Old .xls must be saved as .xlsx first. ${S.mode() === 'live' ? 'Browser storage is not secure — see Settings & Data.' : 'Use fictional data only in the demo workspace.'}`);
      h += UI.panel('Step 1 — Select the Excel file', `<div class="row"><input class="input" style="max-width:420px" type="file" accept=".xlsx,.csv,.tsv,.txt" data-change="impPick" aria-label="Choose file">${UI.btn('Download backup', 'backupDownload', '', 'secondary')}</div>
        ${i.sheetNames.length > 1 ? `<p><label for="impSheet">Worksheet</label><select id="impSheet" class="input" style="max-width:260px" data-change="impSheet">${i.sheetNames.map((n, k) => `<option value="${k}" ${k === i.sheetIndex ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></p>` : ''}
        <p class="muted">${esc(i.message)}</p>`);
      h += UI.panel('Step 2 — Choose destination', UI.tabs(Object.entries(targetLabel).filter(([k]) => k !== 'finance' || canFin), i.target, 'impTarget'));
      if (i.rows.length) {
        h += UI.panel('Step 3 — Match Excel columns', `<div class="formgrid">${I.FIELDS[i.target].map(f => `<div><label>${esc(I.label(f).toUpperCase())}${req.includes(f) ? ' <span class="req">*</span>' : ''}</label>${mappingSelect(f)}</div>`).join('')}</div>
          <p class="muted">${i.rows.length} rows found. <span class="req">*</span> = required. ${missing.length ? `<b>Still to map: ${esc(missing.map(I.label).join(', '))}.</b>` : 'All required columns are mapped.'}</p>${UI.btn('Validate ' + i.rows.length + ' rows', 'impValidate')}`);
        h += UI.panel('Step 4 — Preview first five source rows', UI.table(i.columns, i.rows.slice(0, 5).map(r => i.columns.map((_, k) => r[k] || ''))));
        h += analysisPanel(i);
      }
      const hist = S.state().imports.slice().reverse().map(x => [x.file, targetLabel[x.target] || x.target, x.added, x.duplicates, x.invalid, String(x.at).slice(0, 16).replace('T', ' ')]);
      h += UI.panel('Import History', UI.table(['File', 'Module', 'Added', 'Duplicates', 'Rejected', 'Date'], hist, { empty: 'No imports yet in this workspace.' }));
      h += UI.panel('Export workspace data', `<div class="row"><button class="btn secondary" data-act="exportReportNamed" data-arg="Candidate List" type="button">Export Candidates CSV</button><button class="btn secondary" data-act="exportReportNamed" data-arg="All Orders" type="button">Export Orders CSV</button>${P.can(role, 'finance.export') ? '<button class="btn secondary" data-act="exportReportNamed" data-arg="Private Finance" type="button">Export Finance CSV</button>' : ''}</div>`);
      return h;
    },
  };
  UI.on('impTarget', t => { const i = imp(); i.target = t; i.mapping = i.columns.length ? I.guessMapping(t, i.columns) : {}; i.analysis = null; rerender(); });
  UI.on('impMap', (v, el) => { const i = imp(); i.mapping[el.dataset.field] = v; i.analysis = null; rerender(); });
  UI.on('impPick', async (v, el) => {
    const f = el.files && el.files[0]; if (!f) return; const i = imp();
    try {
      const r = await I.readFile(f, 0);
      Object.assign(i, { fileObj: f, fileName: f.name, columns: r.columns, rows: r.rows, sheetNames: r.sheetNames, sheetIndex: r.sheetIndex, mapping: I.guessMapping(i.target, r.columns), analysis: null,
        message: `Loaded ${r.rows.length} rows from ${f.name}${r.truncated ? ` (only the first ${C.importMaxRows} rows are read)` : ''}. Check the column mapping, then validate.` });
      rerender();
    } catch (e) { UI.toast('Import error: ' + e.message, 'err'); el.value = ''; }
  });
  UI.on('impSheet', async v => {
    const i = imp(); try { const r = await I.readFile(i.fileObj, Number(v)); Object.assign(i, { columns: r.columns, rows: r.rows, sheetIndex: r.sheetIndex, mapping: I.guessMapping(i.target, r.columns), analysis: null, message: `Loaded ${r.rows.length} rows from worksheet "${r.sheetNames[r.sheetIndex]}".` }); rerender(); }
    catch (e) { UI.toast('Import error: ' + e.message, 'err'); }
  });
  UI.on('impValidate', () => {
    const i = imp(), miss = (I.REQUIRED[i.target] || []).filter(f => i.mapping[f] === '' || i.mapping[f] == null);
    if (miss.length) return UI.toast('Map the required columns first: ' + miss.map(I.label).join(', '), 'err');
    try { i.analysis = I.analyse(i.target, I.mapRows(i.target, i.rows, i.mapping), S.state(), UI.state.role, S); rerender(); } catch (e) { UI.toast(e.message, 'err'); }
  });
  UI.on('impProblems', () => { const i = imp(); LGM.Exporter.download(LGM.Exporter.fileName('Import_problems_' + i.target), LGM.Csv.stringify(I.problemRows(i.analysis))); });
  UI.on('impCommit', async () => {
    const i = imp(), a = i.analysis; if (!a || !a.valid.length) return;
    const ok = await UI.confirm({ title: 'Import rows?', message: `Import ${a.valid.length} validated row(s) into the ${S.mode().toUpperCase()} workspace? ${a.duplicates.length} duplicate(s) and ${a.invalid.length} rejected row(s) will be skipped.${S.mode() === 'demo' ? ' Use fictional data only.' : ''}`, ok: 'Import' });
    if (!ok) return;
    const res = I.commit(a, { fileName: i.fileName }, S, UI.state.role);
    i.analysis = null; i.message = `Imported ${res.added} record(s); skipped ${res.duplicates} duplicate(s) and ${res.invalid} rejected row(s).`; UI.toast(i.message, 'ok'); rerender();
  });

  // =============================== CV Intake Center ===============================
  const cvs = () => UI.state.cv || (UI.state.cv = { source: C.cvSources[0], client: '', agency: '', country: 'Nepal', message: '' });
  LGM.Pages['cv-inbox'] = {
    render() {
      const c = cvs(), s = S.state();
      const rows = s.cvInbox.slice().reverse().map(x => [x.filename, x.source, x.client, x.agency, x.extracted_email, UI.raw(`${UI.badge(x.status)}<span class="src">${esc(x.note)}</span>`),
        UI.raw(`<div class="table-actions">${UI.btn('Create candidate', 'cvCreate', x.id, 'small')}${UI.btn('Reviewed', 'cvStatus', x.id, 'secondary small', 'data-s="Reviewed"')}${UI.btn('Ignore', 'cvStatus', x.id, 'ghost small', 'data-s="Ignored"')}${UI.btn('Delete', 'cvDelete', x.id, 'danger small')}</div>`)]);
      return UI.heading('CV Intake Center', 'Collect CVs from files, email attachments and WeTransfer downloads') +
        UI.notice('This version cannot connect to Gmail, Outlook or WeTransfer links automatically. Download email attachments or WeTransfer archives first, then upload the files here. Only file details are recorded — the files themselves are not stored. Do not upload real passports or sensitive CVs to this unsecured prototype.') +
        UI.panel('Upload CVs and Attachments', `<div class="formgrid"><div><label for="cvSource">Source</label><select class="input" id="cvSource" data-change="cvField" data-k="source">${C.cvSources.map(x => `<option ${c.source === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
          <div><label for="cvClient">Client</label><input class="input" id="cvClient" list="cvClients" value="${esc(c.client)}" data-input="cvField" data-k="client" placeholder="e.g. a registered client"><datalist id="cvClients">${s.clients.map(x => `<option value="${esc(x.name)}">`).join('')}</datalist></div>
          <div><label for="cvAgency">Overseas agency</label><input class="input" id="cvAgency" value="${esc(c.agency)}" data-input="cvField" data-k="agency" placeholder="e.g. an overseas agency"></div>
          <div><label for="cvCountry">Country</label><input class="input" id="cvCountry" list="cvCountries" value="${esc(c.country)}" data-input="cvField" data-k="country"><datalist id="cvCountries">${C.countries.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div></div>
          <p><input class="input" type="file" multiple accept=".txt,.csv,.eml,.docx,.pdf,.zip,.rar,.7z" data-change="cvUpload" aria-label="Choose CV files"></p><p class="muted">${esc(c.message)}</p>
          <p class="muted">Text extraction: TXT, EML, CSV and DOCX (first e-mail and phone number found). PDFs and ZIP/RAR packages are listed for review; PDF parsing, OCR and archive extraction need a backend service.</p>`) +
        UI.panel('CV Intake Review Queue', UI.table(['File', 'Source', 'Client', 'Agency', 'Extracted E-mail', 'Status', ''], rows, { empty: 'No files received yet.' })) +
        UI.panel('Export Intake Log', UI.btn('Export CV Intake CSV', 'exportReportNamed', 'CV Intake', 'secondary')) +
        UI.panel('Production Automation Requirements', '<p>Connect an authorized shared recruitment mailbox via Microsoft Graph or Gmail API, download attachments securely, support WeTransfer files after authorized retrieval, unpack ZIP/RAR, extract PDF/DOCX/CV text with OCR where necessary, identify passport and trade, detect duplicates, match orders and agencies, and send uncertain matches to staff review. Never automatically share confidential documents with the wrong client.</p>');
    },
  };
  UI.on('cvField', (v, el) => { cvs()[el.dataset.k] = v; });
  UI.on('cvUpload', async (v, el) => {
    const files = Array.from(el.files || []); if (!files.length) return; const c = cvs(); let added = 0, dup = 0; const errs = [];
    for (const f of files) {
      try {
        const item = await LGM.CvIntake.process(f, c);
        if (S.state().cvInbox.some(x => x.filename === item.filename && x.size === item.size)) { dup++; continue; }
        const r = S.insert('cvInbox', item, { silent: true, defer: true, by: UI.state.role }); if (r.ok) added++; else errs.push(f.name + ': ' + Object.values(r.errors).join(' '));
      } catch (e) { errs.push(f.name + ': ' + e.message); }
    }
    S.log(`CV intake: ${added} file record(s) added`, c.client, 'cvInbox', '', { by: UI.state.role }); S.flush();
    c.message = `Added ${added} file record(s)${dup ? `, skipped ${dup} already received` : ''}${errs.length ? '. Problems: ' + errs.join(' | ') : ''}. Files themselves are NOT stored.`;
    UI.toast(c.message, errs.length ? 'err' : 'ok'); rerender();
  });
  UI.on('cvStatus', (id, el) => { const r = S.update('cvInbox', id, { status: el.dataset.s }, { by: UI.state.role, silent: true }); UI.toast(r.ok ? 'Marked ' + el.dataset.s : Object.values(r.errors).join(' '), r.ok ? 'ok' : 'err'); });
  UI.on('cvDelete', async id => { if (await UI.confirm({ title: 'Delete intake record?', message: 'Only the log entry is removed (the file itself was never stored).', ok: 'Delete', danger: true })) S.remove('cvInbox', id, { by: UI.state.role }); });
  UI.on('cvCreate', id => {
    const x = S.get('cvInbox', id); if (!x) return;
    Crud.formModal({ entity: 'candidates', defaults: { client: x.client, agency: x.agency, country: x.country || 'Nepal', name: x.filename.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ') }, title: `New candidate from ${x.filename}`,
      onSaved: () => S.update('cvInbox', id, { status: 'Candidate created' }, { silent: true, by: UI.state.role }) });
  });

  // =============================== Settings & Data ===============================
  function quality(s) {
    const reg = new Set(s.clients.map(c => U.norm(c.name)));
    const names = U.uniqSorted([...s.orders, ...s.candidates, ...s.visits, ...s.demands, ...s.interviews].map(x => x.client)).filter(n => n && !reg.has(U.norm(n)));
    const travelStage = ['Visa Printed', 'Deployment Ready', 'Arrived', 'Joined', 'Warranty'];
    const today = U.todayISO();
    return {
      names,
      checks: [
        ['Client names used in records but not in the Client Register', names.length, names.length ? UI.btn(`Add ${names.length} to register`, 'dqAddClients', '', 'small') : '—'],
        ['Candidates not linked to an order', s.candidates.filter(c => !c.order_id).length, UI.btn('View', 'go', 'candidates', 'ghost small')],
        ['Orders with no linked candidates', s.orders.filter(o => !s.candidates.some(c => c.order_id === o.id)).length, UI.btn('View', 'go', 'orders', 'ghost small')],
        ['Orders whose agency allocations exceed the ordered quantity', s.orders.filter(o => U.sum(s.allocations.filter(a => a.order_id === o.id), a => a.allocated) > o.qty).length, UI.btn('View', 'go', 'agencies', 'ghost small')],
        ['Candidates at Visa Printed or later without a travel record', s.candidates.filter(c => travelStage.includes(c.status) && !s.tickets.some(t => t.candidate_id === c.id)).length, UI.btn('View', 'go', 'tickets', 'ghost small')],
        ['Open warranty cases past their expiry date', s.warranties.filter(w => w.status !== 'Closed' && w.warranty_expiry && w.warranty_expiry < today).length, UI.btn('View', 'go', 'warranty', 'ghost small')],
      ],
    };
  }
  const cfgRows = () => [
    ['Candidate stages and order', C.stages.join(' → '), 'From V6'], ['Optional (skippable) stages', C.optionalStages.join(', '), 'From V6 notes'],
    ['Reject allowed from', C.rejectableFrom.join(', '), 'ASSUMPTION · OQ-1'], ['Dashboard pipeline groups', C.pipelineGroups.map(g => `${g.label}: ${g.stages.join(', ')}`).join(' | '), 'ASSUMPTION · OQ-2'],
    ['Flight Pending', C.stageSets['Flight Pending'].join(', '), 'From V6 (conflicting definitions) · OQ-4'], ['Deployed (master report)', C.stageSets.Deployed.join(', '), 'ASSUMPTION · OQ-5'],
    ['Order stages / closed', C.orderStatuses.join(', ') + ' — closed: ' + C.orderClosed.join(', '), 'Mixed · OQ-3'], ['Labour warranty (months)', String(C.warrantyMonths.Labour), 'V6 “illustrative” · OQ-8'],
    ['Domestic warranty (months)', 'not set — enter expiry manually', 'V6: verify against Qatar law · OQ-8'], ['Warranty alert window (days)', String(C.warrantyAlertDays), 'ASSUMPTION · OQ-21'],
    ['Candidate ID prefixes', Object.entries(C.countryPrefix).map(([k, v]) => `${k}=${v}`).join(', '), 'BD/NP from V6; others ASSUMPTION · OQ-22'], ['Currency', C.app.currency, 'From V6 · OQ-24'],
  ];

  LGM.Pages.settings = {
    render() {
      const role = UI.state.role, mode = S.mode(), q = quality(S.state()), counts = S.ENT.filter(e => !['imports', 'activity'].includes(e)).map(e => [e, S.list(e).length]);
      return UI.heading('Settings & Data', 'Workspaces, backup and restore, data quality and configuration') +
        UI.panel('Workspace', `<p>You are working in the <span class="mode-pill ${mode === 'demo' ? 'mode-demo' : 'mode-live'}" style="cursor:default">${mode.toUpperCase()}</span> workspace.</p>
          <p class="muted">${mode === 'demo' ? 'The DEMO workspace holds fictional sample data so every screen has something to calculate. It is stored separately from the LIVE workspace, and exports are labelled DEMO.' : 'The LIVE workspace starts empty and holds the records you enter or import. It is stored separately from the DEMO workspace, and exports are labelled LIVE. It is still only browser storage: not encrypted, not backed up, not shared between users or devices.'}</p>
          ${P.can(role, 'workspace.switch') ? UI.btn(mode === 'demo' ? 'Switch to LIVE workspace' : 'Switch to DEMO workspace', 'wsSwitch', mode === 'demo' ? 'live' : 'demo', mode === 'demo' ? '' : 'secondary') : UI.muted('Only the Managing Director or Admin Manager can switch workspace.')}
          <div class="divider"></div>${UI.table(['Data set', 'Records'], counts)}`) +
        UI.panel('Backup & Restore', `<p class="muted">A backup contains every record in the current (${mode.toUpperCase()}) workspace as a JSON file. Restoring replaces the current workspace’s data. Keep backups somewhere safe; clearing browser data deletes the workspace.</p>
          <div class="row">${UI.btn('Download backup (JSON)', 'backupDownload')}${P.can(role, 'data.restore') ? `<input class="input" style="max-width:340px" type="file" accept=".json,application/json" data-change="restorePick" aria-label="Restore backup file">` : ''}</div>`) +
        UI.panel('Data Tools', `<div class="row">${mode === 'demo' && P.can(role, 'data.reset') ? UI.btn('Reset demo data to original sample', 'resetDemo', '', 'secondary') : ''}${P.can(role, 'data.reset') ? UI.btn('Clear this workspace…', 'clearWs', '', 'danger') : ''}</div>${P.can(role, 'data.reset') ? '' : UI.muted('Reset and clear are limited to the Managing Director or Admin Manager.')}`) +
        UI.panel('Data Quality Checks', UI.table(['Check', 'Count', ''], q.checks.map(c => [c[0], UI.raw(c[1] ? `<span class="pill orange">${c[1]}</span>` : '<span class="pill green">0</span>'), c[2]]))) +
        UI.panel('Configuration in force (read-only)', UI.table(['Setting', 'Value', 'Origin'], cfgRows()) + UI.muted('Everything marked ASSUMPTION is a placeholder pending client confirmation; it lives in js/config/config.js and the open-question IDs are explained in docs/01 and docs/06.')) +
        UI.panel('About this version', `<ul class="list-plain"><li><b>Prototype status:</b> offline browser application. Data stays in this browser. No login, server, database, encryption or live notifications.</li><li><b>Roles</b> are a demonstration dropdown, not authentication.</li><li>Production requirements (backend, database, authentication, permissions, secure file storage, backups, audit) are in <span class="mono">docs/06_Production_Requirements.md</span>.</li></ul>`);
    },
  };
  UI.on('wsSwitch', async m => {
    const ok = await UI.confirm({ title: `Switch to ${m.toUpperCase()} workspace?`, message: m === 'live' ? 'The LIVE workspace is separate from the demo data and starts empty. Browser storage is not secure; take backups regularly.' : 'You will see the fictional demo data again. Your LIVE records are kept.', ok: 'Switch' });
    if (ok) { S.switchMode(m); LGM.App.go('dashboard'); UI.toast(m.toUpperCase() + ' workspace active', 'ok'); }
  });
  UI.on('backupDownload', () => {
    const b = S.exportBackup(); LGM.Exporter.download(`LGM_${S.mode().toUpperCase()}_BACKUP_${U.todayISO()}.json`, JSON.stringify(b, null, 1), 'application/json');
    UI.toast('Backup downloaded', 'ok');
  });
  UI.on('restorePick', async (v, el) => {
    const f = el.files && el.files[0]; if (!f) return; let obj;
    try { obj = JSON.parse(await f.text()); } catch (e) { el.value = ''; return UI.toast('That file is not valid JSON.', 'err'); }
    const ok = await UI.confirm({ title: 'Restore backup?', message: `This REPLACES all data in the current ${S.mode().toUpperCase()} workspace with the backup (${obj.workspace || '?'} workspace, ${String(obj.exportedAt || '').slice(0, 10)}).`, ok: 'Restore', danger: true });
    if (!ok) { el.value = ''; return; } const r = S.importBackup(obj); UI.toast(r.ok ? 'Backup restored' : r.error, r.ok ? 'ok' : 'err');
  });
  UI.on('resetDemo', async () => { if (await UI.confirm({ title: 'Reset demo data?', message: 'Your changes to the DEMO workspace are discarded and the original fictional sample is restored. The LIVE workspace is not touched.', ok: 'Reset', danger: true })) { S.resetDemo(); UI.toast('Demo data reset', 'ok'); } });
  UI.on('clearWs', () => {
    UI.modal.open({ title: 'Clear this workspace', narrow: true, body: `<p style="margin-top:0">This permanently deletes <b>every record</b> in the ${S.mode().toUpperCase()} workspace. Download a backup first if you may need it.</p><label for="clearTyped">Type DELETE to confirm</label><input id="clearTyped" class="input" autocomplete="off">`,
      footer: '<button class="btn secondary" data-act="modalClose" type="button">Cancel</button><button class="btn danger" data-act="clearGo" type="button">Delete everything</button>' });
  });
  UI.on('clearGo', () => { if (document.getElementById('clearTyped').value.trim() !== 'DELETE') return UI.toast('Type DELETE (capitals) to confirm.', 'err'); UI.modal.close(); S.clearWorkspace(); UI.toast('Workspace cleared', 'ok'); });
  UI.on('dqAddClients', () => {
    const names = quality(S.state()).names; names.forEach(n => S.insert('clients', { name: n, stage: 'Prospect', next_action: 'Complete client details' }, { silent: true, defer: true, by: UI.state.role }));
    S.log(`${names.length} client(s) added to the register from existing records`, '', 'clients', '', { by: UI.state.role }); S.flush(); UI.toast(`${names.length} client(s) added as Prospect`, 'ok');
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/pages/finance.js */
/* PAGES — Private Finance (cashbook, costing) and Credentials Register. Role restriction is a DEMO control only (V6: staff cannot see Finance). */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {}); LGM.Pages = LGM.Pages || {};
  const UI = LGM.UI, Crud = LGM.Crud, C = LGM.Config, M = LGM.Metrics, S = LGM.Store, U = LGM.Util, P = LGM.Permissions, esc = U.esc;
  const divName = d => (d === 'all' ? 'All Divisions' : d === 'labour' ? 'Blue-Collar' : 'Domestic Workers');

  LGM.Pages.finance = {
    render() {
      const fd = UI.state.financeDivision, t = M.financeTotals(S.state(), fd), role = UI.state.role;
      const defDiv = fd === 'all' ? 'labour' : fd;

        UI.tabs([['labour', 'Blue-Collar · Cash'], ['domestic', 'Domestic Workers · QIIB'], ['all', 'Consolidated']], fd, 'finDivision') +
        UI.cards([UI.metric('Money Received', U.money(t.incoming), 'Selected division'), UI.metric('Money Paid', U.money(t.outgoing), 'Selected division'), UI.metric('Net Cash Movement', U.money(t.net), 'Not accounting profit'), UI.metric('Transactions', t.count, 'Cashbook entries')]);
      h += UI.panel('Record Daily Incoming / Outgoing', `<form id="fin-form" novalidate><div class="formerr notice" style="display:none;background:#feeaea;color:#8f2a2a;border-color:#f0c4c4;margin:0 0 14px"></div>${Crud.fieldsGrid('finance', { date: U.todayISO(), division: defDiv, direction: 'Incoming', account: C.financeDefaultAccount[defDiv], category: 'Agency payment' }, { scope: 'inl' })}</form>
        <p>${UI.btn(S.mode() === 'demo' ? 'Save Sample Transaction' : 'Save Transaction', 'finSave')} ${UI.btn('Export CSV', 'finExport', '', 'secondary')} ${UI.btn(S.mode() === 'demo' ? 'Reset Demo Entries…' : 'Clear all entries…', 'finClear', '', 'danger')}</p>`);
      h += Crud.table({
        id: 'finance', entity: 'finance', title: 'Daily Cashbook — ' + divName(fd), canAdd: false, search: ['date', 'party', 'client', 'country', 'category', 'ref', 'order'],
        rows: () => S.list('finance').filter(x => fd === 'all' || x.division === fd), sort: (a, b) => b.date.localeCompare(a.date),
        filters: [{ key: 'category', label: 'Categories' }, { key: 'account', label: 'Accounts' }, { key: 'direction', label: 'Directions' }],
        columns: [{ label: 'Date', get: r => r.date }, { label: 'Agency / Customer', get: r => r.party }, { label: 'Client / Country', get: r => [r.client, r.country].filter(Boolean).join(' / ') }, { label: 'Category', get: r => r.category },
          { label: 'Account', get: r => r.account }, { label: 'Incoming', get: r => (r.direction === 'Incoming' ? U.money(r.amount) : '—') }, { label: 'Outgoing', get: r => (r.direction === 'Outgoing' ? U.money(r.amount) : '—') }],
        emptyText: 'No transactions yet. Record one above or import a finance sheet.',
      });
      h += UI.panel('Client & Country Costing — ' + (S.mode() === 'demo' ? 'Sample' : 'Projection'), `<p class="muted">Change assumptions to estimate projected costs. These figures are projections, not actual transactions.</p>
        <div class="formgrid"><div><label for="costCountry">Country</label><select id="costCountry" class="input" data-change="costCountry"><option>Nepal</option><option>Bangladesh</option></select></div>
        <div><label for="costQty">Candidate quantity</label><input class="input" type="number" id="costQty" value="100" min="0" data-input="calcCost"></div>
        <div><label for="costRevenue">Agency revenue per candidate (QAR)</label><input class="input" type="number" id="costRevenue" value="${cd.revenue}" min="0" data-input="calcCost"></div>
        <div><label for="costClient">Client QVC / visa charges per candidate (QAR)</label><input class="input" type="number" id="costClient" value="${cd.client}" min="0" data-input="calcCost"></div>
        <div><label for="costInvestment">Visa investment per candidate (QAR)</label><input class="input" type="number" id="costInvestment" value="${cd.investment}" min="0" data-input="calcCost"></div>
        <div><label for="costIncluded">Investment treatment</label><select class="input" id="costIncluded" data-change="calcCost"><option value="extra">Additional expense</option><option value="included">Already included in client charges</option></select></div>
        <div><label for="costPartner">Partner payment per candidate (QAR)</label><input class="input" type="number" id="costPartner" value="0" min="0" data-input="calcCost"></div>
        <div><label for="costOther">Other expenses per candidate (QAR)</label><input class="input" type="number" id="costOther" value="0" min="0" data-input="calcCost"></div></div>
        ${UI.cards([UI.metric('Projected Revenue', UI.raw(`<span id="costRevenueResult">${esc(U.money(cost.revenue))}</span>`), 'Not yet earned'), UI.metric('Projected Cost', UI.raw(`<span id="costExpenseResult">${esc(U.money(cost.cost))}</span>`), 'Avoids double-counting'),
          UI.metric('Projected Profit', UI.raw(`<span id="costProfitResult">${esc(U.money(cost.profit))}</span>`), 'Before other unentered costs')], 'grid-template-columns:repeat(3,minmax(0,1fr))')}`);
      h += UI.panel('Accounting Rules & Approvals', `<p><b>Blue-Collar:</b> default Cash. <b>Domestic Workers:</b> default QIIB. Both can have exceptions; record transfers separately from income.</p>

  UI.on('finDivision', d => { UI.state.financeDivision = d; LGM.App.render(); });

  });
  UI.on('finExport', () => {
    if (!P.can(UI.state.role, 'finance.export')) return UI.toast('Restricted finance report', 'err');

    S.list('finance').slice().forEach(f => S.remove('finance', f.id, { silent: true, defer: true })); S.log('All finance entries cleared', '', 'finance', '', { by: UI.state.role }); S.flush(); UI.toast('Finance entries cleared', 'ok');

  const val = id => Number(document.getElementById(id).value);

    const r = M.costing({ qty: val('costQty'), revenue: val('costRevenue'), client: val('costClient'), investment: val('costInvestment'), investmentTreatment: document.getElementById('costIncluded').value, partner: val('costPartner'), other: val('costOther') });
    document.getElementById('costRevenueResult').textContent = U.money(r.revenue); document.getElementById('costExpenseResult').textContent = U.money(r.cost); document.getElementById('costProfitResult').textContent = U.money(r.profit);

  UI.on('calcCost', calcCost);
  UI.on('costCountry', v => { const d = M.costingDefaults(v); document.getElementById('costClient').value = d.client; document.getElementById('costRevenue').value = d.revenue; document.getElementById('costInvestment').value = d.investment; calcCost(); });

  // ---------------- Credentials Register ----------------
  LGM.Pages.vault = {
    render() {
      return UI.heading('Client Credentials Register', 'Restricted reference for government portal accounts and application tracking') +
        Crud.table({
          id: 'credentials', entity: 'credentials', title: 'Register Records', addLabel: '+ Add Record', search: ['client', 'portal', 'record'],
          columns: [{ label: 'Client', get: r => r.client }, { label: 'Portal', get: r => r.portal }, { label: 'Record', get: r => r.record }, { label: 'Access', get: r => UI.badge(r.access) }],
          emptyText: 'No records. This register holds descriptions only — never passwords.',
        }) +
        UI.notice('SECURITY: This register stores descriptions only. The form refuses text that looks like a password, OTP or PIN. Do not put real passwords, OTPs, government login credentials or client documents in this prototype. Production requires encrypted secrets in a vault product, role-based access, MFA and audit logging. Never expose passwords in reports or exports.');
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/app.js */
/* APP SHELL — bootstrap, router, V6 grouped navigation, header (workspace + demo role), V6 "Reports & Excel" toolbar. */
(function (g) {
  'use strict';
  const LGM = (g.LGM = g.LGM || {});
  const UI = LGM.UI, C = LGM.Config, S = LGM.Store, P = LGM.Permissions, U = LGM.Util, esc = U.esc;

  const DIVISIONS = [['labour', 'Blue-Collar Recruitment', '♙', 'orders'], ['domestic', 'Domestic Workers', '⌂', 'domestic'], ['corporate', 'Corporate Recruitment', '▤', 'corporate']];
  const LABOUR_PAGES = [['clients', 'Client CRM'], ['visits', 'Visits & Follow-ups'], ['demands', 'Demand Letters'], ['orders', 'Manpower Orders'], ['agencies', 'Overseas Agencies'], ['candidates', 'Candidates & CVs'],
    ['interviews', 'Interviews'], ['visas', 'Visa / QVC / RTP'], ['deployment', 'Deployment'], ['tickets', 'Tickets & Arrival'], ['warranty', 'Warranty']];
  const MANAGEMENT = [['visa-master', '▦', 'Master Recruitment Report'], ['reports', '▦', 'Reports & Alerts'], ['import-center', '⇧', 'Excel Import Center'], ['cv-inbox', '✉', 'CV Intake Center'],
    ['ai-reports', '✦', 'AI Reports & Exports'], ['vault', '⚿', 'Credentials Register'], ['finance', '◈', 'Private Finance'], ['settings', '⚙', 'Settings & Data']];
  const NO_TOOLBAR = ['dashboard', 'import-center', 'cv-inbox', 'vault', 'finance', 'settings', 'corporate']; // V6 shows the toolbar everywhere else (corporate has no data to report on)
  const st = UI.state; st.activeDivision = 'labour';

  function divisionOf(page) { if (page === 'domestic') return 'domestic'; if (page === 'corporate') return 'corporate'; return LABOUR_PAGES.some(p => p[0] === page) ? 'labour' : null; }

  function nav() {
    const role = st.role, page = st.page;
    let h = `<button class="${page === 'dashboard' ? 'active' : ''}" data-act="go" data-arg="dashboard" type="button">◫ &nbsp; Dashboard</button>
      <button class="v6-group" data-act="toggleRecruit" type="button" aria-expanded="${st.recruitOpen}">♧ &nbsp; Recruitment <span>${st.recruitOpen ? '▾' : '▸'}</span></button>`;
    if (st.recruitOpen) {
      h += DIVISIONS.map(([d, n, ic, p]) => `<button class="v6-sub ${st.activeDivision === d ? 'active' : ''}" data-act="chooseDivision" data-arg="${d}" type="button">${ic} &nbsp; ${n}</button>`).join('');
      if (st.activeDivision === 'labour') h += `<div class="v6-section">Blue-Collar Modules</div>` + LABOUR_PAGES.map(([p, n]) => `<button class="v6-sub ${page === p ? 'active' : ''}" data-act="go" data-arg="${p}" type="button">· ${n}</button>`).join('');
    }
    h += `<div class="v6-section">Management</div>` + MANAGEMENT.filter(x => x[0] !== 'finance' || P.can(role, 'finance.view')).map(([p, ic, n]) => `<button class="${page === p ? 'active' : ''}" data-act="go" data-arg="${p}" type="button">${ic} &nbsp; ${n}</button>`).join('');
    return h;
  }

  function tools() {
    if (NO_TOOLBAR.includes(st.page)) return '';
    const s = S.state(), f = st.filters, R = LGM.Reports;
    const clients = U.uniqSorted([...s.clients.map(c => c.name), ...s.orders.map(o => o.client), ...s.candidates.map(c => c.client)]);
    const countries = U.uniqSorted([...s.candidates.map(c => c.country), ...s.orders.map(o => o.country)]);
    const sel = (k, label, vals) => `<select data-change="tbFilter" data-k="${k}" aria-label="${label}"><option value="All">All ${label}</option>${vals.map(x => `<option ${f[k] === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
    const quick = R.quick(st.page);
    return `<section class="v6-tools"><div class="row between"><div><strong>📊 Reports & Excel</strong><div class="muted">Generate a report directly from this section</div></div>
      <div class="row"><button class="secondary" data-act="tbImport" type="button">⇧ Import Excel</button><button data-act="tbExport" type="button">⇩ Export Report (CSV)</button></div></div>
      <div class="v6-filter">${sel('client', 'Clients', clients)}${sel('country', 'Countries', countries)}<select data-change="tbFilter" data-k="stage" aria-label="Stage">${['All', ...C.stageFilters].map(x => `<option ${f.stage === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="v6-reportlinks">${quick.map(x => `<button data-act="exportReport" data-arg="${esc(x)}" type="button">${esc(x)} ↓</button>`).join('')}</div>
      <small>Reports are calculated from the records in this ${S.mode().toUpperCase()} workspace and download as CSV (opens in Excel). Native XLSX, PDF and server-side permissions need the production build.</small></section>`;
  }

  const App = {
    go(page) {
      if (page === 'finance' && !P.can(st.role, 'finance.view')) { UI.toast('Finance is restricted to the Managing Director and Admin Manager.', 'err'); page = 'dashboard'; }
      if (!LGM.Pages[page]) page = 'dashboard';
      st.page = page; const d = divisionOf(page); if (d) st.activeDivision = d;
      UI.modal.close(); App.render(); window.scrollTo(0, 0);
    },
    render() {
      const mode = S.mode(), role = st.role;
      if (st.page === 'finance' && !P.can(role, 'finance.view')) st.page = 'dashboard';
      const pill = document.getElementById('modePill'); pill.textContent = mode === 'demo' ? 'DEMO DATA' : 'LIVE DATA'; pill.className = 'mode-pill ' + (mode === 'demo' ? 'mode-demo' : 'mode-live');
      document.getElementById('role').value = role;
      document.getElementById('banner').innerHTML = (!S.isSaved() ? `<div class="banner live">⚠ Browser storage is full or disabled — changes are NOT being saved. Download a backup now (Settings & Data).</div>` : '') +
        (mode === 'demo' ? '<div class="banner demo">DEMO WORKSPACE — fictional sample data only. Not business data. Prototype: no login security or server.</div>' : '<div class="banner live">LIVE WORKSPACE — working records stored in this browser only (not encrypted, not shared, not backed up). Download backups regularly.</div>');
      document.getElementById('nav').innerHTML = nav();
      document.getElementById('foot').innerHTML = `V6 developed build<br>${mode === 'demo' ? 'Sample data' : 'Working records'} · Browser only<br>Not production secure`;
      let html;
      try { html = tools() + LGM.Pages[st.page].render(); }
      catch (e) { if (g.console) console.error(e); html = UI.panel('This page could not be displayed', `<p class="muted">An unexpected error occurred: ${esc(e.message)}</p>${UI.btn('Back to dashboard', 'go', 'dashboard')}`); }
      document.getElementById('view').innerHTML = html;
    },
  };
  LGM.App = App;

  UI.on('go', p => App.go(p));
  UI.on('goSettings', () => App.go('settings'));
  UI.on('toggleRecruit', () => { st.recruitOpen = !st.recruitOpen; App.render(); });
  UI.on('chooseDivision', d => { st.activeDivision = d; st.division = d; st.recruitOpen = true; App.go(DIVISIONS.find(x => x[0] === d)[3]); });
  UI.on('tbFilter', (v, el) => { st.filters[el.dataset.k] = v; });
  UI.on('tbImport', () => { App.go('import-center'); if (st.imp && st.imp.target !== 'candidates') UI.actions.impTarget('candidates'); });
  UI.on('tbExport', () => LGM.PageHelpers.exportReport(LGM.Reports.quick(st.page)[0], st.filters));

  function init() {
    S.init();
    const saved = S.getPref('role', 'md'); st.role = C.roles.some(r => r.id === saved) ? saved : 'md';
    const sel = document.getElementById('role'); sel.innerHTML = C.roles.map(r => `<option value="${r.id}">${esc(r.label)}</option>`).join('');
    sel.addEventListener('change', () => { st.role = sel.value; S.setPref('role', st.role); App.render(); });
    UI.wire(); S.onChange(() => App.render()); App.render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body></html>
