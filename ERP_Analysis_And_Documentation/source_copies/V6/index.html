pacing:.5px;text-transform:uppercase;background:#f8fafc}td,th{padding:13px 10px;border-bottom:1px solid #edf1f5}tr:last-child td{border:0}.btn{background:#1267a5;color:white;border:0;padding:11px 16px;border-radius:8px;font-weight:650;cursor:pointer}.btn.secondary{background:#e9f1f8;color:#245c86}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #dbe5ee;background:white;padding:9px 15px;border-radius:8px;cursor:pointer;color:#4a6781}.tab.selected{background:#145b91;color:white}.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.step{background:#eef5fb;border-radius:9px;padding:13px;font-size:12px}.step b{display:block;color:#17659c;margin-bottom:8px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.bar{background:#e8f0f6;height:10px;border-radius:20px;overflow:hidden;margin:7px 0 17px}.bar>div{height:100%;background:#2984b8;border-radius:20px}.input{border:1px solid #d8e2ec;border-radius:8px;padding:11px;width:100%;font:inherit;background:#fff}label{font-size:12px;color:#536d83;font-weight:700;display:block;margin-bottom:6px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.notice{background:#fff7e8;color:#865d18;border:1px solid #f4e0b7;padding:13px;border-radius:9px;font-size:12px;margin-top:16px}.hidden{display:none}.divider{border-top:1px solid #e8edf2;margin:20px 0}.flow{display:flex;gap:8px;flex-wrap:wrap}.flow span{background:#eaf3fb;border-radius:7px;padding:10px;font-size:12px}.flow i{font-style:normal;align-self:center;color:#8aa1b4}.metric{font-size:22px;font-weight:750}.foot{color:#8da0b1;font-size:11px;margin-top:20px}.login{display:flex;align-items:center;gap:10px}select{cursor:pointer}@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell{display:block}aside{width:100%;padding:13px}.brand{margin-bottom:8px}nav{display:flex;overflow:auto}nav </style></head><body><div class="shell"><aside><div class="brand"><div class="logo">◎</div><div><strong>LEADS GLOBAL</strong><small>MANPOWER · ERP V5 DEMO</small></div></div><nav id="nav"></nav><div class="foot" style="padding:15px">V5 trial prototype<br>Sample data only · Not secure</div></aside><main><header><div><strong>Leads Global Manpower</strong><div class="muted">Recruitment Operations Platform · Qatar</div></div><div class="login"><span class="muted">Demo role:</span><select id="role" class="input" style="width:180px" onchange="changeRole()"><option value="md">Managing Director</option><option value="nitija">Admin Manager (Nitija)</option><option value="staff">Operations Staff</option></select></div></header><div class="content" id="view"></div></main></div><script>
const menu=[['dashboard','◫','Dashboard'],['clients','▣','Client CRM'],['visits','◉','Sales Visits & Follow-ups'],['demands','▥','Demand Letters'],['orders','▤','Manpower Orders'],['agencies','◎','Overseas Agents'],['candidates','♙','Candidates & CVs'],['interviews','◷','Interviews'],['visas','▧','Visa Processing'],['visa-master','▦','All Clients Visa Summary'],['deployment','✈','Deployment'],['tickets','✈','Tickets & Arrival'],['warranty','◇','Warranty & Replacements'],['domestic','⌂','Domestic Workers'],['corporate','▥','Local Corporate'],['reports','▦','Reports & Alerts'],['vault','⚿','Credentials Register'],['finance','◈','Private Finance'],['import-center','⇧','Excel Import Center'],['cv-inbox','✉','CV Intake Center'],['ai-reports','✦','AI Reports & Exports']];let page='dashboard',division='labour',role='md',financeDivision='labour';
let financeEntries=[];
try{financeEntries=JSON.parse(localStorage.getItem('lgm_v4_finance_demo')||'[]');if(!Array.isArray(financeEntries))financeEntries=[];}catch(e){financeEntries=[];}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function addFinanceEntry(){const val=id=>document.getElementById(id).value,amount=Number(val('finAmount'));if(!val('finDate')||!val('finParty').trim()||!Number.isFinite(amount)||amount<=0){alert('Please enter a date, party and positive amount.');return;}financeEntries.push({date:val('finDate'),division:val('finDivision'),direction:val('finDirection'),account:val('finAccount'),party:val('finParty').trim(),client:val('finClient').trim(),country:val('finCountry'),order:val('finOrder').trim(),category:val('finCategory'),amount,ref:val('finRef').trim(),note:val('finNote').trim()});try{localStorage.setItem('lgm_v4_finance_demo',JSON.stringify(financeEntries));}catch(e){alert('Browser storage unavailable. Entry will be lost when page closes.');}financeDivision=val('finDivision');render();}
function clearFinance(){if(confirm('Delete ALL sample finance entries saved in this browser?')){financeEntries=[];try{localStorage.removeItem('lgm_v4_finance_demo');}catch(e){}render();}}
function exportFinance(){const tx=financeEntries.filter(t=>financeDivision==='all'||t.division===financeDivision),heads=['date','division','direction','account','party','client','country','order','category','amount','ref','note'];const csv=[heads,...tx.map(t=>heads.map(h=>t[h]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='LGM_Demo_Finance_'+financeDivision+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function calcCosts(){const n=id=>Math.max(0,Number(document.getElementById(id)?.value)||0),qty=n('costQty'),revenue=qty*n('costRevenue'),cost=qty*(n('costClient')+(document.getElementById('costIncluded').value==='extra'?n('costInvestment'):0)+n('costPartner')+n('costOther'));document.getElementById('costRevenueResult').textContent=money(revenue);document.getElementById('costExpenseResult').textContent=money(cost);document.getElementById('costProfitResult').textContent=money(revenue-cost);}
function updateCostDefaults(){const bd=document.getElementById('costCountry').value==='Bangladesh';document.getElementById('costClient').value=bd?2500:860;document.getElementById('costRevenue').value=bd?4000:1500;document.getElementById('costInvestment').value=bd?300:0;calcCosts();}
let orders=[{id:'ORD-1001',client:'Elegancia',country:'Bangladesh',trade:'Cleaners / Helpers',qty:400,status:'Interview'},{id:'ORD-1002',client:'JAAK',country:'Bangladesh',trade:'Construction Trades',qty:150,status:'CV Review'},{id:'ORD-1003',client:'USM',country:'Nepal',trade:'Cleaners',qty:100,status:'Visa Processing'},{id:'ORD-1004',client:'Attikat',country:'Nepal',trade:'Helpers',qty:30,status:'Deployment'}];let candidates=[{id:'BD-1001',name:'Demo Candidate A',client:'Elegancia',trade:'Cleaner',country:'Bangladesh',status:'CV Submitted'},{id:'BD-1002',name:'Demo Candidate B',client:'JAAK',trade:'Steel Fixer',country:'Bangladesh',status:'Selected'},{id:'NP-1003',name:'Demo Candidate C',client:'USM',trade:'Cleaner',country:'Nepal',status:'QVC'},{id:'NP-1004',name:'Demo Candidate D',client:'Attikat',trade:'Helper',country:'Nepal',status:'Visa Printed'}];const statuses=['CV Submitted','Client Review','Interview','Selected','Offer Accepted','Pre-Medical','Visa Applied','QVC','RTP','Visa Printed','Deployment Ready','Arrived','Joined','Warranty'];function money(n){return 'QAR '+Number(n).toLocaleString('en-US')}function badge(s){let c=/active|arrived|joined|printed|selected|accepted/i.test(s)?'green':/pending|review|interview|processing|QVC|RTP/i.test(s)?'orange':'grey';return `<span class="pill ${c}">${s}</span>`}function heading(t,d,action=''){return `<div class="row between"><div><div class="eyebrow">LGM / ${t}</div><h1 class="title">${t}</h1><div class="muted">${d}</div></div>${action}</div>`}function metric(l,n,sub){return `<div class="card"><div class="muted">${l}</div><div class="num">${n}</div><div class="muted">${sub}</div></div>`}function table(head,rows){return `<div style="overflow:auto"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function panel(t,body){return `<section class="panel"><h3>${t}</h3>${body}</section>`}function exportVisaSummary(){const rows=window.visaReportRows||[];const csv=[['Company','Country','Order','Applied','QVC','RTP','Printed','Deployed'],...rows].map(r=>r.join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='LGM_All_Clients_Visa_Summary_Demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){document.getElementById('nav').innerHTML=menu.filter(x=>(x[0]!=='finance'||role!=='staff')).map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')"><span style="font-size:19px">${ic}</span>${label}${id==='corporate'?' · Later':''}</button>`).join('');if(page==='finance'&&role==='staff')page='dashboard';let h='';if(page==='dashboard'){h=heading('Management Dashboard','Overview of both operating recruitment divisions')+`<div class="tabs"><button class="tab ${division==='labour'?'selected':''}" onclick="division='labour';render()">Overseas Labour · Active</button><button class="tab ${division==='domestic'?'selected':''}" onclick="division='domestic';render()">Domestic Workers · Active</button><button class="tab ${division==='corporate'?'selected':''}" onclick="division='corporate';render()">Local Corporate · Future</button></div>`;if(division==='labour'){h+=`<div class="cards">${metric('Open Orders','18','Across active clients')}${metric('CVs Received','1,240','Illustrative candidates')}${metric('Visa Pipeline','324','Across visa stages')}${metric('Ready to Fly','186','Deployment queue')}</div><div class="split">${panel('Live Recruitment Pipeline',[['CV Screening',420],['Interviews & Selection',310],['Visa Processing',324],['Ready to Deploy',186]].map(x=>`<div class="row between"><span>${x[0]}</span><strong>${x[1]}</strong></div><div class="bar"><div style="width:${x[1]/5}%"></div></div>`).join(''))}${panel('Recent Activity',table(['Client','Update'],[['Elegancia','Interview scheduling'],['JAAK','CV review pending'],['Attikat','Travel coordination'],['USM','Visa follow-up']]))}</div>`}else if(division==='domestic'){h+=`<div class="cards">${metric('Enquiries','32','Customer leads')}${metric('Profiles Shared','48','Worker CVs')}${metric('Visa Cases','14','Processing')}${metric('Handovers','9','This month')}</div>`+panel('Domestic Worker Journey',flow(['Customer Enquiry','Worker Selection','Contract & Legal Payment','Visa / QVC','Arrival & Handover','Guarantee & Refunds']))}else{h+=panel('Future Division',`<p>Local Qatar corporate recruitment has <b>not yet started</b>. When activated, the client pays a negotiated placement fee, typically half or one month of the candidate’s basic salary, with the payment trigger determined by the client agreement.</p><button class="btn secondary" onclick="go('corporate')">View future module</button>`)}h+=`<div class="notice">DEMO ONLY — All numbers, candidates and transactions are illustrative. This offline file has no login security, database, server, or live notifications.</div>`}
else if(page==='clients'){h=heading('Client CRM','Market visits → company introduction → enquiry → client order')+`<div class="cards">${metric('Clients','24','Demo records')}${metric('Visits','41','Demo month')}${metric('Follow-ups','12','Pending')}${metric('Orders Won','18','Open')}</div>`+panel('Client Register',table(['Client','Sector','Stage','Next Action'],[['Elegancia','Facility Management',badge('Active'),'Confirm interview'],['JAAK','Construction',badge('Active'),'Review CVs'],['Attikat','Contracting',badge('Active'),'Ticket follow-up'],['NICC','Construction',badge('Prospect'),'Arrange visit'],['Ismail Bin Ali','Contracting',badge('Active'),'Check demand']]))+panel('Sample Sales Visit',`<div class="formgrid"><div><label>Client</label><input class="input" value="Sample Qatar Company" readonly></div><div><label>Visit outcome</label><input class="input" value="Profile presented — follow-up required" readonly></div></div><p class="muted">A production system will record salesperson, date, contacts, notes, next follow-up and conversion to order.</p>`)}
else if(page==='orders'){h=heading('Manpower Orders','Client orders allocated to overseas agencies by country and trade',`<button class="btn" onclick="showOrderForm()">+ Sample New Order</button>`)+panel('Active Demand Orders',table(['Order','Client','Country','Trade','Qty','Stage'],orders.map(o=>[o.id,o.client,o.country,o.trade,o.qty,badge(o.status)])))+panel('Order to Deployment Workflow',flow(['Client Order','Country Allocation','Agency Sourcing','CV Review','Interviews','Selection','Offer','Visa','Deployment']))+`<div id="orderform"></div>`}
else if(page==='agencies'){h=heading('Overseas Agents','Allocate manpower demand and track each agent’s recruitment progress')+panel('Agency Allocation — Sample',table(['Agency','Country','Order','Allocated','CVs Received','Status'],[['Demo Dhaka Agency','Bangladesh','ORD-1001','250','180',badge('Sourcing')],['Demo Chattogram Agency','Bangladesh','ORD-1001','150','110',badge('CV Review')],['Demo Kathmandu Agency','Nepal','ORD-1003','100','92',badge('Interview')]]))+panel('Agency Tasks',`<div class="flow">${['Receive Demand','Submit CVs','Schedule Interviews','Send Selected List','Upload Passports','Pre-Medical','Visa & Ticket Follow-up'].map(x=>`<span>${x}</span>`).join('')}</div><p class="muted">Agents will eventually have separate secure portals showing only their own assigned orders and candidates.</p>`)}
else if(page==='candidates'){h=heading('Candidates & CVs','Candidate status is tracked individually against each client order')+panel('Candidate Register',table(['Candidate ID','Candidate','Client','Trade','Country','Current Stage','Demo Action'],candidates.map((c,i)=>[c.id,c.name,c.client,c.trade,c.country,badge(c.status),`<button class="btn secondary" onclick="advance(${i})">Next Stage →</button>`])))+panel('Full Candidate Lifecycle',flow(statuses))+`<div class="notice">Try “Next Stage” above. Changes are only in this open page and reset when the file is reopened.</div>`}
else if(page==='interviews'){h=heading('Interviews & Selection','Client CV review, Zoom interviews and overseas selection drives')+panel('Interview Events',table(['Client','Method','Country','Date','Candidates','Status'],[['Elegancia','Overseas Drive','Bangladesh','Sample date','240',badge('Scheduled')],['JAAK','Zoom','Bangladesh','Sample date','45',badge('Pending')],['USM','CV Selection','Nepal','Sample date','100',badge('Selected')]]))+panel('After Selection',flow(['Selected Candidate List','Passport & CV','Client Offer Letter','Candidate Acceptance','Pre-Medical if Required','Visa Application']))}
else if(page==='visa-master'){const records=[['Elegancia','Nepal',300,70,60,50,40,80],['JAAK','Bangladesh',150,35,30,20,15,25],['Attikat','Bangladesh',100,20,25,15,10,20],['Ismail Bin Ali','Bangladesh',150,40,35,25,20,30],['Al Habbri','Bangladesh',70,15,15,10,10,10],['USM','Nepal',100,25,20,15,10,20]];const country=window.visaCountry||'All';const query=(window.visaSearch||'').toLowerCase();const filtered=records.filter(r=>(country==='All'||r[1]===country)&&r[0].toLowerCase().includes(query));const totals=[2,3,4,5,6,7].map(i=>filtered.reduce((a,r)=>a+r[i],0));h=heading('All Clients Visa Summary','Company-wise visa status in one page — illustrative data only')+`<div class="panel"><div class="row" style="gap:12px;flex-wrap:wrap"><label>Country <select onchange="window.visaCountry=this.value;render()"><option ${country==='All'?'selected':''}>All</option><option ${country==='Nepal'?'selected':''}>Nepal</option><option ${country==='Bangladesh'?'selected':''}>Bangladesh</option></select></label><label>Client <input placeholder="Search company" value="${window.visaSearch||''}" oninput="window.visaSearch=this.value;render()"></label><button class="btn secondary" onclick="exportVisaSummary()">Export CSV for Excel</button></div></div>`+`<div class="cards">${metric('Total Demand',totals[0],'Selected clients')}${metric('Visa Applied',totals[1],'Current stage')}${metric('QVC',totals[2],'Current stage')}${metric('RTP',totals[3],'Current stage')}${metric('Visa Printed',totals[4],'Current stage')}${metric('Deployed',totals[5],'Current stage')}</div>`+panel('Company-wise Consolidated Status',table(['Company','Country','Order','Applied','QVC','RTP','Printed','Deployed','Remaining'],filtered.map(r=>[r[0],r[1],...r.slice(2),r[2]-r.slice(3).reduce((a,b)=>a+b,0)]).concat([['TOTAL','',...totals,totals[0]-totals.slice(1).reduce((a,b)=>a+b,0)]])))+`<div class="notice">Sample data only. In production this report will aggregate candidate-level records across all orders and agencies, with country, client, trade, order and date filters. Each candidate is counted in only one current stage. Click-through candidate details and secure Excel/PDF exports are development requirements.</div>`;window.visaReportRows=filtered;}
else if(page==='visas'){h=heading('Visa Processing','Apply → QVC → RTP → Print, with country-specific exceptions')+`<div class="cards">${metric('Visa Applied','175','Sample')}${metric('QVC','92','Sample')}${metric('RTP','66','Ready to print')}${metric('Visa Printed','84','Sample')}</div>`+panel('Visa Tracking',table(['Candidate','Client','Current Stage','Action'],[['Demo Candidate B','JAAK',badge('Visa Applied'),'Follow up'],['Demo Candidate C','USM',badge('QVC'),'Track appointment'],['Demo Candidate D','Attikat',badge('Visa Printed'),'Plan ticket']]))+panel('Process Stages',flow(['Offer Accepted','Pre-Medical if Required','Visa Applied','QVC if Applicable','RTP','Visa Printed']))}
else if(page==='deployment'){h=heading('Deployment & Arrival','Ticket booking, arrival notice, pickup driver and joining verification')+`<div class="cards">${metric('Ready to Fly','186','Sample')}${metric('Tickets Pending','27','Sample')}${metric('Arrival Notices','14','Sample')}${metric('Arrivals Verified','72','Sample')}</div>`+panel('Deployment Checklist',table(['Step','Responsible','Sample Status'],[['Confirm visa printed','Operations',badge('Completed')],['Request ticket / inform agent','Operations',badge('Pending')],['Send client arrival notice','Operations',badge('Pending')],['Collect pickup driver name & phone','Client',badge('Pending')],['Verify arrival and client joining','Operations',badge('Pending')],['Start applicable warranty','Operations',badge('Pending')]]))+panel('Post-Arrival',`<p>Verified arrival creates the basis for an overseas agency charge according to the applicable agreement. Finance staff separately handle payment requests, deposits, manual allocations and Managing Director approvals.</p>`)}
else if(page==='domestic'){h=heading('Domestic Workers','Active division — household client recruitment under applicable Qatar regulations')+`<div class="cards">${metric('Enquiries','32','Sample')}${metric('Workers Shared','48','Sample')}${metric('Visa Cases','14','Sample')}${metric('Handovers','9','Sample')}</div>`+panel('Domestic Worker Workflow',flow(['Customer Enquiry','Worker Profiles','Client Selection','Approved Contract','Regulated Payment','Visa & Travel','Arrival / Handover','Guarantee / Complaints']))+panel('Sample Customer Cases',table(['Case','Worker Origin','Status','Next Action'],[['DW-001','Philippines',badge('Client Selection'),'Arrange interview'],['DW-002','Bangladesh',badge('Visa Processing'),'Follow up'],['DW-003','Kenya',badge('Handover'),'Warranty tracking']]))+`<div class="notice">Fees, payment timing, guarantees, refunds and replacements must be configured and validated against current Qatar law and the signed recruitment contract.</div>`}
else if(page==='corporate'){h=heading('Local Corporate Recruitment','Planned division — not yet operational')+panel('Launch Status',`<span class="pill grey">Not Started</span><p>Future workflow: client vacancy → Qatar-local candidate sourcing → shortlist → interview → offer → joining → negotiated placement fee.</p>`)+panel('Illustrative Client Fee Calculator',`<div class="formgrid"><div><label>Candidate basic monthly salary (QAR)</label><input id="salary" class="input" type="number" min="0" value="6000" oninput="calc()"></div><div><label>Negotiated fee</label><select id="rate" class="input" onchange="calc()"><option value="1">One month's basic (100%)</option><option value="0.5">Half month's basic (50%)</option></select></div></div><div class="divider"></div><div class="muted">Sample client placement fee</div><div class="metric" id="result">QAR 6,000</div><p class="muted">Invoice milestone, payment terms and any warranty are negotiated separately with each client.</p>`)}
else if(page==='visits'){h=heading('Sales Visits & Follow-ups','Track field marketing from first company visit to confirmed manpower order')+panel('Client Visit Register',table(['Client','Contact','Visit / Follow-up','Outcome','Next Action'],[['Demo Construction Co.','HR Manager','Sample date',badge('Profile Presented'),'Call for demand'],['JAAK','Operations','Sample date',badge('Order Received'),'Confirm trade list'],['NICC','HR Department','Sample date',badge('Follow-up'),'Schedule meeting']]))+panel('Sales Pipeline',flow(['Company Identified','Profile Briefing','Client Interested','Requirement Discussion','Demand Received','Order Created']))}

async function v5CvUpload(el){let files=Array.from(el.files||[]);if(!files.length)return;let count=0;for(const file of files){const ext=file.name.split('.').pop().toLowerCase();let item={filename:file.name,size:file.size,type:ext,received:new Date().toISOString(),source:document.getElementById('cvSource')?.value||'Direct upload',client:document.getElementById('cvClient')?.value||'',agency:document.getElementById('cvAgency')?.value||'',country:document.getElementById('cvCountry')?.value||'',status:'Needs review',extracted_name:'',extracted_email:'',extracted_phone:''};try{let content='';if(['txt','csv','eml'].includes(ext))content=(await file.text()).slice(0,150000);else if(ext==='docx'){let zip=await v5ZipFiles(file);let xml=await zip.read('word/document.xml');let d=v5Xml(xml);content=v5Tag(d,'t').map(t=>t.textContent).join(' ')}else if(ext==='pdf')item.status='PDF received — extraction needs online backend';else if(['zip','rar','7z'].includes(ext))item.status='Archive received — extract files before offline import';else item.status='File received — extraction not available offline';if(content){let e=content.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i),ph=content.match(/(?:\+?\d[\d ()-]{7,}\d)/);item.extracted_email=e?.[0]||'';item.extracted_phone=ph?.[0]||'';item.status='Text extracted — review required';item.preview=content.slice(0,500)} }catch(err){item.status='Read failed: '+err.message.slice(0,80)}if(v5.cvInbox.some(x=>x.filename===item.filename&&x.size===item.size)){continue}v5.cvInbox.push(item);count++}v5Save();cvMessage=`Added ${count} file records to the demo intake list. Files themselves are NOT stored or uploaded to a server.`;render()}
function v5ExportFinance(){if(role==='staff'){alert('Restricted finance report');return}v5ExportRows('Finance_All',v5AllFinance())}
function v5ExportVisa(){const all=v5AllCandidateRecords();const clients=[...new Set(all.map(x=>x.client).filter(Boolean))];let data=clients.map(client=>{let a=all.filter(x=>x.client===client),count=s=>a.filter(x=>new RegExp(s,'i').test(x.status||'')).length;return {client,total:a.length,cv_review:count('cv|review'),interview:count('interview'),selected:count('selected|offer'),visa_applied:count('visa applied'),qvc:count('qvc'),rtp:count('rtp'),visa_printed:count('visa printed'),flight_pending:count('deployment ready|flight pending|ticket pending'),arrived:count('arrived|joined')}});v5ExportRows('Company_Wise_Visa_Status',data)}
function v5ExportAll(){v5ExportRows('Candidates',v5AllCandidateRecords())}
function v5SelectOptions(f){return `<select class="input" style="max-width:270px" onchange="v5SetMap('${f}',this.value)"><option value="">-- Not mapped --</option>${importColumns.map((c,i)=>`<option value="${i}" ${importMappings[f]===String(i)?'selected':''}>${esc(c)}</option>`).join('')}</select>`}
function renderV5Page(p){if(p==='import-center')return heading('Excel Import Center','Upload your existing projects, candidate lists and finance sheets; map columns before importing')+`<div class="notice">Offline prototype: supports CSV, TSV and standard XLSX (first worksheet) in modern Chrome. Real files should not be used until secure hosting and backups are in place. Old .xls must be saved as .xlsx. Imported records stay in this browser only.</div>`+panel('Step 1 — Select the Excel file',`<div class="row" style="gap:12px;flex-wrap:wrap"><input class="input" type="file" accept=".xlsx,.csv,.tsv,.txt" onchange="v5PickTable(this)"><button class="btn secondary" onclick="v5Backup()">Download Demo Backup</button></div><p class="muted">${esc(importMessage)}</p>`)+panel('Step 2 — Choose destination',`<div class="tabs"><button class="tab ${importTarget==='candidates'?'selected':''}" onclick="v5Target('candidates')">Candidates / Visa Status</button><button class="tab ${importTarget==='orders'?'selected':''}" onclick="v5Target('orders')">Manpower Orders</button>${role!=='staff'?`<button class="tab ${importTarget==='finance'?'selected':''}" onclick="v5Target('finance')">Private Finance</button>`:''}</div>`)+(importRows.length?panel('Step 3 — Match Excel columns',`<div class="formgrid">${v5Fields[importTarget].map(f=>`<div><label>${esc(f.replace(/_/g,' ').toUpperCase())}</label>${v5SelectOptions(f)}</div>`).join('')}</div><p class="muted">${importRows.length} rows found. Please confirm all fields, especially passport, client, country, status and finance amounts.</p><button class="btn" onclick="v5Import()">Review & Import ${importRows.length} Rows</button>`)+panel('Step 4 — Preview first five source rows',table(importColumns.map(esc),importRows.slice(0,5).map(r=>importColumns.map((_,i)=>esc(r[i]||''))))):'')+panel('Import History',table(['File','Module','Added','Duplicates','Invalid','Date'],v5.imports.slice().reverse().map(x=>[esc(x.file),esc(x.target),x.added,x.duplicates,x.invalid,esc(x.at.slice(0,10))])))+panel('Export imported data',`<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn secondary" onclick="v5ExportAll()">Export Candidates CSV</button><button class="btn secondary" onclick="v5ExportRows('Orders',v5AllOrders())">Export Orders CSV</button>${role!=='staff'?'<button class="btn secondary" onclick="v5ExportFinance()">Export Finance CSV</button>':''}</div>`);
if(p==='cv-inbox')return heading('CV Intake Center','Collect CVs from files, email attachments and WeTransfer downloads')+`<div class="notice">This offline demo cannot connect to Gmail, Outlook or WeTransfer links automatically. Download email attachments or WeTransfer archives first, then upload the files here. Do not upload real passports or sensitive CVs to this unsecured demo.</div>`+panel('Upload CVs and Attachments',`<div class="formgrid"><div><label>Source</label><select class="input" id="cvSource"><option>Direct upload</option><option>Email attachment</option><option>WeTransfer download</option><option>Overseas agency</option></select></div><div><label>Client</label><input class="input" id="cvClient" placeholder="e.g. JAAK"></div><div><label>Overseas agency</label><input class="input" id="cvAgency" placeholder="e.g. Nepal Agency A"></div><div><label>Country</label><select class="input" id="cvCountry"><option>Nepal</option><option>Bangladesh</option><option>Philippines</option><option>India</option><option>Other</option></select></div></div><p><input class="input" type="file" multiple accept=".txt,.csv,.eml,.docx,.pdf,.zip,.rar,.7z" onchange="v5CvUpload(this)"></p><p class="muted">${esc(cvMessage)}</p><p class="muted">Demo text extraction: TXT, EML and DOCX. PDFs and ZIP/RAR packages are listed for review; full OCR, PDF parsing and archive extraction require a production service.</p>`)+panel('CV Intake Review Queue',table(['File','Source','Client','Agency','Extracted Email','Status'],v5.cvInbox.slice().reverse().map(x=>[esc(x.filename),esc(x.source),esc(x.client),esc(x.agency),esc(x.extracted_email),esc(x.status)])))+panel('Export Intake Log',`<button class="btn secondary" onclick="v5ExportRows('CV_Intake_Log',v5.cvInbox)">Export CV Intake CSV</button>`)+panel('Production Automation Requirements',`<p>Connect an authorized shared recruitment mailbox via Microsoft Graph or Gmail API, download attachments securely, support WeTransfer files after authorized retrieval, unpack ZIP/RAR, extract PDF/DOCX/CV text with OCR where necessary, identify passport and trade, detect duplicates, match orders and agencies, and send uncertain matches to staff review. Never automatically share confidential documents with the wrong client.</p>`);
return heading('AI Reports & Excel Exports','Ask for pending QVC, flights, client status, agency accounts and more')+`<div class="notice">V5 uses a basic keyword-based report filter, NOT a connected AI model. It only reports on demo records and locally imported sample data. CSV opens in Excel; native .xlsx and full natural-language reporting require the production ERP.</div>`+panel('Ask for a report',`<label>Report request</label><input class="input" style="width:100%" id="v5Query" placeholder="e.g. Show QVC pending for JAAK Nepal"><p><button class="btn" onclick="v5RunReport()">Generate Excel-Compatible CSV</button></p><div class="row" style="gap:8px;flex-wrap:wrap">${['QVC pending','Flight pending','Visa printed','All candidates','All manpower orders',...(role==='staff'?[]:['All finance transactions'])].map(x=>`<button class="btn secondary" onclick="document.getElementById('v5Query').value='${x}';v5RunReport()">${x}</button>`).join('')}</div>`)+panel('One-click Exports',`<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn secondary" onclick="v5ExportVisa()">All Clients Visa Summary</button><button class="btn secondary" onclick="v5ExportRows('QVC_Pending',v5FilteredCandidates('QVC Pending'))">QVC Pending</button><button class="btn secondary" onclick="v5ExportRows('Flight_Pending',v5FilteredCandidates('Flight Pending'))">Flight Pending</button><button class="btn secondary" onclick="v5ExportRows('Manpower_Orders',v5AllOrders())">Manpower Orders</button><button class="btn secondary" onclick="v5ExportRows('CV_Intake',v5.cvInbox)">CV Intake</button>${role!=='staff'?'<button class="btn secondary" onclick="v5ExportFinance()">Private Finance</button>':''}</div>`)+panel('Imported Record Counts',`<div class="cards">${metric('Imported Candidates',v5.candidates.length,'Local demo only')}${metric('Imported Orders',v5.orders.length,'Local demo only')}${role==='staff'?'':metric('Imported Finance',v5.finance.length,'Local demo only')}${metric('CV Intake Files',v5.cvInbox.length,'Metadata only')}</div>`);
}

render();</script><style>
#nav .v6-group{width:100%;display:flex;align-items:center;justify-content:space-between;background:#23527a;color:white;border:0;border-radius:9px;padding:13px;cursor:pointer;font-weight:700;text-align:left;margin:6px 0}

</style>
<script>
// V6 extends the existing V5 demo. No server, access control or live data is provided.
let v6RecruitOpen=true;let v6ReportFilter={client:'All',country:'All',stage:'All'};
const v6Divisions=[['labour','Blue-Collar Recruitment','♙','orders'],['domestic','Domestic Workers','⌂','domestic'],['corporate','Corporate Recruitment','▤','corporate']];
const v6NavGroups=[['dashboard','◫','Dashboard'],['visa-master','▦','Master Recruitment Report'],['reports','▦','Reports & Alerts'],['import-center','⇧','Excel Import Center'],['cv-inbox','✉','CV Intake Center'],['ai-reports','✦','AI Reports & Exports'],['vault','⚿','Credentials Register'],['finance','◈','Private Finance']];
const v6PageGroups={labour:[['clients','Client CRM'],['visits','Visits & Follow-ups'],['demands','Demand Letters'],['orders','Manpower Orders'],['agencies','Overseas Agencies'],['candidates','Candidates & CVs'],['interviews','Interviews'],['visas','Visa / QVC / RTP'],['deployment','Deployment'],['tickets','Tickets & Arrival'],['warranty','Warranty']],domestic:[['domestic','Domestic Worker Cases']],corporate:[['corporate','Corporate Placements']]};
let v6ActiveDivision='labour';
function v6Toggle(){v6RecruitOpen=!v6RecruitOpen;v6RenderNav()}
function v6ChooseDivision(d,p){v6ActiveDivision=d;division=d;v6RecruitOpen=true;go(p)}
function v6RenderNav(){
 let html=`<button class="${page==='dashboard'?'active':''}" onclick="go('dashboard')">◫ &nbsp; Dashboard</button><button class="v6-group" onclick="v6Toggle()">♧ &nbsp; Recruitment <span>${v6RecruitOpen?'▾':'▸'}</span></button>`;
 if(v6RecruitOpen){html+=v6Divisions.map(([d,n,ic,p])=>`<button class="v6-sub ${v6ActiveDivision===d?'active':''}" onclick="v6ChooseDivision('${d}','${p}')">${ic} &nbsp; ${n}</button>`).join('');if(v6ActiveDivision==='labour')html+=`<div class="v6-section">Blue-Collar Modules</div>`+v6PageGroups.labour.map(([p,n])=>`<button class="v6-sub ${page===p?'active':''}" onclick="go('${p}')">· ${n}</button>`).join('')}
 html+=`<div class="v6-section">Management</div>`+v6NavGroups.filter(x=>x[0]!=='dashboard'&&(x[0]!=='finance'||role!=='staff')).map(([p,ic,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${ic} &nbsp; ${n}</button>`).join('');document.getElementById('nav').innerHTML=html;
}
const v6QuickReports={interviews:['Interview Schedule','Interview Attendance','Selected Candidates','Rejected Candidates'],visas:['QVC Pending','QVC Completed','RTP Pending','Visa Printed'],deployment:['Flight Pending','Deployment Schedule','Arrived','Joined'],tickets:['Flight Pending','Tickets Issued','Arrival Schedule'],orders:['Order Progress','Open Orders'],candidates:['Candidate List','QVC Pending'],agencies:['Agency Candidates','Agency Deployment'],warranty:['Warranty Cases'],domestic:['Domestic Worker Cases'],corporate:['Corporate Placements']};
function v6Filters(){let all=v5AllCandidateRecords();let clients=['All',...new Set(all.map(x=>x.client).filter(Boolean))];let countries=['All',...new Set(all.map(x=>x.country).filter(Boolean))];let select=(key,values)=>`<select id="v6_${key}" onchange="v6ReportFilter.${key}=this.value"><option value="All">All ${key==='client'?'Clients':'Countries'}</option>${values.filter(x=>x!=='All').map(x=>`<option value="${esc(x)}" ${v6ReportFilter[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
 return `<div class="v6-filter">${select('client',clients)}${select('country',countries)}<select id="v6_stage" onchange="v6ReportFilter.stage=this.value">${['All','QVC Pending','QVC Completed','RTP Pending','Visa Printed','Flight Pending','Arrived','Joined','Interview','Selected'].map(x=>`<option ${v6ReportFilter.stage===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
function v6ReportRows(stage){let rows=v5AllCandidateRecords();let target=stage||v6ReportFilter.stage;if(v6ReportFilter.client!=='All')rows=rows.filter(x=>x.client===v6ReportFilter.client);if(v6ReportFilter.country!=='All')rows=rows.filter(x=>x.country===v6ReportFilter.country);if(target&&target!=='All'){let re=target==='QVC Pending'?/qvc|visa applied/i:target==='QVC Completed'?/qvc completed|qvc done/i:target==='RTP Pending'?/rtp/i:target==='Flight Pending'?/visa printed|deployment ready|flight pending|ticket pending/i:target==='Interview Schedule'?/interview/i:target==='Interview Attendance'?/interview/i:target==='Selected Candidates'?/selected/i:target==='Rejected Candidates'?/rejected/i:target==='Deployment Schedule'?/deployment|printed|arrived/i:target==='Arrival Schedule'?/arrival|arrived|printed/i:target==='Tickets Issued'?/ticket|printed/i:target==='Order Progress'?/./:target==='Open Orders'?/./:new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');rows=rows.filter(x=>re.test(x.status||''));if(target==='Flight Pending')rows=rows.filter(x=>!/arrived|joined/i.test(x.status||''))}return rows}
function v6Export(stage){let rows=v6ReportRows(stage);if(!rows.length){alert('No matching records in the demo. Import your own test data or change filters.');return}v5ExportRows((stage||page).replace(/[^a-z0-9]+/gi,'_'),rows)}
function v6Import(){go('import-center');v5Target('candidates')}
function v6Tools(){if(page==='dashboard'||page==='import-center'||page==='cv-inbox'||page==='vault'||page==='finance')return '';let links=v6QuickReports[page]||['Candidate List','QVC Pending','Flight Pending'];return `<section class="v6-tools"><div class="row between"><div><strong>📊 Reports & Excel</strong><div class="muted">Generate a report directly from this section</div></div><div class="row"><button class="secondary" onclick="v6Import()">⇧ Import Excel</button><button onclick="v6Export()">⇩ Export Report (CSV)</button></div></div>${v6Filters()}<div class="v6-reportlinks">${links.map(x=>`<button onclick="v6Export('${x.replace(/'/g,'')}')">${x} ↓</button>`).join('')}</div><small>Prototype reports use sample or browser-imported candidate records. CSV opens in Excel; native XLSX, PDF, secure permissions and live reports require the production build.</small></section>`}
const v6OriginalRender=render;
render=function(){v6OriginalRender();v6RenderNav();let view=document.getElementById('view');if(view&&page!=='dashboard')view.insertAdjacentHTML('afterbegin',v6Tools());document.querySelector('.brand small').textContent='MANPOWER · ERP V6 DEMO';document.querySelector('.foot').innerHTML='V6 trial prototype<br>Sample data · Browser only<br>Not production secure'};
render();
</script></body></html>
