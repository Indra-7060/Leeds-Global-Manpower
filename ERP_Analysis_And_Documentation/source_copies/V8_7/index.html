<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads Global ERP — Data Entry Prototype</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172d49;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#152b49;color:white;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}header b{font-size:20px}header small{color:#a9c3e5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ccd6e5;border-radius:8px;padding:9px 13px;background:white;color:#183456}button.primary{background:#1766ac;color:white;border-color:#1766ac}button.danger{color:#a52929}.wrap{display:flex;min-height:calc(100vh - 70px)}nav{width:235px;background:#1d3352;color:white;padding:16px;flex-shrink:0}nav button{display:block;width:100%;text-align:left;margin:4px 0;background:transparent;color:#e7eff9;border:0}nav button.on,nav button:hover{background:#35547c}main{flex:1;padding:24px;min-width:0}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar input,.toolbar select{max-width:230px}.card{background:white;border:1px solid #dce4ef;border-radius:12px;padding:18px;margin-bottom:15px;box-shadow:0 1px 3px #d9e0e8}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#f1f6fc;border:1px solid #dbe7f3;border-radius:10px;padding:13px;cursor:pointer}.metric b{display:block;font-size:24px;color:#155e9f}.metric small{color:#52677f}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #e3e9f0;text-align:left;font-size:13px;vertical-align:top}th{background:#f0f4f9}td button{padding:5px 8px;font-size:12px}.scroll{overflow:auto}input,select,textarea{padding:9px;border:1px solid #cbd6e4;border-radius:7px;width:100%;background:white}label{display:block;font-size:12px;font-weight:600;color:#52677f;margin:8px 0 5px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.muted{color:#65768c;font-size:13px}.tag{display:inline-block;background:#e7f1fb;color:#205d92;border-radius:20px;padding:3px 8px;font-size:12px}dialog{border:0;border-radius:13px;padding:24px;width:min(860px,95vw);max-height:90vh;overflow:auto;box-shadow:0 10px 70px #2234}dialog::backdrop{background:#10243d99}h1{margin:0 0 8px}h2{margin:0 0 12px;font-size:19px}h3{margin:0 0 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.notice{background:#fff6dc;padding:10px 14px;border-radius:8px;font-size:13px;color:#785b15;margin:12px 0}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.subnav button.on{background:#dcecff;border-color:#73a9d9}.filelist{font-size:13px}.filelist a{margin-right:12px}@media(max-width:760px){.wrap{display:block}nav{width:auto;display:flex;overflow:auto;padding:7px}nav button{white-space:nowrap}main{padding:12px}}
</style></head><body><header><div><b>LEADS GLOBAL MANPOWER</b><br><small>Recruitment ERP · Editable demonstration V8.6</small></div><button onclick="backup()">⬇ Backup All Data</button></header><div class="wrap"><nav id="nav"></nav><main id="app"></main></div><dialog id="modal"><div id="modalBody"></div></dialog><input type="file" id="importFile" accept=".csv,text/csv" hidden><script>
const divisions=['Blue-Collar','Domestic','Corporate'];const schemas={
clients:[['name','Client / Sponsor name'],['division','Division','division'],['phone','Phone'],['email','Email'],['qid','Sponsor QID (Domestic)'],['notes','Notes']],
orders:[['client','Client / Sponsor','client'],['division','Division','division'],['country','Recruitment country'],['nationality','Required nationality'],['trade','Trade / Position'],['quantity','Number of people required','number'],['basicSalary','Basic salary (QAR)','number'],['food','Food allowance / provided'],['accommodation','Accommodation'],['transport','Transportation'],['workingHours','Working hours'],['contractPeriod','Contract period'],['orderDate','Order date','date'],['status','Order status'],['notes','Notes']],
agencies:[['name','Agency name'],['country','Country'],['contact','Contact'],['phone','Phone'],['notes','Notes']],
allocations:[['division','Division','division'],['client','Qatar client','client'],['order','Order reference','order'],['agency','Overseas agency','agency'],['quantity','Allocated quantity','number'],['fee','Agency fee per deployed worker (QAR)','number'],['notes','Payment terms / notes']],
candidates:[['name','Candidate full name'],['division','Division','division'],['client','Client / Sponsor','client'],['order','Order reference','order'],['agency','Overseas agency','agency'],['passport','Passport number'],['nationality','Nationality'],['country','Source country'],['trade','Trade / Role'],['stage','Current stage','stage'],['interviewDate','Interview date','date'],['qvcDate','QVC / medical date','date'],['rtpDate','RTP date','date'],['visaDate','Visa date','date'],['ticketDate','Ticket booking date','date'],['flight','Flight number'],['arrivalDate','Actual arrival date','date'],['deploymentDate','Verified deployment date','date'],['handoverDate','Sponsor handover date','date'],['warrantyEnd','Warranty expiry date','date'],['joiningDate','Corporate joining date','date'],['salary','Basic salary (QAR)','number'],['notes','Notes']],
accounts:[['division','Division','division'],['client','Client / Sponsor','client'],['agency','Agency (if payer)','agency'],['candidate','Candidate (optional)','candidate'],['payer','Payer type','payer'],['kind','Transaction type','kind'],['amount','Amount (QAR)','number'],['date','Transaction date','date'],['reference','Invoice / receipt reference'],['notes','Notes']],
documents:[['division','Division','division'],['client','Client / Sponsor','client'],['candidate','Candidate (optional)','candidate'],['type','Document type'],['notes','Notes']],
interviews:[['division','Division','division'],['client','Client / Sponsor','client'],['candidate','Candidate','candidate'],['date','Interview date','date'],['result','Result'],['notes','Feedback']],
tickets:[['division','Division','division'],['client','Client / Sponsor','client'],['candidate','Candidate','candidate'],['flight','Flight number'],['date','Flight date','date'],['status','Ticket status'],['notes','Notes']],
updates:[['division','Division','division'],['client','Client / Sponsor','client'],['candidate','Candidate','candidate'],['date','Update date','date'],['stage','New recruitment stage','stage'],['staff','Updated by'],['action','Work completed / action'],['nextAction','Next follow-up'],['dueDate','Follow-up due date','date'],['notes','Remarks']],
warranties:[['division','Division','division'],['client','Client / Sponsor','client'],['candidate','Candidate','candidate'],['start','Verified start date','date'],['end','Warranty end date','date'],['reason','Claim / complaint reason'],['status','Claim status'],['notes','Notes']]
};
const domesticWarrantyFields=[['division','Division','division'],['client','Individual sponsor','client'],['candidate','Domestic worker','candidate'],['start','Warranty start / sponsor handover date','date'],['months','Warranty period (months)','number'],['end','Warranty expiry date (automatically calculated)','date'],['reason','Complaint / claim reason'],['claimDate','Complaint received date','date'],['claimType','Claim type (Replacement / Refund / Other)'],['status','Claim status (Active / Open / Resolved / Expired)'],['replacementCandidate','Replacement worker name (if any)'],['refundAmount','Refund amount (if applicable, QAR)','number'],['resolutionDate','Claim resolved date','date'],['notes','Warranty terms / remarks']];
const titles={clients:'Clients & Sponsors',orders:'Manpower / Job Orders',agencies:'Overseas Agencies',allocations:'Client → Agency Allocations',candidates:'Candidates & Recruitment Stages',accounts:'Accounts & Collections',documents:'Documents & Uploads',interviews:'Interviews',tickets:'Deployment & Tickets',warranties:'Warranty',updates:'Daily Updates & Follow-ups'};
const corporateOrderFields=[['client','Corporate company','client'],['division','Division','division'],['trade','Job title / designation'],['quantity','Number of vacancies','number'],['nationality','Preferred nationality'],['country','Recruitment source (Qatar / overseas)'],['location','Work location'],['experience','Required experience'],['qualification','Qualification / skills'],['basicSalary','Basic monthly salary (QAR)','number'],['totalSalary','Total monthly package (QAR)','number'],['feeBasis','Placement fee basis (0.5 month / 1 month / custom)'],['customFee','Custom fee (QAR)','number'],['paymentMilestone','Invoice due after joining (months)'],['orderDate','Request date','date'],['status','Job order status'],['notes','Job description / conditions']];
const domesticOrderFields=[['client','Individual sponsor','client'],['division','Division','division'],['nationality','Preferred worker nationality'],['country','Recruitment country'],['trade','Domestic worker category (Housemaid / Cook / Driver / Nanny / Caregiver / Gardener)'],['quantity','Workers required (usually 1)','number'],['preferredAge','Preferred age range'],['language','Language preference'],['experience','Experience / skills required'],['basicSalary','Monthly salary (QAR)','number'],['food','Food arrangement'],['accommodation','Accommodation arrangement'],['contractPeriod','Contract period'],['orderDate','Request date','date'],['status','Request status'],['notes','Sponsor preferences / special instructions']];
function fieldsFor(k,r){return k==='warranties'&&(r?.division||division)==='Domestic'?domesticWarrantyFields:k==='orders'&&(r?.division||division)==='Domestic'?domesticOrderFields:k==='orders'&&(r?.division||division)==='Corporate'?corporateOrderFields:schemas[k]}
const stages=['CV Received','Interview Scheduled','Interviewed','Selected','Offer Issued','QVC Pending','QVC Completed','RTP','Visa Applied','Visa Printed','Ticket Pending','Ticket Booked','Arrived','Deployed','Handed Over','Joined','Rejected'];
let db=JSON.parse(localStorage.getItem('lgm_erp_v84')||'null')||Object.fromEntries(Object.keys(schemas).map(k=>[k,[]]));for(const k of Object.keys(schemas))if(!Array.isArray(db[k]))db[k]=[];let page='dashboard',division='Blue-Collar',clientFilter='',search='',stageFilter='';
const save=()=>localStorage.setItem('lgm_erp_v84',JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>String(Date.now())+Math.random().toString(36).slice(2,7);const money=n=>'QAR '+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});const inDiv=r=>r.division===division;
function nav(){document.getElementById('nav').innerHTML='<button class="'+(page==='dashboard'?'on':'')+'" onclick="go(\'dashboard\')">▦ Main Dashboard</button>'+divisions.map(d=>'<button class="'+(division===d?'on':'')+'" onclick="setDiv(\''+d+'\')">▸ '+d+'</button>').join('')+'<hr style="border-color:#536b89"><button class="'+(page==='updates'?'on':'')+'" onclick="go(\'updates\')">✎ Daily Data Entry</button><button onclick="go(\'clients\')">Clients / Sponsors</button><button onclick="go(\'orders\')">Orders</button>'+(division==='Blue-Collar'?'<button onclick="go(\'agencies\')">Overseas Agencies</button><button onclick="go(\'allocations\')">Agency Allocations</button>':'')+'<button onclick="go(\'candidates\')">Candidates & CVs</button><button onclick="go(\'updates\')">Daily Updates</button><button onclick="go(\'interviews\')">Interviews</button><button onclick="go(\'tickets\')">Tickets & Deployment</button>'+(division==='Domestic'?'<button onclick="go(\'warranties\')">🛡 Domestic Warranty (9 months)</button>':'<button onclick="go(\'warranties\')">Warranty</button>')+'<button onclick="go(\'documents\')">Documents</button><button onclick="go(\'accounts\')">Accounts</button>'}
function setDiv(d){division=d;clientFilter='';stageFilter='';go(d==='Domestic'?'domesticHome':'clients')}function go(p){page=p;nav();render()}function filtered(k){return db[k].filter(r=>(k==='agencies'||r.division===division)&&(!clientFilter||r.client===clientFilter)&&(!stageFilter||k!=='candidates'||r.stage===stageFilter)&&(!search||JSON.stringify(r).toLowerCase().includes(search.toLowerCase())))}
function clientOptions(){return db.clients.filter(c=>c.division===division).map(c=>c.name)}
function selectClient(){return '<select onchange="clientFilter=this.value;render()"><option value="">All clients / sponsors</option>'+clientOptions().map(c=>'<option '+(c===clientFilter?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'}
function header(t){return '<h1>'+esc(t)+'</h1><div class="muted">Division: '+esc(division)+' · Records saved in this browser on this device</div>'}
function dashboard(){let rows=divisions.map(d=>{let a=db.candidates.filter(c=>c.division===d);return '<tr><td>'+d+'</td><td>'+db.orders.filter(o=>o.division===d).length+'</td><td>'+a.filter(c=>c.stage==='Interviewed').length+'</td><td>'+a.filter(c=>c.stage==='QVC Completed').length+'</td><td>'+a.filter(c=>c.stage==='RTP').length+'</td><td>'+a.filter(c=>c.stage==='Ticket Booked').length+'</td><td>'+a.filter(c=>c.stage==='Deployed').length+'</td></tr>'}).join('');return '<h1>Recruitment Overview</h1><div class="notice">This is an editable local prototype, not a secure multi-user ERP. Do not enter real passport, QID, financial or confidential personal data.</div><div class="cards">'+[['Clients / Sponsors',db.clients.length],['Orders',db.orders.length],['Candidates',db.candidates.length],['Interview records',db.interviews.length],['Tickets',db.tickets.length],['Documents',db.documents.length]].map(x=>'<div class="metric"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('')+'</div><div class="card"><h2>Division-wise recruitment summary</h2><div class="scroll"><table><tr><th>Division</th><th>Orders</th><th>Interviewed</th><th>QVC Complete</th><th>RTP</th><th>Ticket Booked</th><th>Deployed</th></tr>'+rows+'</table></div></div><div class="card"><h2>Get started</h2><p>1. Create client/sponsor → 2. Add order → 3. Add overseas agency and allocation (Blue-Collar) → 4. Add candidates → 5. Update their stages → 6. Record deployments and payments.</p><button class="primary" onclick="go(\'clients\')">+ Add first client</button> <button onclick="restorePrompt()">Restore backup JSON</button></div>'}
function profile(name){clientFilter=name;let c=db.clients.find(x=>x.name===name&&x.division===division);let a=db.candidates.filter(x=>x.client===name&&inDiv(x));let stageCards=['CV Received','Interviewed','Selected','QVC Pending','QVC Completed','RTP','Visa Printed','Ticket Booked','Deployed','Handed Over'].map(s=>'<div class="metric" onclick="stageFilter=\''+s+'\';go(\'candidates\')"><b>'+a.filter(x=>x.stage===s).length+'</b><small>'+s+'</small></div>').join('');let allocations=db.allocations.filter(x=>x.client===name&&inDiv(x));return header('Client / Sponsor: '+name)+'<div class="toolbar"><button onclick="clientFilter=\'\';go(\'clients\')">← All clients</button><button class="primary" onclick="edit(\'orders\')">+ Add Manpower Requirement</button><button onclick="edit(\'candidates\')">+ Add Candidate</button><button onclick="go(\'accounts\')">Accounts</button><button onclick="go(\'documents\')">Documents</button>'+(division==='Domestic'?'<button class="primary" onclick="go(\'warranties\')">🛡 Sponsor Warranty (9 months)</button>':'')+'</div><div class="card"><h2>Recruitment stage counts — click to view records</h2><div class="cards">'+stageCards+'</div><p class="muted">Counters show candidates whose CURRENT stage equals the label. A production ERP must additionally store all historical milestone events.</p></div>'+(division==='Blue-Collar'?'<div class="card"><h2>Linked Overseas Agencies</h2><div class="scroll"><table><tr><th>Agency</th><th>Order</th><th>Allocation</th><th>Fee / worker</th><th>Verified deployed</th><th>Earned</th></tr>'+allocations.map(x=>{let deployed=a.filter(c=>c.agency===x.agency&&c.order===x.order&&c.deploymentDate).length;return '<tr><td>'+esc(x.agency)+'</td><td>'+esc(x.order)+'</td><td>'+esc(x.quantity)+'</td><td>'+money(x.fee)+'</td><td>'+deployed+'</td><td>'+money(deployed*Number(x.fee||0))+'</td></tr>'}).join('')+'</table></div></div>':'')+'<div class="card"><h2>Manpower requirements for this client</h2>'+table('orders',db.orders.filter(x=>x.client===name&&inDiv(x)))+'</div><div class="card"><h2>Candidate list</h2>'+table('candidates',a)+'</div>'}
function render(){nav();document.getElementById('app').innerHTML=page==='dashboard'?dashboard():page==='domesticHome'?domesticHome():page==='profile'?profile(clientFilter):page==='updates'?dailyPage():listing(page)}
function domesticHome(){let w=db.warranties.filter(r=>r.division==='Domestic');let today=new Date().toISOString().slice(0,10);let active=w.filter(r=>r.end&&r.end>=today);let expired=w.filter(r=>r.end&&r.end<today);let claims=w.filter(r=>r.reason&&r.status!=='Resolved');return header('Domestic Workers — Sponsor & Warranty Management')+`<div class="notice"><b>DOMESTIC WORKER WARRANTY — 9 MONTHS</b><p>Warranty is managed inside Domestic Recruitment. Register each sponsor and worker, record handover date, and track warranty expiry, complaints, replacement and refund cases. Actual entitlements depend on the signed contract and applicable law.</p><button class="primary" onclick="go('warranties')">🛡 Open Domestic Warranty Register</button> <button onclick="edit('warranties')">+ Register Worker Warranty</button></div><div class="cards">`+[['Sponsors',db.clients.filter(x=>x.division==='Domestic').length,'clients'],['Domestic workers',db.candidates.filter(x=>x.division==='Domestic').length,'candidates'],['Active warranties',active.length,'warranties'],['Expired warranties',expired.length,'warranties'],['Open complaints',claims.length,'warranties']].map(x=>`<button class="metric" onclick="go('${x[2]}')"><b>${x[1]}</b><small>${x[0]}</small></button>`).join('')+`</div><div class="card"><h2>Daily Domestic Operations</h2><div class="toolbar"><button class="primary" onclick="edit('clients')">+ Register Sponsor</button><button onclick="edit('orders')">+ Worker Requirement</button><button onclick="edit('candidates')">+ Add Worker</button><button onclick="go('updates')">Daily Updates</button><button onclick="go('warranties')">Warranty Records</button></div></div><div class="card"><h2>Domestic warranty register</h2><div class="scroll">`+table('warranties',w)+`</div></div>`}
function dailyPage(){let a=filtered('updates');return header('Daily Data Entry & Recruitment Updates')+'<div class="notice">Enter progress every day here. Select a client and candidate, choose the new stage, enter date, staff, work done and next follow-up. Saving an update also updates the candidate current stage.</div><div class="cards">'+[['Add Daily Update','updates'],['Register Client / Sponsor','clients'],['New Manpower / Job Requirement','orders'],['New Candidate','candidates'],['Record Interview','interviews'],['Upload Document','documents'],['Record Ticket / Flight','tickets'],['Record Payment / Invoice','accounts'],['Record Warranty Case','warranties']].map(x=>'<button class="metric" onclick="edit(\''+x[1]+'\')"><b style="font-size:17px">＋</b><small>'+x[0]+'</small></button>').join('')+'</div><div class="card"><h2>Recent Daily Updates</h2><div class="toolbar">'+selectClient()+'<button onclick="exportCSV(\'updates\')">⬇ Export Daily Updates CSV</button><button onclick="importCSV(\'updates\')">⬆ Import Updates CSV</button></div><div class="scroll">'+table('updates',a.slice().reverse())+'</div></div>'}
function listing(k){stageFilter=k==='candidates'?stageFilter:'';let a=filtered(k);return header(titles[k])+(k==='warranties'&&division==='Domestic'?'<div class="notice"><b>Domestic worker warranty: 9 months from verified sponsor handover.</b> Add one record per worker to monitor expiry, complaints, replacements and refunds. Dates and remedies must follow the signed sponsor contract and applicable Qatar rules.</div>':'')+'<div class="toolbar">'+(k!=='agencies'?selectClient():'')+'<input placeholder="Search records..." value="'+esc(search)+'" oninput="search=this.value;render()">'+(k==='candidates'?'<select onchange="stageFilter=this.value;render()"><option value="">All stages</option>'+stages.map(s=>'<option '+(stageFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>':'')+'<button class="primary" onclick="edit(\''+k+'\')">+ Add '+(k==='clients'?'Client / Sponsor':'Record')+'</button><button onclick="exportCSV(\''+k+'\')">⬇ Export CSV</button><button onclick="importCSV(\''+k+'\')">⬆ Import CSV</button></div><div class="card"><div class="scroll">'+table(k,a)+'</div></div>'+(k==='accounts'&&division==='Blue-Collar'?agentLedger():'')+'<p class="muted">Import/export works with CSV files compatible with Excel. A production ERP requires native XLSX import/export, server storage, permissions and audit trails.</p>'}
function table(k,a){let fields=fieldsFor(k,a[0]||{division}).slice(0,k==='candidates'?8:6);if(k==='warranties'&&division==='Domestic')fields=[...fieldsFor(k,{division}).slice(0,6),['remaining','Days remaining / status']];return '<table><tr>'+fields.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'<th>Actions</th></tr>'+a.map(r=>'<tr>'+fields.map(f=>'<td>'+esc(f[0]==='remaining'?(r.end?(Math.ceil((new Date(r.end+'T00:00:00Z')-new Date())/86400000)>0?Math.ceil((new Date(r.end+'T00:00:00Z')-new Date())/86400000)+' days':'Expired'):'—'):r[f[0]])+'</td>').join('')+'<td><button onclick="edit(\''+k+'\',\''+r.id+'\')">Edit</button> '+(k==='clients'?'<button onclick="clientFilter=\''+encodeURIComponent(r.name)+'\';clientFilter=decodeURIComponent(clientFilter);page=\'profile\';render()">Open</button> ':'')+(k==='documents'&&r.fileData?'<button onclick="downloadDoc(\''+r.id+'\')">Download</button> ':'')+'<button class="danger" onclick="del(\''+k+'\',\''+r.id+'\')">Delete</button></td></tr>').join('')+'</table>'+(a.length?'':'<p class="muted">No records yet. Click + Add to enter data.</p>')}
function agentLedger(){let alloc=db.allocations.filter(inDiv);return '<div class="card"><h2>Agency receivables from verified deployments</h2><div class="scroll"><table><tr><th>Client</th><th>Agency</th><th>Deployed</th><th>Earned</th><th>Payments received</th><th>Outstanding</th></tr>'+alloc.map(x=>{let n=db.candidates.filter(c=>c.division===division&&c.client===x.client&&c.agency===x.agency&&c.order===x.order&&c.deploymentDate).length;let due=n*Number(x.fee||0);let paid=db.accounts.filter(t=>t.division===division&&t.client===x.client&&t.agency===x.agency&&t.kind==='Payment received').reduce((s,t)=>s+Number(t.amount||0),0);return '<tr><td>'+esc(x.client)+'</td><td>'+esc(x.agency)+'</td><td>'+n+'</td><td>'+money(due)+'</td><td>'+money(paid)+'</td><td><b>'+money(due-paid)+'</b></td></tr>'}).join('')+'</table></div><p class="muted">Prototype illustration: payments are matched by client + agency; production must match invoice/allocation IDs and handle reversals, currency, adjustments and partial receipts.</p></div>'}
function options(type){let arr=type==='division'?divisions:type==='stage'?stages:type==='client'?clientOptions():type==='agency'?db.agencies.map(x=>x.name):type==='order'?db.orders.filter(inDiv).map(x=>x.id):type==='candidate'?db.candidates.filter(inDiv).map(x=>x.name):type==='payer'?['Overseas Agent','Qatar Company','Sponsor','Corporate Company']:type==='kind'?['Invoice','Payment received','Expense','Refund','Deposit']:[];return arr}
function edit(k,id){let r=id?db[k].find(x=>x.id===id):null;let initial=r||{division,client:clientFilter,...(k==='orders'&&division==='Domestic'?{quantity:'1'}:{}),...(k==='warranties'&&division==='Domestic'?{months:'9',status:'Active'}:{})};let body='<h2>'+(id?'Edit':'Add')+' '+titles[k]+'</h2><form id="entry" onsubmit="submitForm(event,\''+k+'\',\''+(id||'')+'\')">'+(k==='clients'?'<p class="notice">This form registers the client or sponsor. After saving, you can immediately add nationality, trade and number of people required in the Manpower Requirement form.</p>':k==='orders'?'<p class="notice">'+(division==='Domestic'?'Domestic sponsor requirement: normally one worker. Record preferred nationality, worker category, age, language, experience, salary and preferences.':'Enter one trade and nationality per requirement. Add multiple requirements for the same client as needed.')+'</p>':'')+'<div class="fields">'+fieldsFor(k,initial).map(([key,label,type])=>{let val=initial[key]??'';let control=type&&['division','stage','client','agency','order','candidate','payer','kind'].includes(type)?'<select name="'+key+'"><option value="">Select...</option>'+options(type).concat(val&&!options(type).includes(val)?[val]:[]).map(v=>'<option value="'+esc(v)+'" '+(String(v)===String(val)?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select>':'<input name="'+key+'" type="'+(type==='number'?'number':type==='date'?'date':'text')+'" '+(type==='number'?'step="any"':'')+' value="'+esc(val)+'">';return '<div><label>'+esc(label)+'</label>'+control+'</div>'}).join('')+'</div>'+(k==='documents'?'<div><label>Upload document (PDF, image, DOCX or other file; max 1 MB for this local demo)</label><input id="upload" type="file"></div>':'')+'<div class="actions"><button class="primary" type="submit">Save Record</button><button type="button" onclick="modal.close()">Cancel</button></div></form>';document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').showModal()}
async function submitForm(e,k,id){e.preventDefault();let vals=Object.fromEntries(new FormData(e.target).entries());let old=id?db[k].find(x=>x.id===id):null;let r={...(old||{}),...vals,id:id||uid()};if(k==='orders' && (!r.client||!r.trade||!r.quantity||!r.nationality)){alert('Client, required nationality, trade and number of people are required.');return}if(k==='orders'&&r.division==='Domestic'&&Number(r.quantity)<1){alert('Workers required must be at least 1.');return}if(k==='warranties'&&r.division==='Domestic'){if(!r.client||!r.candidate||!r.start){alert('Sponsor, worker and warranty start date are required.');return}let months=Number(r.months||9);if(!Number.isInteger(months)||months<1){alert('Warranty period must be a positive number of months.');return}r.months=String(months);let parts=r.start.split('-').map(Number);let d=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]));if(Number.isNaN(d.getTime())){alert('Enter a valid warranty start date.');return}let originalDay=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+months);let lastDay=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(originalDay,lastDay));r.end=d.toISOString().slice(0,10)}if(k==='updates'&&(!r.client||!r.candidate||!r.stage||!r.date)){alert('Client, candidate, date and new stage are required.');return}if(k==='documents'){let f=document.getElementById('upload').files[0];if(f){if(f.size>1048576){alert('File exceeds the 1 MB local demo limit.');return}r.fileName=f.name;r.fileType=f.type;r.fileData=await new Promise(ok=>{let reader=new FileReader();reader.onload=()=>ok(reader.result);reader.readAsDataURL(f)})}}if(id){db[k][db[k].findIndex(x=>x.id===id)]=r}else db[k].push(r);try{save()}catch(err){alert('Browser storage full. Export backup and remove large files.');return}if(k==='updates'){let cand=db.candidates.find(c=>c.division===r.division&&c.client===r.client&&c.name===r.candidate);if(cand){cand.stage=r.stage;cand.lastUpdated=r.date;cand.notes=(cand.notes||'')+' | '+r.date+': '+(r.action||r.stage);save()}}document.getElementById('modal').close();if(k==='clients'&&!id){division=r.division;clientFilter=r.name;page='profile';render();if(confirm(r.division==='Domestic'?'Sponsor saved. Add the domestic worker requirement (nationality, category, quantity and preferences) now?':'Client saved. Add nationality, trade and number of workers required now?'))edit('orders');return}render()}
function del(k,id){if(!confirm('Delete this record?'))return;db[k]=db[k].filter(x=>x.id!==id);save();render()}
function downloadDoc(id){let r=db.documents.find(x=>x.id===id);if(!r?.fileData)return;let a=document.createElement('a');a.href=r.fileData;a.download=r.fileName||'document';a.click()}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function exportCSV(k){let keys=fieldsFor(k,{division}).map(f=>f[0]);let data=[keys.join(','),...filtered(k).map(r=>keys.map(f=>csvCell(r[f])).join(','))].join('\r\n');download(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}),division.replace(/\W/g,'_')+'_'+k+'.csv')}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
function importCSV(k){let f=document.getElementById('importFile');f.value='';f.onchange=async()=>{let txt=await f.files[0].text();let rows=parseCSV(txt);let keys=rows.shift().map(x=>x.trim());let valid=fieldsFor(k,{division}).map(x=>x[0]);if(!keys.some(x=>valid.includes(x))){alert('CSV headers do not match. Export a CSV template first.');return}let count=0;for(let row of rows){if(!row.some(Boolean))continue;let obj={id:uid(),division};keys.forEach((key,i)=>{if(valid.includes(key))obj[key]=row[i]||''});db[k].push(obj);count++}save();render();alert(count+' records imported. Review for duplicates.')} ;f.click()}
function parseCSV(s){let out=[],row=[],cell='',quote=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quote&&s[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);out.push(row)}return out}
function backup(){download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),'LGM_ERP_LOCAL_BACKUP.json')}
function restorePrompt(){let inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{try{let x=JSON.parse(await inp.files[0].text());if(!Object.keys(schemas).every(k=>Array.isArray(x[k])))throw Error('Invalid structure');if(confirm('Replace all current demo data with this backup?')){db=x;save();render()}}catch(e){alert('Invalid backup: '+e.message)}};inp.click()}
render();
